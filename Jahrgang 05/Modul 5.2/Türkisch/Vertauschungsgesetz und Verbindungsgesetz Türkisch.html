<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hesaplama Dersi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Karoheft-Look der ZP10-App. Die Startseite ist ein Stationsraster: Themen als Zeilen, die drei Buchfarben als Spalten. */
:root{
  --bg:#EDF1F8; --grid:rgba(35,87,201,.08); --surface:#FFFFFF; --surface-2:#F2F5FB; --ink:#10204A; --ink-soft:#4F5A78; --line:#C9D2E3;
  --head:#0F1E46; --accent:#FFC93C; --accent-ink:#2A1E00; --blue:#2357C9; --blue-soft:#DDE7FA;
  --ok:#1F8A5B; --ok-soft:#DCF2E6; --bad:#BC2F2F; --bad-soft:#FBE3E3;
  --o:#B84E06; --o-soft:#FDE7D4; --p:#B01A6C; --p-soft:#FBDEEC; --l:#5A3DB0; --l-soft:#E8E2F8;
  --gridline:#D3DCEE;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1230; --grid:rgba(140,170,255,.06); --surface:#121C42; --surface-2:#18245A; --ink:#ECF0FA; --ink-soft:#A6B0D2; --line:#2C3A78;
  --head:#060C24; --accent:#FFCF4D; --accent-ink:#231800; --blue:#7FAAF5; --blue-soft:#1C2B66;
  --ok:#4CC48A; --ok-soft:#113A2A; --bad:#F58A8A; --bad-soft:#431C24;
  --o:#F7A25F; --o-soft:#3B2614; --p:#F58CC4; --p-soft:#431B38; --l:#B89AF0; --l-soft:#2A1E52; --gridline:#26346F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1230; --grid:rgba(140,170,255,.06); --surface:#121C42; --surface-2:#18245A; --ink:#ECF0FA; --ink-soft:#A6B0D2; --line:#2C3A78;
  --head:#060C24; --accent:#FFCF4D; --accent-ink:#231800; --blue:#7FAAF5; --blue-soft:#1C2B66;
  --ok:#4CC48A; --ok-soft:#113A2A; --bad:#F58A8A; --bad-soft:#431C24;
  --o:#F7A25F; --o-soft:#3B2614; --p:#F58CC4; --p-soft:#431B38; --l:#B89AF0; --l-soft:#2A1E52; --gridline:#26346F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{background:var(--head);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;color:#fff;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
.top{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#FFD866}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2}
.brand em{font-style:normal;background:linear-gradient(transparent 58%,rgba(255,201,60,.55) 58%)}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:transparent;border:0;border-radius:10px 10px 0 0;padding:9px 14px;color:#C6D5F5;font-weight:700;white-space:nowrap}
nav button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;min-width:0}
main>section{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(15,30,70,.07);min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.stack{display:grid;gap:10px}
.muted{color:var(--ink-soft)}
.small{font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:17px;transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:15px}
/* Farbstufen */
.c-o{--c:var(--o);--cs:var(--o-soft)} .c-p{--c:var(--p);--cs:var(--p-soft)} .c-l{--c:var(--l);--cs:var(--l-soft)}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c);background:var(--cs);border-radius:999px;padding:3px 11px;font-size:14px}
.pips{display:inline-flex;gap:2px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--c);opacity:.28}
.pips i.f{opacity:1}
/* Stationsraster */
.gridhead,.st{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,92px);gap:8px;align-items:center}
.gridhead{padding-inline:2px;font-size:14px}
.gridhead span{justify-self:center}
.st{padding-block:10px;border-top:1px solid var(--line)}
.st h3{margin-bottom:2px}
.cell{border:2px solid var(--c);background:var(--cs);color:var(--c);border-radius:12px;min-height:58px;padding:6px 4px;font-weight:700;display:grid;place-items:center;line-height:1.15;font-size:14px}
.cell b{font-family:var(--f-display);font-size:18px}
.cell.done{background:var(--c);color:var(--surface)}
.cell.next{box-shadow:0 0 0 3px var(--accent)}
@media(max-width:600px){.gridhead{display:none}.st{grid-template-columns:repeat(3,minmax(0,1fr))}.st>div:first-child{grid-column:1/-1}.cell .nm{display:block}}
@media(min-width:601px){.cell .nm{display:none}}
.nextbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.total{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.total div{height:100%;background:var(--ok);transition:width .3s}
/* Aufgabe */
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qt{font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin-inline:1px}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding-inline:2px}
.tw{overflow-x:auto;max-width:100%}
table.z{border-collapse:collapse;margin-block:2px}
table.z th,table.z td{border:1.5px solid var(--c,var(--blue));padding:7px 10px;text-align:center;min-width:44px}
table.z th{background:var(--cs,var(--blue-soft));font-weight:700;font-size:15px;text-align:left;max-width:150px}
table.z input,.numin{background:var(--surface);border:2px solid var(--line);border-radius:8px;text-align:center;width:66px;padding:5px 2px}
table.ds td.op{white-space:nowrap;border:0;background:none;color:var(--c);font-weight:700;min-width:36px;padding:0 4px;font-size:15px;position:relative}
table.z td.v{padding:5px}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.fix{display:block;font-size:14px;font-weight:700;color:var(--ok)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.optk{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:14px}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin{width:130px;text-align:left;padding:10px 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .opt{padding:9px 14px}
svg.g{display:block;width:100%;max-width:420px;height:auto;touch-action:manipulation}
svg.g .gl{stroke:var(--gridline);stroke-width:1}
svg.g .ax{stroke:var(--ink);stroke-width:1.6}
svg.g text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-body)}
svg.g .lb{fill:var(--ink);font-weight:700}
svg.g .cv{stroke:var(--blue);stroke-width:2.5;fill:none}
svg.g .pt{fill:var(--blue)} svg.g .pt.ok{fill:var(--ok)} svg.g .pt.no{fill:var(--bad)} svg.g .pt.mk{fill:var(--c,var(--blue))}
svg.g .hit{fill:transparent;cursor:pointer}
.tip{background:var(--blue-soft);border-radius:12px;padding:10px 14px}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.y{background:var(--ok-soft)} .fb.n{background:var(--bad-soft)}
.fb b.h{font-family:var(--f-display)}
.fb ol{margin:0;padding-left:20px}
.pr{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pr div{height:100%;background:var(--c,var(--blue));transition:width .2s}
/* Ergebnis */
.big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;color:var(--c,var(--ink))}
.rv{border-top:1px solid var(--line);padding-block:12px;display:grid;gap:6px}
.rv .mk{font-weight:700}
.rv .y{color:var(--ok)} .rv .n{color:var(--bad)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;font-size:15px}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--ok)}
/* Merkzettel */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}
.m-p{--c:var(--blue);--cs:var(--blue-soft)}
ol.st3,ul.st3{margin:0;padding-left:20px;display:grid;gap:4px}
.f{display:grid;gap:4px;font-weight:700;font-size:15px}
.f input{font-weight:400;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
textarea{position:absolute;left:-9999px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--head);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Ergänzungen Diagramm-App */
.big2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.streak{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 9px;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{border:1.5px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:14px;color:var(--ink-soft)}
.badge.on{border:1.5px solid var(--c);background:var(--cs);color:var(--c);font-weight:700}
.fig{min-width:0}.fig p{margin-bottom:6px}
svg.dg{max-width:440px;touch-action:none;user-select:none;-webkit-user-select:none}
.fig svg.dg,.opt svg.dg,.three svg.dg,.m-p svg.dg,.rv svg.dg{touch-action:auto}
svg.dg .tt{fill:var(--ink);font-weight:700;font-size:13px;font-family:var(--f-display)}
svg.dg .cat{fill:var(--ink);font-size:11px}
svg.dg .sbar{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.4}
svg.dg .dbar{fill:var(--cs,var(--blue-soft));stroke:var(--c,var(--blue));stroke-width:2}
svg.dg .dbar.no{fill:var(--bad-soft);stroke:var(--bad)}
svg.dg .dbar.ok{fill:var(--ok-soft);stroke:var(--ok)}
svg.dg .ghost{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-dasharray:6 4}
svg.dg .hi{fill:none;stroke:var(--c,var(--blue));stroke-width:3}
svg.dg .hit{fill:transparent;cursor:ns-resize}
svg.dg .hit:focus-visible{outline:none;stroke:var(--blue);stroke-width:2}
svg.dg .tk{fill:var(--accent);stroke:var(--ink);stroke-width:1}
svg.dg .tke{fill:var(--ink)}svg.dg .tkm{fill:none;stroke:var(--ink);stroke-width:1.3}
svg.dg .tkh{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
svg.tally line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.tallybox{display:inline-flex;gap:14px;align-items:center;flex-wrap:wrap}
td.tl{text-align:left!important}
svg.mini{width:96px;height:auto;display:block}
svg.mini .ax{stroke:var(--ink);stroke-width:1.6}
svg.mini text{fill:var(--ink);font-size:11px;font-family:var(--f-body)}
.opts.wide{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.opts.rowo{grid-template-columns:repeat(3,minmax(0,1fr))}
.optb{min-width:0;flex:1}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ur{display:flex;flex-wrap:wrap;gap:6px}
.ur span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:15px}
.marktext{font-size:19px;line-height:1.95}
.mk{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;font-weight:700}
.mk[aria-pressed="true"]{border-color:var(--c);background:var(--cs);color:var(--c)}
.pick{display:grid;gap:6px}
.wait{border:2px dashed var(--line);border-radius:12px;padding:30px 16px;text-align:center;color:var(--ink-soft)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.three>div{min-width:0;display:grid;gap:6px;align-content:start}
.mk2{font-weight:700}.mk2.y{color:var(--ok)}.mk2.n{color:var(--bad)}
.fb ul.st3,.fb ol.st3{padding-left:20px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf i{position:absolute;top:-60px;width:9px;border-radius:2px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
/* Ergänzungen Rechengesetze */
.eq{font-family:var(--f-display);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.qt .eq{display:inline-block;margin-top:4px;font-size:22px;white-space:normal}
.big-t{font-size:19px;line-height:1.5}
.big2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.streak{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 9px;font-weight:700}
.fig{min-width:0}
svg.tree{display:block;width:100%;max-width:300px;height:auto}
svg.tree .tb{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
svg.tree .tb.m{fill:var(--surface-2)}
svg.tree .tv{fill:var(--ink);font-family:var(--f-display);font-size:15px;font-weight:700}
svg.tree .tl{stroke:var(--ink-soft);stroke-width:1.6}
svg.tree .tc{fill:var(--blue);stroke:none}
svg.tree .to{fill:#fff;font-weight:700;font-size:13px;font-family:var(--f-body)}
.pair2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px;align-items:start}
.opts.wide{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.opts{display:grid}
.optb{min-width:0;flex:1}
.optb .eq{white-space:normal}
.fields2{display:grid;gap:10px}
.fl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:20px}
.numin.sm{width:96px;text-align:center;padding:8px 6px}
.fl .fix{display:inline;margin-left:4px}
.lines{display:grid;gap:12px}
.ln{display:grid;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.ln .eq{font-size:20px;white-space:normal}
.opt.sm{padding:7px 12px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-display);font-weight:700;font-size:22px;min-width:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--c,var(--blue));background:var(--surface);color:var(--ink)}
.chip.on{background:var(--c,var(--blue));color:var(--surface)}
.chip:disabled{opacity:.85;cursor:default}
.plus{font-weight:700;color:var(--ink-soft);font-size:20px}
.steps{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.steps .eq{font-size:19px}
.lw{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:6px;color:var(--c);background:var(--cs)}
.lw.c-ok{color:var(--ok);background:var(--ok-soft)}
.badtx{color:var(--bad);font-weight:700}
.rulep{font-size:19px;line-height:2.3}
.gapw{display:inline-flex;gap:6px;flex-wrap:wrap;border:2px dashed var(--line);border-radius:12px;padding:3px 5px;margin-inline:3px;vertical-align:middle;line-height:1.3}
.merk{border:2px solid var(--l);background:var(--l-soft);border-radius:12px;padding:12px 14px;font-weight:700;font-size:18px;color:var(--ink)}
.tip.tc1{background:var(--o-soft)}.tip.tc2{background:var(--p-soft)}
.tip.warn{background:var(--bad-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.fcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.fcard.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.fcard.done{border-color:var(--l);background:var(--l-soft)}
.fnum{font-family:var(--f-display);font-weight:700;font-size:22px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--l);color:var(--surface)}
.fst{font-size:24px;color:var(--accent)}
.linkb{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0}
.vocab{display:grid;gap:12px}
.vocab .eq{font-size:26px}
.c1{color:var(--o)}.c2{color:var(--p)}.c3{color:var(--l)}
.laws{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.laws>div{display:grid;gap:4px;background:var(--surface-2);border-radius:12px;padding:12px}
.laws .eq{font-size:20px;white-space:normal}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf i{position:absolute;top:-60px;width:9px;border-radius:2px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
.path{display:flex;align-items:center;gap:0;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.pst{flex:none;min-width:34px;height:34px;padding-inline:8px;border-radius:17px;display:grid;place-items:center;font-weight:700;font-size:14px;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.35)}
.pst.done{background:var(--ok);border-color:var(--ok)}
.pst.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pln{flex:1 1 12px;min-width:8px;height:2px;background:rgba(255,255,255,.35)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header><div class="wrap">
  <div class="top">5. sınıf · Ders: Hesaplama özellikleri · Kitap s. 38</div>
  <div class="brand">Matematik dersi <em>Akıllıca hesaplamak</em></div>
  <div class="path" id="path" aria-label="Fortschritt"></div>
</div></header>
<main>
  <section id="vIn"></section><section id="vLearn" hidden></section><section id="vHome" hidden></section><section id="vMemo" hidden></section><section id="vTask" hidden></section><section id="vRes" hidden></section>
</main>
<div id="toast" role="status"></div>
<script>
const LANG='tr';const APPKEY='stunde-rechengesetze-v1';
/* ---------- Sprache und Hilfen ---------- */
const TRK=LANG==='tr';
const t=(d,r)=>TRK?r:d;
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sum=a=>a.reduce((x,y)=>x+y,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>String(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain=s=>String(s).replace(/\*\*/g,'').replace(/<br>/g,' ').replace(/<[^>]+>/g,'');
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(/\./g,'');if(!/^-?\d+$/.test(s))return NaN;return parseInt(s,10);}
const M='−';
const term=(n,ops)=>n.map((v,i)=>i?` ${ops?ops[i-1]:'+'} ${v}`:String(v)).join('');
const LV={o:'Orange',p:'Pink',l:t('Lila','Mor')},LVS=['o','p','l'];
const LAW={v:t('Vertauschungsgesetz','Değişme özelliği'),b:t('Verbindungsgesetz','Birleşme özelliği'),k:t('Klammerregel','Parantez kuralı')};
const LAWF={v:t('Vertauschungsgesetz (Kommutativgesetz)','Değişme özelliği (Vertauschungsgesetz)'),b:t('Verbindungsgesetz (Assoziativgesetz)','Birleşme özelliği (Verbindungsgesetz)'),k:t('Klammerregel','Parantez kuralı (Klammerregel)')};
const NOT=t('Das stimmt nicht','Bu doğru değil');

/* ---------- Zahlen ---------- */
const NZ=(lo,hi)=>{let a;do a=ri(lo,hi);while(a%10===0);return a;};
function pair10(lo,hi,mx){let a,b;do{a=NZ(lo,hi);b=(10-a%10)+10*ri(0,mx==null?3:mx);}while(b<2||b===a);return[a,b];}
function pair100(){let a;do a=ri(12,88);while(a%10===0||a===50);return[a,100-a];}
function filler(nums,lo,hi,base){base=base||10;let n,tries=0;do{n=NZ(lo,hi);tries++;}while(tries<200&&(nums.includes(n)||nums.some(x=>(x+n)%base===0||(x+n)%10===0)));return n;}
/* friendly set: liefert Zahlen und die Paare */
function fset(l){
 if(l==='o'){const p=pair10(11,48,1),f=filler(p,11,49);return{n:shuffle([...p,f]),pairs:[p],base:10};}
 if(l==='p'){let p1,p2;do{p1=pair10(11,58,2);p2=pair10(11,58,2);}while(new Set([...p1,...p2]).size<4||(p1[0]+p2[0])%10===0||(p1[0]+p2[1])%10===0);const n=shuffle([...p1,...p2]);return{n,pairs:[p1,p2],base:10};}
 let p1,p2;do{p1=pair100();p2=pair100();}while(new Set([...p1,...p2]).size<4||[p1[0]+p2[0],p1[0]+p2[1],p1[1]+p2[0],p1[1]+p2[1]].some(x=>x%10===0));const f=filler([...p1,...p2],11,89,100);return{n:shuffle([...p1,...p2,f]),pairs:[p1,p2],base:100};}
const round=(x,b)=>x%b===0;
const NAMES=['Louis','Mika','Karl','Aylin','Emir','Lina','Zeynep','Yusuf','Mia','Noah','Elif','Ben'];

/* ---------- Rechenbaum ---------- */
/* n = drei Zahlen, o = 'L' (zuerst die ersten beiden) oder 'R', ops = Rechenzeichen [erstes, zweites] im Baum, mid/end = Beschriftung */
function tree(n,o,ops,mid,end,cls){ops=ops||['+','+'];const bx=[14,108,202],bw=46,bh=30,c=i=>bx[i]+bw/2;
 let s=`<svg class="tree ${cls||''}" viewBox="0 0 262 196" role="img" aria-label="${esc(t('Rechenbaum','İşlem ağacı'))}">`;
 const box=(x,y,txt,k)=>`<rect class="tb ${k||''}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5"/><text class="tv" x="${x+bw/2}" y="${y+20}" text-anchor="middle">${esc(txt)}</text>`;
 const p=o==='L'?[0,1]:[1,2],q=o==='L'?2:0,mx=(c(p[0])+c(p[1]))/2,fx=(mx+c(q))/2;
 s+=`<line class="tl" x1="${c(p[0])}" y1="36" x2="${mx}" y2="62"/><line class="tl" x1="${c(p[1])}" y1="36" x2="${mx}" y2="62"/><line class="tl" x1="${mx}" y1="74" x2="${mx}" y2="84"/>`;
 s+=`<line class="tl" x1="${mx}" y1="114" x2="${fx}" y2="140"/><line class="tl" x1="${c(q)}" y1="36" x2="${fx}" y2="140"/><line class="tl" x1="${fx}" y1="152" x2="${fx}" y2="160"/>`;
 n.forEach((v,i)=>s+=box(bx[i],6,v));
 s+=`<circle class="tc" cx="${mx}" cy="68" r="9"/><text class="to" x="${mx}" y="72.5" text-anchor="middle">${ops[0]}</text>`;
 s+=box(mx-bw/2,84,mid==null?'':mid,'m');
 s+=`<circle class="tc" cx="${fx}" cy="146" r="9"/><text class="to" x="${fx}" y="150.5" text-anchor="middle">${ops[1]}</text>`;
 s+=box(fx-bw/2,160,end==null?'':end,'m');
 return s+'</svg>';}

/* ---------- Aufgaben-Bausteine ---------- */
function MC(q,right,wrong,x){const o=[right].concat(wrong.map(w=>w[0])),why=[null].concat(wrong.map(w=>w[1]));return Object.assign({type:'mc',q,o,c:0,why},x||{});}
const NUM=(q,ans,x)=>Object.assign({type:'num',q,ans},x||{});
const MULTI=(q,fields,x)=>Object.assign({type:'multi',q,fields},x||{});
const TIPS=(a,b)=>[a,b];
const GEN=[];
function gen(t_,l,id,make){(Array.isArray(l)?l:[l]).forEach(x=>GEN.push({t:t_,l:x,id,make:()=>make(x)}));}

/* ===== Station 1: Gesetz erkennen ===== */
const lawOpts=(k,extra)=>{const keys=['v','b','k'].concat(extra?['x']:[]);return keys;};
function lawMC(eq,k,extra,sol){const keys=['v','b','k'].concat(extra?['x']:[]);const name=x=>x==='x'?NOT:LAW[x];
 const why={v:t('Beim Vertauschungsgesetz wechseln die Zahlen ihren Platz.','Değişme özelliğinde sayıların yerleri değişir.'),b:t('Beim Verbindungsgesetz bleiben die Zahlen am Platz. Nur die Klammer wird anders gesetzt.','Birleşme özelliğinde sayılar yerinde kalır. Sadece parantez farklı konur.'),k:t('Bei der Klammerregel wird die Klammer ausgerechnet.','Parantez kuralında önce parantezin içi hesaplanır.'),x:t('Bei Minus gelten die Gesetze nicht.','Çıkarmada bu özellikler geçerli değildir.')};
 return MC(t(`Welche Regel wurde hier benutzt?<br><span class="eq">${eq}</span>`,`Burada hangi kural kullanıldı?<br><span class="eq">${eq}</span>`),name(k),keys.filter(x=>x!==k).map(x=>[name(x),t('Das passt nicht. ','Bu uymuyor. ')+why[k]]),{tips:TIPS(t('Vergleiche links und rechts: Haben die Zahlen den Platz getauscht? Oder hat sich nur die Klammer bewegt?','Sol ve sağ tarafı karşılaştır: Sayılar yer mi değiştirdi? Yoksa sadece parantez mi kaydı?'),t('Tauschen = Vertauschungsgesetz. Klammer verschieben = Verbindungsgesetz. Klammer ausrechnen = Klammerregel.','Yer değiştirme = Değişme özelliği. Parantezi kaydırma = Birleşme özelliği. Parantezi hesaplama = Parantez kuralı.')),sol:sol||[why[k]]});}
gen('law',['o','p','l'],'g-v',l=>{const r=l==='o'?[11,49]:l==='p'?[11,99]:[101,499],a=ri(...r),b=ri(...r),c=ri(...r);return l==='o'?lawMC(`${a} + ${b} = ${b} + ${a}`,'v'):lawMC(`${a} + ${b} + ${c} = ${a} + ${c} + ${b}`,'v');});
gen('law',['o','p','l'],'g-b',l=>{const r=l==='o'?[11,49]:l==='p'?[11,99]:[101,499],a=ri(...r),b=ri(...r),c=ri(...r);return pick([lawMC(`(${a} + ${b}) + ${c} = ${a} + (${b} + ${c})`,'b'),lawMC(`${a} + ${b} + ${c} = ${a} + (${b} + ${c})`,'b')]);});
gen('law',['o','p'],'g-k',l=>{const [b,c]=pair10(11,39,1),A=ri(b+c+5,b+c+60);return lawMC(`${A} ${M} (${b} + ${c}) = ${A} ${M} ${b+c}`,'k');});
gen('law',['p','l'],'g-k2',l=>{const p=l==='p'?pair10(11,59,2):pair100(),c=ri(11,89);return lawMC(`(${p[0]} + ${p[1]}) + ${c} = ${p[0]+p[1]} + ${c}`,'k');});
gen('law','l','g-x',()=>{const a=ri(40,99),b=ri(11,a-10);return lawMC(`${a} ${M} ${b} = ${b} ${M} ${a}`,'x',true,[t(`${a} ${M} ${b} = ${a-b}. Aber ${b} ${M} ${a} kannst du mit natürlichen Zahlen nicht rechnen.`,`${a} ${M} ${b} = ${a-b}. Ama ${b} ${M} ${a} doğal sayılarla hesaplanamaz.`),t('Bei Minus darfst du nicht tauschen.','Çıkarmada yer değiştiremezsin.')]);});
gen('law','l','g-x2',()=>{const a=10*ri(5,9),b=ri(12,29),c=ri(3,9);return lawMC(`(${a} ${M} ${b}) ${M} ${c} = ${a} ${M} (${b} ${M} ${c})`,'x',true,[t(`Links: ${a-b} ${M} ${c} = ${a-b-c}. Rechts: ${a} ${M} ${b-c} = ${a-b+c}.`,`Sol: ${a-b} ${M} ${c} = ${a-b-c}. Sağ: ${a} ${M} ${b-c} = ${a-b+c}.`),t('Bei Minus darfst du die Klammer nicht verschieben.','Çıkarmada parantezi kaydıramazsın.')]);});
/* Lösungsweg zuordnen wie im Buch */
function linesTask(l){let f;do{f=fset(l);}while(f.n[0]===f.pairs[0][0]&&f.n[1]===f.pairs[0][1]);const n=f.n,[p1,p2]=f.pairs;let rows;
 if(f.pairs.length===1){const rest=n.filter(x=>!p1.includes(x))[0],s1=p1[0]+p1[1];rows=[[`${p1[0]} + ${p1[1]} + ${rest}`,'v'],[`(${p1[0]} + ${p1[1]}) + ${rest}`,'b'],[`${s1} + ${rest}`,'k'],[`${s1+rest}`,null]];}
 else{const rest=n.filter(x=>!p1.includes(x)&&!p2.includes(x)),s1=p1[0]+p1[1],s2=p2[0]+p2[1],tail=rest.length?' + '+rest[0]:'';rows=[[`${p1[0]} + ${p1[1]} + ${p2[0]} + ${p2[1]}${tail}`,'v'],[`(${p1[0]} + ${p1[1]}) + (${p2[0]} + ${p2[1]})${tail}`,'b'],[`${s1} + ${s2}${tail}`,'k'],[`${s1+s2+(rest[0]||0)}`,null]];}
 return {type:'lines',q:t(`Ordne jedem Schritt die Regel zu.<br><span class="eq">${term(n)}</span>`,`Her adıma kuralını eşleştir.<br><span class="eq">${term(n)}</span>`),rows,tips:TIPS(t('Schau, was sich von einer Zeile zur nächsten ändert.','Bir satırdan diğerine neyin değiştiğine bak.'),t('Erst wird getauscht, dann werden Klammern gesetzt, dann wird die Klammer ausgerechnet.','Önce yer değiştirilir, sonra parantez konur, sonra parantezin içi hesaplanır.')),sol:[t('1. Zeile: Die Zahlen tauschen ihren Platz → Vertauschungsgesetz.','1. satır: Sayılar yer değiştirir → Değişme özelliği.'),t('2. Zeile: Klammern fassen zusammen → Verbindungsgesetz.','2. satır: Parantezler birleştirir → Birleşme özelliği.'),t('3. Zeile: Die Klammern werden ausgerechnet → Klammerregel.','3. satır: Parantezler hesaplanır → Parantez kuralı.')]};}
gen('law',['p','l'],'g-lines',linesTask);
gen('law','o','g-lines',()=>linesTask('o'));

/* ===== Station 2: Partner finden ===== */
const pairTip=b=>b===100?TIPS(t('Suche zwei Zahlen, die zusammen einen vollen Hunderter ergeben.','Toplamı tam yüzlük olan iki sayı ara.'),t('Schau zuerst auf die Einer: Sie müssen zusammen 10 ergeben. Dann auf die Zehner.','Önce birlere bak: toplamları 10 olmalı. Sonra onluklara bak.')):TIPS(t('Suche zwei Zahlen, die zusammen einen vollen Zehner ergeben.','Toplamı tam onluk olan iki sayı ara.'),t('Schau nur auf die Einer. Welche zwei Einer ergeben zusammen 10?','Sadece birler basamağına bak. Hangi iki birlik toplamı 10 eder?'));
gen('part',['o','p','l'],'p-game',l=>{const f=fset(l);return{type:'pair',q:t(`Rechne geschickt: <span class="eq">${term(f.n)}</span><br>Tippe zwei Zahlen an, die du zuerst addierst.`,`Akıllıca hesapla: <span class="eq">${term(f.n)}</span><br>Önce toplayacağın iki sayıya dokun.`),n:f.n,pairs:f.pairs,base:f.base,tips:pairTip(f.base),sol:[f.pairs.map(p=>`${p[0]} + ${p[1]} = ${p[0]+p[1]}`).join(', '),t(`Ergebnis: ${sum(f.n)}`,`Sonuç: ${sum(f.n)}`)]};});
gen('part',['o','p','l'],'p-which',l=>{const f=fset(l),p=f.pairs[0];const all=[];for(let i=0;i<f.n.length;i++)for(let j=i+1;j<f.n.length;j++)all.push([f.n[i],f.n[j]]);const bad=shuffle(all.filter(x=>!round(x[0]+x[1],10))).slice(0,2);
 return MC(t(`Welche zwei Zahlen addierst du bei <span class="eq">${term(f.n)}</span> am besten zuerst?`,`<span class="eq">${term(f.n)}</span> işleminde önce hangi iki sayıyı toplamak en iyisi?`),`${p[0]} + ${p[1]}`,bad.map(x=>[`${x[0]} + ${x[1]}`,t(`${x[0]} + ${x[1]} = ${x[0]+x[1]}. Das ist kein voller Zehner.`,`${x[0]} + ${x[1]} = ${x[0]+x[1]}. Bu tam onluk değil.`)]),{tips:pairTip(f.base),sol:[t(`${p[0]} + ${p[1]} = ${p[0]+p[1]}. Damit rechnest du leicht weiter.`,`${p[0]} + ${p[1]} = ${p[0]+p[1]}. Bununla kolayca devam edersin.`)]});});
gen('part',['o','p','l'],'p-num',l=>{const f=fset(l),s=sum(f.n);return NUM(t(`Rechne geschickt: <span class="eq">${term(f.n)}</span>`,`Akıllıca hesapla: <span class="eq">${term(f.n)}</span>`),s,{tips:pairTip(f.base),trap:[[s-10,t('Du hast dich um 10 verrechnet. Prüfe den Übertrag.','10 hata yaptın. Eldeyi kontrol et.')],[s+10,t('Du hast dich um 10 verrechnet. Prüfe den Übertrag.','10 hata yaptın. Eldeyi kontrol et.')]],sol:[f.pairs.map(p=>`${p[0]} + ${p[1]} = ${p[0]+p[1]}`).join(', '),`= ${s}`]});});
gen('part',['p','l'],'p-story',l=>{const f=fset(l),nm=pick(NAMES),s=sum(f.n),u=l==='l'?'€':t('Punkte','puan');return NUM(t(`${nm} sammelt an ${f.n.length} Tagen ${f.n.join(', ').replace(/, ([^,]*)$/,' und $1')} ${u}. Wie viele ${u} sind es zusammen? Rechne geschickt.`,`${nm} ${f.n.length} günde ${f.n.join(', ').replace(/, ([^,]*)$/,' ve $1')} ${u} topluyor. Toplam kaç ${u}? Akıllıca hesapla.`),s,{unit:u,tips:pairTip(f.base),sol:[f.pairs.map(p=>`${p[0]} + ${p[1]} = ${p[0]+p[1]}`).join(', '),`= ${s}`]});});

/* ===== Station 3: Rechenbaum ===== */
gen('tree',['o','p','l'],'b-choose',l=>{let a,b,c,o;const big=l==='l';do{if(big){const p=pair100();a=ri(110,480);[b,c]=Math.random()<.5?p:[p[1],p[0]];}else{const p=pair10(11,l==='o'?39:69,l==='o'?1:2);a=filler(p,11,l==='o'?49:89);[b,c]=p;}o=pick(['L','R']);}while(round(a+b,10));let n=o==='R'?[a,b,c]:[b,c,a];
 const good=o,badO=o==='L'?'R':'L',bp=badO==='L'?[n[0],n[1]]:[n[1],n[2]],gp=good==='L'?[n[0],n[1]]:[n[1],n[2]];const opts=shuffle([good,badO]);
 return {type:'mc',q:t(`Welcher Rechenbaum ist für <span class="eq">${term(n)}</span> vorteilhafter?`,`<span class="eq">${term(n)}</span> için hangi işlem ağacı daha avantajlı?`),o:opts.map(x=>tree(n,x,null,'?','?')),ot:opts.map((x,i)=>t('Rechenbaum ','Ağaç ')+'AB'[i]),c:opts.indexOf(good),why:opts.map(x=>t(`Hier rechnest du zuerst ${bp[0]} + ${bp[1]} = ${bp[0]+bp[1]}. Das ist keine runde Zahl.`,`Burada önce ${bp[0]} + ${bp[1]} = ${bp[0]+bp[1]} hesaplıyorsun. Bu yuvarlak bir sayı değil.`)),fixo:1,wide:1,tips:TIPS(t('Schau, welche zwei Zahlen im Baum zuerst verbunden werden.','Ağaçta önce hangi iki sayının birleştiğine bak.'),t(`Welches Paar ergibt einen vollen ${big?'Hunderter':'Zehner'}?`,`Hangi çift tam ${big?'yüzlük':'onluk'} eder?`)),sol:[t(`Zuerst ${gp[0]} + ${gp[1]} = ${gp[0]+gp[1]}, dann ist der Rest leicht: ${sum(n)}.`,`Önce ${gp[0]} + ${gp[1]} = ${gp[0]+gp[1]}, sonrası kolay: ${sum(n)}.`)]};});
gen('tree',['o','p','l'],'b-fill',l=>{const f=fset(l==='p'?'o':l==='l'?'l':'o');let n,o;if(l==='l'){const p=f.pairs[0];n=[ri(110,480),...p];o='R';}else{const p=f.pairs[0],r=f.n.filter(x=>!p.includes(x))[0];o=pick(['L','R']);n=o==='L'?[p[0],p[1],r]:[r,p[0],p[1]];}
 const m=o==='L'?n[0]+n[1]:n[1]+n[2],e=sum(n);return MULTI(t('Ergänze den Rechenbaum.','İşlem ağacını tamamla.'),[{lab:'①',ans:m},{lab:'②',ans:e}],{fig:tree(n,o,null,'①','②'),tips:TIPS(t('Rechne zuerst die zwei Zahlen, die oben verbunden sind.','Önce üstte birleşen iki sayıyı topla.'),t('Das Ergebnis von ① rechnest du dann mit der dritten Zahl.','① sonucunu sonra üçüncü sayıyla topla.')),sol:[`① = ${m}`,`② = ${e}`]});});
gen('tree',['o','p','l'],'b-term',l=>{const n=[ri(11,l==='l'?400:99),ri(11,99),ri(11,99)],o=pick(['L','R']),R=`(${n[0]} + ${n[1]}) + ${n[2]}`,Ri=`${n[0]} + (${n[1]} + ${n[2]})`;
 return MC(t('Welcher Term passt zum Rechenbaum?','Hangi işlem bu ağaca uyar?'),o==='L'?R:Ri,[[o==='L'?Ri:R,t('Im Baum werden andere Zahlen zuerst verbunden. Die Klammer zeigt, was zuerst gerechnet wird.','Ağaçta önce başka sayılar birleşiyor. Parantez önce neyin hesaplandığını gösterir.')],[`${n[0]} ${M} (${n[1]} + ${n[2]})`,t('Im Baum steht zweimal plus, kein minus.','Ağaçta iki kez artı var, eksi yok.')]],{fig:tree(n,o,null,'',''),tips:TIPS(t('Welche zwei Zahlen werden im Baum zuerst verbunden?','Ağaçta önce hangi iki sayı birleşiyor?'),t('Was zuerst gerechnet wird, steht in der Klammer.','Önce hesaplanan, parantezin içinde yazılır.')),sol:[t('Die zuerst verbundenen Zahlen stehen in der Klammer.','Önce birleşen sayılar parantezin içindedir.')]});});
gen('tree',['p','l'],'b-minus',l=>{const A=l==='l'?ri(150,300):ri(60,99),b=ri(11,29),c=ri(5,19),one=pick([0,1]);const n=[A,b,c];
 if(one){const m=b+c,e=A-m;return MULTI(t(`Berechne mit dem Rechenbaum: <span class="eq">${A} ${M} (${b} + ${c})</span>`,`İşlem ağacıyla hesapla: <span class="eq">${A} ${M} (${b} + ${c})</span>`),[{lab:'①',ans:m},{lab:'②',ans:e}],{fig:tree(n,'R',['+',M],'①','②'),tips:TIPS(t('Klammerregel: Rechne zuerst die Klammer.','Parantez kuralı: Önce parantezi hesapla.'),t(`① = ${b} + ${c}. Dann ziehst du ① von ${A} ab.`,`① = ${b} + ${c}. Sonra ① sonucunu ${A} sayısından çıkar.`)),trap2:[[1,A-b+c,t(`Du hast ${A} ${M} ${b} + ${c} gerechnet. Die Klammer sagt: ${b} und ${c} werden beide abgezogen.`,`${A} ${M} ${b} + ${c} hesapladın. Parantez diyor ki: ${b} ve ${c} ikisi de çıkarılır.`)]],sol:[`① = ${b} + ${c} = ${m}`,`② = ${A} ${M} ${m} = ${e}`]});}
 const m=A-b,e=m+c;return MULTI(t(`Berechne mit dem Rechenbaum: <span class="eq">${A} ${M} ${b} + ${c}</span>`,`İşlem ağacıyla hesapla: <span class="eq">${A} ${M} ${b} + ${c}</span>`),[{lab:'①',ans:m},{lab:'②',ans:e}],{fig:tree(n,'L',[M,'+'],'①','②'),tips:TIPS(t('Ohne Klammer rechnest du von links nach rechts.','Parantez yoksa soldan sağa hesaplarsın.'),t(`① = ${A} ${M} ${b}. Dann rechnest du ① + ${c}.`,`① = ${A} ${M} ${b}. Sonra ① + ${c} hesaplarsın.`)),trap2:[[1,A-b-c,t(`Du hast ${c} abgezogen. Vor der ${c} steht aber ein Plus.`,`${c} sayısını çıkardın. Ama ${c} sayısının önünde artı var.`)]],sol:[`① = ${A} ${M} ${b} = ${m}`,`② = ${m} + ${c} = ${e}`]});});

function answered(q){if(q.type==='mc')return A.sel!=null;if(q.type==='num')return $('num').value.trim()!=='';if(q.type==='multi')return q.fields.every((_,i)=>$('m'+i).value.trim()!=='');if(q.type==='lines')return q.rows.every((r,i)=>!r[1]||A.lines[i]);if(q.type==='pair')return A.chips.length===1;if(q.type==='rule')return q.parts.every((p,i)=>typeof p==='string'||A.pick[i]!=null);return true;}
function grade(q){
 if(q.type==='mc'){const ok=A.sel===q.c,tx=i=>q.ot?q.ot[i]:plain(q.o[i]);return{ok,txt:A.sel==null?'–':tx(A.sel),right:tx(q.c),msgs:!ok&&A.sel!=null&&q.why&&q.why[A.sel]?[q.why[A.sel]]:[]};}
 if(q.type==='num'){const raw=$('num').value,v=parseNum(raw),ok=v===q.ans,tr=(q.trap||[]).find(x=>x[0]===v);return{ok,txt:raw.trim(),right:q.ans+(q.unit?' '+q.unit:''),msgs:!ok&&tr?[tr[1]]:[]};}
 if(q.type==='multi'){const v=q.fields.map((_,i)=>parseNum($('m'+i).value)),bad=[],msgs=[];v.forEach((x,i)=>{if(x!==q.fields[i].ans){bad.push(i);const tr=(q.trap2||[]).find(z=>z[0]===i&&z[1]===x);if(tr)msgs.push(tr[2]);}});
  if(q.fields.length===2&&q.fields[0].ans===q.fields[1].ans&&bad.length===1&&!msgs.length)msgs.push(t('Schau genau: Beide Aufgaben haben dasselbe Ergebnis. Prüfe die andere noch einmal.','Dikkat: İki işlemin sonucu aynı. Diğerini tekrar kontrol et.'));
  if(bad.length&&!msgs.length)msgs.push(t(`Prüfe ${bad.map(i=>q.fields[i].lab.replace(/=\s*$/,'').trim()).join(' und ')}.`,`Kontrol et: ${bad.map(i=>q.fields[i].lab.replace(/=\s*$/,'').trim()).join(' ve ')}.`));
  return{ok:!bad.length,bad,txt:v.map(x=>isNaN(x)?'–':x).join(' · '),right:q.fields.map(f=>f.lab.replace(/=\s*$/,'').trim()+' = '+f.ans).join(', '),msgs};}
 if(q.type==='lines'){const msgs=[];let ok=true;q.rows.forEach((r,i)=>{if(r[1]&&A.lines[i]!==r[1]){ok=false;msgs.push(t(`Zeile „= ${r[0]}“: Das ist das ${LAW[r[1]]}, nicht das ${LAW[A.lines[i]]}.`,`„= ${r[0]}“ satırı: Bu ${LAW[r[1]]}, ${LAW[A.lines[i]]} değil.`));}});return{ok,txt:q.rows.filter(r=>r[1]).map((r,i)=>LAW[A.lines[i]]||'–').join(' · '),right:q.rows.filter(r=>r[1]).map(r=>LAW[r[1]]).join(' · '),msgs};}
 if(q.type==='pair'){const k=q.pairs.length,first=A.merges.slice(0,k),good=first.every(m=>round(m[0]+m[1],q.base));const msgs=[];
  if(!good){const m=first.find(m=>!round(m[0]+m[1],q.base));msgs.push(t(`Du hast ${m[0]} + ${m[1]} = ${m[0]+m[1]} gerechnet. Das ist kein voller ${q.base===100?'Hunderter':'Zehner'}. Das Ergebnis stimmt, aber es geht leichter.`,`${m[0]} + ${m[1]} = ${m[0]+m[1]} hesapladın. Bu tam ${q.base===100?'yüzlük':'onluk'} değil. Sonuç doğru ama daha kolay bir yol var.`));msgs.push(t(`Geschickter: ${q.pairs.map(p=>`${p[0]} + ${p[1]} = ${p[0]+p[1]}`).join(' und ')}.`,`Daha akıllıca: ${q.pairs.map(p=>`${p[0]} + ${p[1]} = ${p[0]+p[1]}`).join(' ve ')}.`));}
  return{ok:good,txt:A.merges.map(m=>m[0]+' + '+m[1]).join(', '),right:q.pairs.map(p=>p[0]+' + '+p[1]).join(', '),msgs};}
 if(q.type==='rule'){let ok=true;q.parts.forEach((p,i)=>{if(typeof p!=='string'&&A.pick[i]!==0)ok=false;});return{ok,txt:'',right:ruleText(q),msgs:ok?[]:[t('Ein Wort passt noch nicht. Schau dir deine Ergebnisse von eben an.','Bir kelime henüz uymuyor. Az önceki sonuçlarına bak.')]};}
 return{ok:true,msgs:[]};}
const ruleText=q=>q.parts.map(p=>typeof p==='string'?p:p[0]).join('');
function lock(q,g){A.done=true;const box=$('vTask');box.querySelectorAll('input').forEach(i=>i.disabled=true);
 if(q.type==='mc')box.querySelectorAll('.opts .opt').forEach(b=>{const i=+b.dataset.i;if(i===q.c)b.classList.add('good');else if(i===A.sel)b.classList.add('wrong');b.disabled=true;});

 if(q.type==='pair')box.querySelectorAll('.chip').forEach(b=>b.disabled=true);}
const RIGHT=[t('Richtig!','Doğru!'),t('Genau!','Aynen!'),t('Stark!','Harika!'),t('Super gemacht!','Çok iyi!'),t('Das sitzt!','Tam isabet!')];
function fbHtml(q,g){const sol=(q.sol||[]).filter(Boolean);

 return `<div class="fb ${g.ok?'y':'n'}"><b class="h">${g.ok?pick(RIGHT):g.idk?t('So geht es:','Şöyle yapılır:'):t('Noch nicht ganz.','Henüz tam değil.')}</b>${(g.msgs||[]).length?`<ul class="st3">${g.msgs.map(m=>`<li>${fmt(m)}</li>`).join('')}</ul>`:''}${!g.ok&&g.right&&q.type!=='multi'?`<div>${t('Richtig ist:','Doğrusu:')} <b>${esc(g.right)}</b></div>`:''}${sol.length&&!g.ok?`<div><b>${t('So geht es richtig:','Doğru yol:')}</b></div><ol class="st3">${sol.map(s=>`<li>${fmt(s)}</li>`).join('')}</ol>`:''}${g.ok&&sol.length?`<div class="small">${fmt(sol[sol.length-1])}</div>`:''}</div>`;}
function tipButtons(q){const tips=q.tips||[];if(!tips.length)return '';return `<button type="button" class="btn sec" id="tip">${t('Tippkarte 1','İpucu kartı 1')}</button>`;}

function buildSet(x,l,n){const pool=GEN.filter(g=>g.t===x&&g.l===l);let out=[];while(out.length<n)out=out.concat(shuffle(pool));out=out.slice(0,n);for(let i=1;i<n;i++)if(out[i].id===out[i-1].id){const j=out.findIndex((y,k)=>k>i&&y.id!==out[i].id);if(j>0)[out[i],out[j]]=[out[j],out[i]];}return out.map(g=>Object.assign(g.make(),{g}));}
function startSet(x,l){S={mode:'set',t:x,l,list:buildSet(x,l,SIZE),i:0,ok:0,wrong:[],run:0,tips:0};setStep();}
function setStep(){const q=S.list[S.i],tp=topic(S.t),N=S.list.length,fx=S.mode==='fix';
 render(q,`<div class="qhead"><b>${fx?t('Fehler-Training: ','Hata çalışması: '):''}${esc(tp.name)}</b>${lvTag(S.l)}</div><div class="row small muted"><span>${t('Aufgabe','Soru')} ${S.i+1} / ${N}</span><span>· ${S.ok} ${t('richtig','doğru')}</span>${S.run>=2?`<span class="streak">${S.run} ${t('in Folge','üst üste')}</span>`:''}</div><div class="pr"><div style="width:${S.i/N*100}%"></div></div>`,'c-'+S.l);
 $('acts').innerHTML=`<button type="button" class="btn pri" id="go">${t('Prüfen','Kontrol et')}</button>${tipButtons(q)}<button type="button" class="btn ghost" id="idk">${t('Zeig mir den Weg','Yolu göster')}</button>`;bindTips(q);
 $('go').onclick=()=>{if(!answered(q)){toast(q.type==='pair'?t('Fasse zuerst alle Zahlen zusammen.','Önce tüm sayıları birleştir.'):t('Trage zuerst deine Antwort ein.','Önce cevabını yaz.'));return;}finishQ(q,grade(q));};
 $('idk').onclick=()=>finishQ(q,{ok:false,idk:true,right:q.type==='mc'?(q.ot?q.ot[q.c]:plain(q.o[q.c])):q.type==='num'?String(q.ans):q.type==='pair'?q.pairs.map(p=>p[0]+' + '+p[1]).join(', '):q.type==='lines'?q.rows.filter(r=>r[1]).map(r=>LAW[r[1]]).join(' · '):null,msgs:[]});
 show('vTask','home');}
function finishQ(q,g){lock(q,g);if(q.type==='multi'&&g.idk)q.fields.forEach((f,i)=>{const e=$('m'+i);if(!e.nextElementSibling)e.insertAdjacentHTML('afterend',`<span class="fix">${f.ans}</span>`);});
 if(g.ok){S.ok++;S.run++;P.stars++;if(S.run>P.best)P.best=S.run;}else{S.run=0;S.wrong.push(q.g);P.err[S.t]=(P.err[S.t]||0)+1;}store();
 $('tipBox').innerHTML='';$('fbBox').innerHTML=fbHtml(q,g);if(g.ok&&(S.run===3||S.run===5))toast(t(`${S.run} richtige in Folge!`,`Üst üste ${S.run} doğru!`));
 const last=S.i===S.list.length-1;$('acts').innerHTML=`<button type="button" class="btn pri" id="nx">${last?t('Zum Ergebnis','Sonuca git'):t('Nächste Aufgabe','Sonraki soru')}</button>`;$('nx').onclick=()=>{S.i++;if(last)setEnd();else setStep();};$('nx').focus({preventScroll:true});}
function setEnd(){const fx=S.mode==='fix',tp=topic(S.t),k=S.t+S.l,a=S.t,b=S.l;$('vRes').className='c-'+S.l;
 if(fx){const n=S.list.length;$('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>${t('Fehler-Training','Hata çalışması')}: ${esc(tp.name)}</b>${lvTag(S.l)}</div><div class="big">${S.ok} / ${n}</div><p>${S.ok===n?t('Alle Fehler aufgeholt. Das ist echtes Lernen!','Tüm hataları düzelttin. İşte gerçek öğrenme!'):t('Gut, dass du drangeblieben bist.','Pes etmemen çok güzel.')}</p><div class="row"><button type="button" class="btn pri" id="r1">${t('Neue Runde','Yeni tur')}</button><button type="button" class="btn ghost" id="r3">${t('Übersicht','Genel bakış')}</button></div></div>`;if(S.ok===n)confetti();$('r1').onclick=()=>startSet(a,b);$('r3').onclick=home;show('vRes','home');return;}
 const was=passed(S.t,S.l),c=P.cells[k]||{best:0,runs:0};c.best=Math.max(c.best,S.ok);c.runs++;P.cells[k]=c;store();const pass=S.ok>=PASS,nx=nextCell(),w=S.wrong.slice(),pg={o:39,p:40,l:41}[S.l];
 $('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>${esc(tp.name)}</b>${lvTag(S.l)}</div><div class="big">${S.ok} / ${SIZE}</div><p>${pass?(S.ok===SIZE?t('Alles richtig. Diese Station sitzt.','Hepsi doğru. Bu istasyon tamam.'):t('Station geschafft. Stark gemacht!','İstasyon tamam. Harika!')):t(`Noch nicht geschafft. Du brauchst ${PASS} richtige.`,`Henüz tamam değil. ${PASS} doğru gerekiyor.`)}</p>
 ${w.length?`<div class="tip">${t('<b>Fehler-Training:</b> Übe genau die Aufgaben, die noch nicht geklappt haben, mit neuen Zahlen.','<b>Hata çalışması:</b> Henüz olmayan soruları yeni sayılarla çalış.')}</div>`:''}<p class="small muted">${t(`Im Buch: Merkkasten auf Seite 38, Übungen in deiner Farbe auf Seite ${pg}.`,`Kitapta: kural kutusu 38. sayfada, senin rengindeki alıştırmalar ${pg}. sayfada.`)}</p>
 <div class="row">${w.length?`<button type="button" class="btn pri" id="r5">${t('Fehler-Training starten','Hata çalışmasını başlat')}</button>`:''}<button type="button" class="btn ${w.length?'sec':pass&&nx?'sec':'pri'}" id="r1">${t('Nochmal mit neuen Zahlen','Yeni sayılarla tekrar')}</button>${pass&&nx?`<button type="button" class="btn ${w.length?'sec':'pri'}" id="r2">${t('Nächste Station','Sonraki istasyon')}</button>`:''}<button type="button" class="btn ghost" id="r3">${t('Übersicht','Genel bakış')}</button></div></div>`;
 $('r1').onclick=()=>startSet(a,b);$('r3').onclick=home;if($('r2'))$('r2').onclick=()=>startSet(nx[0],nx[1]);
 if($('r5'))$('r5').onclick=()=>{S={mode:'fix',t:a,l:b,list:w.map(g=>Object.assign(g.make(),{g})),i:0,ok:0,wrong:[],run:0,tips:0};setStep();};
 if(pass&&!was)confetti();show('vRes','home');}

/* ---------- Merkheft und Sichern ---------- */
function memo(){const rid=['v','b','g','m'];
 $('vMemo').innerHTML=`<div class="card stack"><h1>${t('Mein Merkheft','Not defterim')}</h1><p class="muted">${t('Hier sammelst du deine Merksätze aus den Forscheraufträgen. Vergleiche sie mit dem Merkkasten im Buch auf Seite 38.','Burada araştırma görevlerinden kurallarını toplarsın. Onları kitaptaki sayfa 38\'deki kural kutusuyla karşılaştır.')}</p></div>
 <div class="two">${FO.map((f,i)=>{const r=P.rules[rid[i]];return `<div class="card stack m-p"><div class="qhead"><h2>${esc(f.name)}</h2><span class="fst">${r?'★':'☆'}</span></div>${r?`<div class="merk">${esc(r)}</div>`:`<p class="muted">${t('Noch offen. Mach Forscherauftrag','Henüz açık. Araştırma görevini yap:')} ${i+1}.</p><div><button type="button" class="btn sec sm" data-f="${i}">${t('Auftrag starten','Görevi başlat')}</button></div>`}</div>`;}).join('')}</div>
 <div class="card stack"><h2>${t('Das Wichtigste','En önemlisi')}</h2><div class="laws"><div><b>${LAWF.v}</b><span class="eq">a + b = b + a</span><span class="small">23 + 14 = 14 + 23</span></div><div><b>${LAWF.b}</b><span class="eq">a + b + c = a + (b + c)</span><span class="small">(7 + 3) + 5 = 7 + (3 + 5)</span></div><div><b>${LAWF.k}</b><span class="eq">70 ${M} (5 + 8) = 70 ${M} 13</span><span class="small">${t('Klammer zuerst','Önce parantez')}</span></div></div>
 <div class="tip warn"><b>${t('Achtung:','Dikkat:')}</b> ${t('Vertauschungsgesetz und Verbindungsgesetz gelten nicht für die Subtraktion.','Değişme ve birleşme özellikleri çıkarma için geçerli değildir.')} <span class="eq">9 ${M} 4 ≠ 4 ${M} 9</span></div>
 <p>${t('<b>Plus und Minus in einem Term:</b> Das Rechenzeichen gehört zur Zahl dahinter. Beim Tauschen wandert es mit:','<b>Aynı işlemde artı ve eksi:</b> İşlem işareti arkasındaki sayıya aittir. Yer değiştirirken onunla gider:')} <span class="eq">46 + 19 ${M} 6 = 46 ${M} 6 + 19 = 59</span></p>
 <p class="small muted">${t('Satzhilfe für das Gespräch: „Es ist vorteilhaft, zuerst … und … zu addieren, weil sie zusammen einen vollen Zehner ergeben.“','Konuşma için cümle yardımı: „Önce … ve … sayılarını toplamak avantajlıdır, çünkü toplamları tam onluk eder.“')}</p></div>
 <div class="card stack"><h2>${t('Stand für IServ sichern','IServ için kaydet')}</h2><div id="saveM"></div></div>`;
 $('vMemo').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>startF(+b.dataset.f));saveBox($('saveM'));show('vMemo','memo');}
function report(){const d=new Date(),pad=n=>String(n).padStart(2,'0'),ds=pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
 let s=t('RECHENGESETZE – Stand','HESAPLAMA ÖZELLİKLERİ – Durum')+'\n==========================\n'+t('Name','Ad')+':   '+P.name+'\n'+t('Klasse','Sınıf')+': '+P.kl_+'\n'+t('Datum','Tarih')+':  '+ds+'\n'+t('Sterne','Yıldız')+': '+P.stars+'\n\n'+t('Meine Merksätze','Kurallarım')+':\n';
 ['v','b','g','m'].forEach((k,i)=>s+='  '+(i+1)+'. '+(P.rules[k]||t('noch offen','henüz açık'))+'\n');
 s+='\n'+t('Stationen (beste Runde von ','İstasyonlar (en iyi tur, ')+SIZE+'):\n';TOPICS.forEach(x=>{s+='  '+x.name+': '+LVS.map(l=>LV[l]+' '+((P.cells[x.id+l]||{}).best!=null?P.cells[x.id+l].best:'–')).join(', ')+'\n';});
 s+='\n'+t('Fehler je Station','İstasyon başına hata')+':\n';TOPICS.forEach(x=>{if(P.err[x.id])s+='  '+x.name+': '+P.err[x.id]+'\n';});
 return s+'\n#DATEN '+JSON.stringify({app:'mathe5-rechengesetze',lang:LANG,v:1,name:P.name,kl:P.kl_,datum:ds,stationen:P.cells,fehler:P.err,merksaetze:P.rules})+'\n';}
function saveBox(el){const top=window.self===window.top;
 el.innerHTML=`<div class="stack"><div class="fields"><label class="f">${t('Dein Vorname','Adın')}<input id="sN" maxlength="30" value="${esc(P.name)}" autocomplete="given-name"></label><label class="f">${t('Deine Klasse','Sınıfın')}<input id="sK" maxlength="8" value="${esc(P.kl_)}" placeholder="5c"></label></div><div class="row">${top?`<button type="button" class="btn sec" id="sD">${t('Datei speichern','Dosyayı kaydet')}</button>`:''}<button type="button" class="btn sec" id="sC">${t('Ergebnis kopieren','Sonucu kopyala')}</button></div><p class="small muted">${t('Lade die Datei in IServ hoch oder füge den kopierten Text dort ein.','Dosyayı IServ\'e yükle veya kopyalanan metni oraya yapıştır.')}</p></div>`;
 const up=()=>{P.name=$('sN').value.trim();P.kl_=$('sK').value.trim();store();return P.name&&P.kl_;};$('sN').oninput=up;$('sK').oninput=up;
 const need=t('Trage zuerst Vorname und Klasse ein.','Önce adını ve sınıfını yaz.'),done_=t('Kopiert. Füge es jetzt in IServ ein.','Kopyalandı. Şimdi IServ\'e yapıştır.');
 $('sC').onclick=()=>{if(!up()){toast(need);return;}const s=report(),fb=()=>{const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();toast(ok?done_:t('Kopieren hat nicht geklappt.','Kopyalama olmadı.'));};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast(done_),fb);else fb();};
 if(top)$('sD').onclick=()=>{if(!up()){toast(need);return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));a.download=(t('Rechengesetze_','Hesaplama_')+P.kl_+'_'+P.name).replace(/[^\wäöüÄÖÜßçğıöşüÇĞİÖŞÜ-]+/g,'_')+'.txt';a.click();};}

/* ---------- Stunden-App: ein fester Weg ---------- */
const LSTEPS=[{k:'in',n:t('Input','Giriş')},{k:'f',i:0,n:'1'},{k:'f',i:1,n:'2'},{k:'f',i:2,n:'3'},{k:'f',i:3,n:'4'},{k:'check',n:t('Check','Kontrol')},{k:'end',n:'★'}];
if(P.lstep==null)P.lstep=0;
function drawPath(){const el=$('path');if(!el)return;el.innerHTML=LSTEPS.map((s,i)=>`<span class="pst ${i<P.lstep?'done':''} ${i===P.lstep?'now':''}" title="${esc(s.k==='f'?FO[s.i].name:s.n)}">${i<P.lstep&&s.k!=='end'?'✓':esc(s.n)}</span>`).join('<span class="pln"></span>');}
function show(v){VIEWS.forEach(x=>$(x).hidden=x!==v);drawPath();window.scrollTo(0,0);}
function go(i){P.lstep=Math.max(P.lstep,i);store();const s=LSTEPS[i];if(s.k==='in'){IN=0;lessonInput();}else if(s.k==='f')startF(s.i);else if(s.k==='check')startCheck();else endView();}
function lessonInput(){const st=INSTEPS(),s=st[IN],last=IN===st.length-1;
 $('vIn').innerHTML=`<div class="card stack"><div class="qhead"><b>Input · ${IN+1} / ${st.length}</b><button type="button" class="btn ghost sm" id="skip">${t('Input überspringen','Girişi atla')} →</button></div><div class="pr"><div style="width:${(IN+1)/st.length*100}%"></div></div><h1>${s.h}</h1><div class="stack big-t">${s.b}</div>${s.fig?`<div class="fig">${s.fig}</div>`:''}${s.reveal?`<div id="rv"></div><div><button type="button" class="btn sec" id="rvb">${t('Lösung zeigen','Çözümü göster')}</button></div>`:''}
 <div class="row">${IN?`<button type="button" class="btn ghost" id="back">${t('Zurück','Geri')}</button>`:''}<button type="button" class="btn pri" id="nxt">${last?t('Los geht’s: Forscherauftrag 1','Başla: Araştırma görevi 1'):t('Weiter','Devam')}</button></div></div>`;
 if(s.reveal)$('rvb').onclick=()=>{$('rv').innerHTML=s.reveal;$('rvb').hidden=true;};
 $('skip').onclick=()=>go(1);if($('back'))$('back').onclick=()=>{IN--;lessonInput();};
 $('nxt').onclick=()=>{if(last)go(1);else{IN++;lessonInput();}};show('vIn');}
function fNext(){if(S.i<S.list.length)return fStep();const f=FO[S.fi];P.found[f.id]=true;store();const rid=S.list[S.list.length-1].id,nxt=P.lstep+1,nl=LSTEPS[nxt];
 $('vRes').className='c-l';$('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>${t('Forscherauftrag','Araştırma görevi')} ${S.fi+1} / 4</b><span class="lv c-l">★</span></div><h1>${esc(f.name)}: ${t('geschafft!','tamam!')}</h1>${P.rules[rid]?`<div class="small muted">${t('Dein Merksatz:','Kuralın:')}</div><div class="merk">${esc(P.rules[rid])}</div>`:''}<p class="muted">${S.tips===0?t('Ohne Tippkarte. Stark!','İpucu kartı olmadan. Harika!'):t(`Du hast ${S.tips} Tippkarten benutzt. Gut, dass du sie genutzt hast!`,`${S.tips} ipucu kartı kullandın. Kullanman çok iyi!`)}</p>
 <div class="row"><button type="button" class="btn pri" id="fn">${nl.k==='f'?t('Weiter: Forscherauftrag ','Devam: Araştırma görevi ')+(nl.i+1):t('Weiter zum Kurz-Check','Kısa kontrole devam')}</button></div></div>`;
 $('fn').onclick=()=>go(nxt);confetti();show('vRes');}
function startCheck(){const g=(id,l)=>{const x=GEN.find(z=>z.id===id&&z.l===l);return Object.assign(x.make(),{g:x});};
 S={mode:'check',list:[g(pick(['g-v','g-b']),'o'),g('p-game','p'),g('m-twominus','p'),g('m-trap','p')],i:0,ok:0,tips:0};checkStep();}
function checkStep(){const q=S.list[S.i],N=S.list.length;
 render(q,`<div class="qhead"><b>${t('Kurz-Check','Kısa kontrol')}</b><span class="lv c-l">${S.i+1} / ${N}</span></div><p class="small muted">${t('Zeig, was du heute gelernt hast.','Bugün öğrendiklerini göster.')}</p><div class="pr"><div style="width:${S.i/N*100}%"></div></div>`,'c-l');
 $('acts').innerHTML=`<button type="button" class="btn pri" id="go">${t('Prüfen','Kontrol et')}</button>${tipButtons(q)}`;bindTips(q);
 $('go').onclick=()=>{if(!answered(q)){toast(q.type==='pair'?t('Fasse zuerst alle Zahlen zusammen.','Önce tüm sayıları birleştir.'):t('Trage zuerst deine Antwort ein.','Önce cevabını yaz.'));return;}const gr=grade(q);lock(q,gr);if(gr.ok){S.ok++;P.stars++;}else P.err.check=(P.err.check||0)+1;store();$('tipBox').innerHTML='';$('fbBox').innerHTML=fbHtml(q,gr);
  const last=S.i===N-1;$('acts').innerHTML=`<button type="button" class="btn pri" id="nx">${last?t('Fertig','Bitti'):t('Nächste Aufgabe','Sonraki soru')}</button>`;$('nx').onclick=()=>{S.i++;if(last){P.check=S.ok;store();go(LSTEPS.length-1);}else checkStep();};$('nx').focus({preventScroll:true});};
 show('vTask');}
function endView(){const rid=['v','b','g','m'];
 $('vRes').className='c-l';$('vRes').innerHTML=`<div class="card stack"><h1>${t('Geschafft!','Başardın!')}</h1><p>${t(`Kurz-Check: <b>${P.check!=null?P.check:'–'} von 4</b> richtig.`,`Kısa kontrol: 4 sorudan <b>${P.check!=null?P.check:'–'}</b> doğru.`)}</p></div>
 <div class="card stack"><h2>${t('Deine Merksätze','Kuralların')}</h2>${FO.map((f,i)=>`<div><div class="small muted">${i+1}. ${esc(f.name)}</div><div class="merk">${esc(P.rules[rid[i]]||t('noch offen','henüz açık'))}</div></div>`).join('')}</div>
 <div class="card stack"><h2>${t('Jetzt besprechen','Şimdi konuşalım')}</h2><ol class="st3"><li>${t('Vergleiche deine Merksätze mit deinem Partner.','Kurallarını partnerinle karşılaştır.')}</li><li>${t('Vergleiche mit dem Merkkasten im Buch auf Seite 38.','Kitapta 38. sayfadaki kural kutusuyla karşılaştır.')}</li><li>${t('Satzhilfe: „Es ist vorteilhaft, zuerst … und … zu addieren, weil …“','Cümle yardımı: „Önce … ve … sayılarını toplamak avantajlıdır, çünkü …“')}</li></ol>
 <div class="tip">${t('<b>Schon fertig und deine Klasse noch nicht?</b> Öffne die Übungs-App „Rechengesetze“ und übe in deiner Farbe.','<b>Bitirdin ama sınıfın henüz bitirmedi mi?</b> „Hesaplama özellikleri“ alıştırma uygulamasını aç ve kendi renginde çalış.')}</div></div>
 <div class="card stack"><h2>${t('Ergebnis für IServ sichern','Sonucu IServ için kaydet')}</h2><div id="saveE"></div></div>
 <div class="small muted"><button type="button" class="linkb" id="again">${t('Noch einmal von vorne','Baştan başla')}</button></div>`;
 saveBox($('saveE'));$('again').onclick=()=>{P.lstep=0;store();go(0);};if(P.check===4)confetti();show('vRes');}
const _rep=report;report=function(){return _rep().replace(/#DATEN /,'Kurz-Check: '+(P.check!=null?P.check:'–')+'/4\n\n#DATEN ');};
go(P.lstep||0);
</script>
