<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechenprofi Plus und Minus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
html,body{margin:0}

/* Layout: a single working column over squared exercise-book paper; the grid of Rechenkästchen is the hero. */
:root{
  --paper:#F7FAFD; --line:#D3E0EE; --surface:#FFFFFF; --ink:#1C2A4A; --muted:#55627F;
  --carry:#D3263A; --ok:#17844F; --okbg:#E3F5EB; --badbg:#FCE6E9; --focus:#2B6CD8;
  --orange:#E97A00; --pink:#CF0A6E; --purple:#6C3A98; --soft:#EEF3F9;
  --f-head:"Fredoka","Andika","Trebuchet MS",sans-serif;
  --f-body:"Andika","Segoe UI",system-ui,sans-serif;
  --cell:clamp(38px,9.4vw,54px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --line:#223149; --surface:#18233A; --ink:#E5ECF8; --muted:#A3B0C8;
  --carry:#FF6F80; --ok:#4FCB8C; --okbg:#173A2B; --badbg:#47202A; --focus:#7FB0FF;
  --orange:#FF9C33; --pink:#FF5AAE; --purple:#B78AEA; --soft:#1F2B44; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --line:#223149; --surface:#18233A; --ink:#E5ECF8; --muted:#A3B0C8;
  --carry:#FF6F80; --ok:#4FCB8C; --okbg:#173A2B; --badbg:#47202A; --focus:#7FB0FF;
  --orange:#FF9C33; --pink:#FF5AAE; --purple:#B78AEA; --soft:#1F2B44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:860px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
h1{font-family:var(--f-head);font-weight:600;font-size:1.6rem;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 .pm{color:var(--carry)}
h2{font-family:var(--f-head);font-weight:600;font-size:1.3rem;margin:0 0 8px}
h3{font-family:var(--f-head);font-weight:500;font-size:1.1rem;margin:0 0 6px}
.hright{display:flex;gap:8px;align-items:center}
.stars{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px;fill:#F2B705}
button{font:inherit;color:inherit;cursor:pointer}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700}
nav.tabs{display:flex;gap:6px;margin:14px 0 12px;overflow-x:auto}
nav.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:10px;font-family:var(--f-head);font-weight:500;font-size:1.02rem;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 0 var(--line)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lvl{border:2px solid var(--c);background:var(--surface);border-radius:12px;padding:8px 6px;text-align:center;font-family:var(--f-head);font-weight:500;line-height:1.2}
.lvl small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl[aria-pressed="true"]{background:var(--c);color:#fff}
.lvl[aria-pressed="true"] small{color:#fff}
.lvl1{--c:var(--orange)} .lvl2{--c:var(--pink)} .lvl3{--c:var(--purple)}
.taskhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;color:#fff;background:var(--c)}
.instr{margin:4px 0 12px}
.word{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:1.05rem}
.gridbox{overflow-x:auto;padding:6px 0 4px}
.cgrid{display:grid;gap:0;width:max-content;margin:0 auto;font-variant-numeric:tabular-nums;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.6);font-weight:700;position:relative}
.cell.lab{font-size:calc(var(--cell)*.32);color:var(--muted);font-weight:700}
.cell.sign{color:var(--ink)}
.cell.in{cursor:pointer;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:6px;margin:3px;width:calc(var(--cell) - 6px);height:calc(var(--cell) - 6px);border:2px dashed var(--muted)}
.cell.in.active{border:3px solid var(--focus);background:var(--surface)}
.cell.carry{font-size:calc(var(--cell)*.42);color:var(--carry)}
.cell.carry.in{border-color:var(--carry);border-width:1.5px;width:calc(var(--cell) - 18px);height:calc(var(--cell) - 18px);margin:9px}
.cell.carry.in.active{border-width:3px}
.cell.ok{background:var(--okbg);border-color:var(--ok);border-style:solid;color:var(--ok)}
.cell.bad{background:var(--badbg);border-color:var(--carry);border-style:solid;color:var(--carry)}
.cell.sol{color:var(--focus)}
.cell.hl{background:color-mix(in srgb,var(--focus) 16%,transparent);border-radius:4px}
.rule{grid-column:1/-1;height:3px;background:var(--ink);border-radius:2px;margin:0 2px}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px auto 0;max-width:520px}
.keypad button{border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:52px;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.keypad button.wide{grid-column:span 2;font-size:1rem}
.keypad button:active{transform:translateY(1px)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-family:var(--f-head);font-weight:500;font-size:1.05rem;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.tip{background:#FFF4CC;color:#5A4500;border-color:#E8CF6A}
:root[data-theme="dark"] .btn.tip{background:#3A3115;color:#FFE18A;border-color:#6B5A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.tip{background:#3A3115;color:#FFE18A;border-color:#6B5A1E}}
.choices{display:grid;gap:8px;margin:8px 0}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.1rem;font-variant-numeric:tabular-nums}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--carry);background:var(--badbg)}
.msg{margin-top:12px;border-radius:12px;padding:10px 14px;font-weight:700}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--carry)}
.msg.info{background:var(--soft);color:var(--ink);font-weight:400}
.tipcard{margin-top:12px;border:2px solid #E8CF6A;background:#FFFBEA;color:#3D3000;border-radius:14px;padding:12px 14px}
:root[data-theme="dark"] .tipcard{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tipcard{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}}
.tipcard b{font-family:var(--f-head);font-weight:600}
.claimed{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:10px;background:var(--soft);font-variant-numeric:tabular-nums}
.progress{color:var(--muted);font-size:.9rem;text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
/* explanation */
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.term{background:var(--soft);border-radius:12px;padding:12px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.term .eq{font-size:1.4rem;font-weight:700;margin:4px 0}
.term .lbl{font-size:.85rem;color:var(--muted)}
.player{display:grid;gap:12px}
.steptext{background:var(--soft);border-radius:12px;padding:12px 14px;min-height:4.5em}
.stepnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.stepnav .count{color:var(--muted);font-variant-numeric:tabular-nums;min-width:4em;text-align:center}
.section{margin-bottom:16px}
/* merkzettel */
.merk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.merk ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.err{display:grid;gap:10px}
.erritem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:var(--badbg);border-radius:12px;padding:10px 12px}
.erritem .ex{font-variant-numeric:tabular-nums;font-weight:700}
.erritem .ex s{color:var(--carry)}
.gloss{width:100%;border-collapse:collapse;font-size:.95rem}
.gloss td,.gloss th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
/* tip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{perspective:900px;min-height:190px;border:none;background:none;padding:0;text-align:left}
.fin{position:relative;width:100%;height:100%;min-height:190px;transition:transform .45s;transform-style:preserve-3d}
.fcard[aria-pressed="true"] .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.front{background:var(--surface)}
.front .q{font-family:var(--f-head);font-weight:600;font-size:1.15rem}
.front .hint{margin-top:auto;font-size:.82rem;color:var(--muted)}
.back{background:#FFFBEA;color:#3D3000;transform:rotateY(180deg);border-color:#E8CF6A;font-size:.98rem;overflow:auto}
:root[data-theme="dark"] .back{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none}
@media (prefers-reduced-motion: reduce){.fin{transition:none}}
@media (max-width:520px){.erritem{grid-template-columns:1fr} .keypad{grid-template-columns:repeat(5,1fr)} .keypad button.wide{grid-column:span 5} .levels{gap:6px} .lvl{font-size:.92rem}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="apptitle"></h1>
    <div class="hright">
      <div class="stars" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.4 6.7L12 17.4l-6.1 3.4 1.4-6.7-5-4.6 6.8-.8z"/></svg><span id="starcount">0</span></div>
      <button class="langbtn" id="langbtn" type="button"></button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang = store.get("rp-lang",null) || DEFAULT_LANG;

/* ---------- math ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dig=(n,p)=>Math.floor(n/10**p)%10;
const len=n=>String(n).length;
function calcAdd(nums){
  const result=nums.reduce((a,b)=>a+b,0); const cols=[]; let c=0;
  for(let p=0;p<len(result);p++){
    const ds=nums.filter(n=>len(n)>p).map(n=>dig(n,p)); const tot=ds.reduce((a,b)=>a+b,0)+c;
    cols.push({p,ds,cin:c,tot,r:tot%10,cout:Math.floor(tot/10)}); c=Math.floor(tot/10);
  }
  return {result,cols};
}
function calcSub(nums){
  const [m,...subs]=nums; const result=m-subs.reduce((a,b)=>a+b,0); const cols=[]; let c=0;
  for(let p=0;p<len(m);p++){
    const md=dig(m,p); const ds=subs.filter(n=>len(n)>p).map(n=>dig(n,p)); const s=ds.reduce((a,b)=>a+b,0)+c;
    const cout=s>md?Math.ceil((s-md)/10):0; const r=md+10*cout-s;
    cols.push({p,md,ds,cin:c,s,r,cout}); c=cout;
  }
  return {result,cols};
}
const calc=(kind,nums)=>kind==="add"?calcAdd(nums):calcSub(nums);
const nCarries=(k,nums)=>calc(k,nums).cols.filter(c=>c.cout>0).length;
function overschlag(kind,nums){
  const place=10**(len(Math.min(...nums))-1); const rd=n=>Math.round(n/place)*place;
  const rs=nums.map(rd); const val=kind==="add"?rs.reduce((a,b)=>a+b,0):rs[0]-rs.slice(1).reduce((a,b)=>a+b,0);
  return {rs,val,str:rs.map(fmt).join(kind==="add"?" + ":" − ")+" = "+fmt(val)};
}
function gen(fn,test,tries=400){for(let i=0;i<tries;i++){const v=fn();if(test(v))return v}return fn()}

/* ---------- task generators ---------- */
function makeTask(level){
  const r=Math.random();
  if(level===1){
    if(r<.5) return {mode:"calc",kind:"add",nums:gen(()=>Math.random()<.3?[rnd(100,899),rnd(12,98)]:[rnd(100,799),rnd(100,499)],n=>n[0]+n[1]<1000&&nCarries("add",n)<=1)};
    return {mode:"calc",kind:"sub",nums:gen(()=>{const a=rnd(300,999);return [a,rnd(100,a-50)]},n=>nCarries("sub",n)<=1&&n[0]-n[1]>=10)};
  }
  if(level===2){
    if(r<.32) return {mode:"calc",kind:"add",nums:gen(()=>Math.random()<.5?[rnd(1000,6999),rnd(1000,2999)]:[rnd(1000,4999),rnd(100,999),rnd(100,999)],n=>nCarries("add",n)>=2)};
    if(r<.64) return {mode:"calc",kind:"sub",nums:gen(()=>{const a=Math.random()<.3?rnd(2,9)*1000+rnd(0,9)*10+rnd(0,9):rnd(2000,9999);return [a,rnd(300,a-200)]},n=>nCarries("sub",n)>=2&&n[0]>n[1])};
    if(r<.84) return makeGap();
    return makeEst();
  }
  if(r<.25) return {mode:"calc",kind:"add",nums:gen(()=>{const k=rnd(3,4);return Array.from({length:k},()=>Math.random()<.5?rnd(10000,39999):rnd(100,9999))},n=>n.reduce((a,b)=>a+b,0)<100000&&nCarries("add",n)>=3)};
  if(r<.5) return {mode:"calc",kind:"sub",nums:gen(()=>[rnd(20000,99999),rnd(1000,9999),rnd(100,9999)],n=>n[0]-n[1]-n[2]>100&&nCarries("sub",n)>=2)};
  if(r<.75) return makeError();
  return makeWord();
}
function makeGap(){
  const kind=Math.random()<.5?"add":"sub";
  const nums=kind==="add"?gen(()=>[rnd(1000,8999),rnd(100,999)],n=>n[0]+n[1]<10000&&nCarries("add",n)>=1):gen(()=>{const a=rnd(2000,9999);return [a,rnd(200,a-100)]},n=>nCarries("sub",n)>=1);
  const {result}=calc(kind,nums);
  const rows=[...nums.map((n,i)=>({i,n})),{i:"res",n:result}];
  const row=pick(rows); const p=rnd(0,len(row.n)-1);
  return {mode:"gap",kind,nums,gap:{row:row.i,p,val:dig(row.n,p)}};
}
function makeEst(){
  const kind=Math.random()<.5?"add":"sub";
  const nums=kind==="add"?[rnd(1000,8999),rnd(1000,8999)]:gen(()=>[rnd(4000,9999),rnd(1000,3999)],n=>n[0]>n[1]);
  const place=1000; const ov=overschlag(kind,nums);
  const flip=(n,rd)=>rd>=n?rd-place:rd+place;
  const opts=[ov.str];
  const alt=(rs)=>{const v=kind==="add"?rs[0]+rs[1]:rs[0]-rs[1];return rs.map(fmt).join(kind==="add"?" + ":" − ")+" = "+fmt(v)};
  opts.push(alt([flip(nums[0],ov.rs[0]),ov.rs[1]])); opts.push(alt([ov.rs[0],flip(nums[1],ov.rs[1])]));
  return {mode:"est",kind,nums,opts:shuffle(opts.map((s,i)=>({s,ok:i===0})))};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wrongResult(kind,nums){
  const {cols,result}=calc(kind,nums); let w;
  if(kind==="add"){ // carry forgotten
    w=Number(cols.map(c=>c.tot-c.cin).map(v=>v%10).reverse().join(""));
  } else {
    if(Math.random()<.5){ // carry not added
      w=Number(cols.map(c=>{const s=c.ds.reduce((a,b)=>a+b,0);return ((c.md-s)%10+10)%10}).reverse().join(""));
    } else { // swap digits (two numbers only)
      w=Number(cols.map(c=>Math.abs(c.md-c.ds.reduce((a,b)=>a+b,0))%10).reverse().join(""));
    }
  }
  return w;
}
function makeError(){
  const kind=Math.random()<.5?"add":"sub";
  const nums=kind==="add"?gen(()=>[rnd(1000,9999),rnd(1000,9999)],n=>nCarries("add",n)>=2):gen(()=>{const a=rnd(3000,9999);return [a,rnd(1000,a-500)]},n=>nCarries("sub",n)>=2);
  const {result}=calc(kind,nums); const isRight=Math.random()<.35;
  let shown=isRight?result:wrongResult(kind,nums); if(shown===result&&!isRight) shown=result+(kind==="add"?100:-100);
  return {mode:"error",kind,nums,shown,isRight:shown===result,phase:1};
}
function makeWord(){
  const t=pick(["add2","add3","sub1","sub2"]); let kind,nums,opts;
  if(t==="add2"){nums=gen(()=>[rnd(4000,15000),rnd(3000,12000)],n=>nCarries("add",n)>=2);kind="add";opts=[[`${fmt(nums[0])} + ${fmt(nums[1])}`,1],[`${fmt(Math.max(...nums))} − ${fmt(Math.min(...nums))}`,0]];}
  if(t==="add3"){nums=gen(()=>[rnd(400,1300),rnd(400,1300),rnd(400,1300)],n=>nCarries("add",n)>=2);kind="add";opts=[[`${fmt(nums[0])} + ${fmt(nums[1])} + ${fmt(nums[2])}`,1],[`${fmt(nums[0])} + ${fmt(nums[1])} − ${fmt(nums[2])}`,0],[`${fmt(nums[0])} − ${fmt(nums[1])} − ${fmt(nums[2])}`,0]];}
  if(t==="sub1"){nums=gen(()=>{const a=rnd(20,60)*1000+rnd(0,999);return [a,rnd(8000,a-2000)]},n=>nCarries("sub",n)>=2);kind="sub";opts=[[`${fmt(nums[0])} − ${fmt(nums[1])}`,1],[`${fmt(nums[0])} + ${fmt(nums[1])}`,0]];}
  if(t==="sub2"){nums=gen(()=>[rnd(15,30)*1000+rnd(0,9)*100,rnd(2000,7999),rnd(2000,7999)],n=>n[0]-n[1]-n[2]>500&&nCarries("sub",n)>=2);kind="sub";opts=[[`${fmt(nums[0])} − ${fmt(nums[1])} − ${fmt(nums[2])}`,1],[`${fmt(nums[0])} + ${fmt(nums[1])} + ${fmt(nums[2])}`,0],[`${fmt(nums[0])} − ${fmt(nums[1])} + ${fmt(nums[2])}`,0]];}
  return {mode:"word",kind,nums,wt:t,opts:shuffle(opts.map(([s,ok])=>({s,ok:!!ok}))),phase:1};
}

function newTask(){
  task=makeTask(level); const c=calc(task.kind,task.nums); task.result=c.result; task.cols=c.cols;
  const W=Math.max(...task.nums.map(len),len(task.result)); task.W=W;
  ent={res:Array(W).fill(""),carry:Array(W+1).fill(""),gap:""}; active={role:task.mode==="gap"?"gap":"res",p:0};
  attempts=0; tipLevel=0; done=false; feedback=null; marks=null; task.solShown=false; task.picked=null;
}

/* ---------- grid ---------- */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function buildGrid(o){
  // o: {kind, nums, W, resMode:'input'|'show'|'none'|'partial', resShow:Set, carryMode:'input'|'show'|'none'|'partial', carryShow:Set, carries:[], gap, hlP}
  const W=o.W; const g=el("div","cgrid"); g.style.gridTemplateColumns=`repeat(${W+1},var(--cell))`;
  const add=(cls,txt,attrs={})=>{const c=el("div","cell "+(cls||""),txt===undefined?"":String(txt));for(const k in attrs)c.setAttribute(k,attrs[k]);g.appendChild(c);return c};
  add("lab","");
  for(let p=W-1;p>=0;p--){const c=add("lab",ABBR[p]);c.title=PLACES[lang][p];if(o.hlP===p)c.classList.add("hl")}
  o.nums.forEach((n,i)=>{
    add("sign",i===0?"":(o.kind==="add"?"+":"−"));
    for(let p=W-1;p>=0;p--){
      let txt=p<len(n)?dig(n,p):"";
      if(o.gap&&o.gap.row===i&&o.gap.p===p){gapCell(add,p);continue}
      const c=add("",txt); if(o.hlP===p)c.classList.add("hl");
    }
  });
  // carry row
  add("","");
  for(let p=W-1;p>=0;p--){
    const cv=o.carries?o.carries[p]:0;
    if(o.carryMode==="input"&&p>0){
      const c=add("carry in",ent.carry[p],{tabindex:"0","data-role":"carry","data-p":p,role:"button","aria-label":`${L().carryWord} ${PLACES[lang][p]}`});
      if(active&&active.role==="carry"&&active.p===p)c.classList.add("active");
      if(o.carrySol&&cv){c.textContent=cv;c.classList.add("sol")}
    } else if((o.carryMode==="show"||(o.carryMode==="partial"&&o.carryShow&&o.carryShow.has(p)))&&cv){add("carry",cv)}
    else add("carry","");
  }
  const rule=el("div","rule"); g.appendChild(rule);
  add("","");
  for(let p=W-1;p>=0;p--){
    const rv=p<len(o.result)?dig(o.result,p):"";
    if(o.gap&&o.gap.row==="res"&&o.gap.p===p){gapCell(add,p);continue}
    if(o.resMode==="input"){
      const c=add("in",ent.res[p],{tabindex:"0","data-role":"res","data-p":p,role:"button","aria-label":PLACES[lang][p]});
      if(active&&active.role==="res"&&active.p===p)c.classList.add("active");
      if(marks&&marks[p])c.classList.add(marks[p]);
      if(o.resSol){c.textContent=rv;c.classList.add("sol");c.classList.remove("bad")}
    } else if(o.resMode==="show"){add("",o.shown!==undefined?(p<len(o.shown)?dig(o.shown,p):""):rv)}
    else if(o.resMode==="partial"){const c=add("",o.resShow.has(p)?rv:"");if(o.hlP===p)c.classList.add("hl")}
    else add("","");
  }
  return g;
}
function gapCell(add,p){
  const c=add("in",ent.gap,{tabindex:"0","data-role":"gap","data-p":p,role:"button","aria-label":"?"});
  c.classList.add("active"); if(marks&&marks.gap)c.classList.add(marks.gap);
}

/* ---------- render ---------- */
const view=document.getElementById("view");
function renderShell(){
  document.documentElement.lang=lang;
  document.getElementById("apptitle").innerHTML=L().title;
  document.getElementById("langbtn").textContent=L().other;
  document.getElementById("starcount").textContent=stats.stars;
  const tabs=document.getElementById("tabs"); tabs.innerHTML="";
  L().tabs.forEach((name,i)=>{const b=el("button","",name);b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===tab);b.onclick=()=>{tab=i;render()};tabs.appendChild(b)});
}
function render(){renderShell();view.innerHTML="";[renderPractice,renderExplain,renderMerk,renderCards][tab]()}

function renderPractice(){
  const lv=el("div","levels");
  [1,2,3].forEach(n=>{const b=el("button",`lvl lvl${n}`,`${L().lv[n-1][0]}<small>${L().lv[n-1][1]} · ${L().solvedN(stats.solved[n-1])}</small>`);b.type="button";b.setAttribute("aria-pressed",level===n);b.onclick=()=>{level=n;save();newTask();render()};lv.appendChild(b)});
  view.appendChild(lv);
  const p=el("section","panel"); view.appendChild(p);
  const head=el("div","taskhead");
  const chip=el("span","chip",L().lv[level-1][0]); chip.style.setProperty("--c",`var(--${["orange","pink","purple"][level-1]})`);
  const modeName=task.mode==="calc"?L().modes[task.kind]:L().modes[task.mode];
  head.append(chip,el("h2","",modeName)); head.lastChild.style.margin="0"; p.appendChild(head);

  const showKeypad=()=>{
    const kp=el("div","keypad");
    [1,2,3,4,5,6,7,8,9,0].forEach(d=>{const b=el("button","",d);b.type="button";b.onclick=()=>typeDigit(String(d));kp.appendChild(b)});
    const del=el("button","wide",L().del);del.type="button";del.onclick=()=>typeDigit("");kp.appendChild(del);
    p.appendChild(kp);
  };
  const gridWrap=(opts)=>{const box=el("div","gridbox");box.appendChild(buildGrid(Object.assign({kind:task.kind,nums:task.nums,W:task.W,result:task.result,carries:carriesOf(task)},opts)));p.appendChild(box);box.addEventListener("click",onCellClick)};

  if(task.mode==="calc"){
    p.appendChild(el("p","instr",task.kind==="add"?L().iAdd:L().iSub));
    gridWrap({resMode:"input",carryMode:"input",resSol:task.solShown,carrySol:task.solShown});
    if(!done)showKeypad();
  }
  if(task.mode==="gap"){
    p.appendChild(el("p","instr",L().iGap));
    gridWrap({resMode:"show",carryMode:"none",gap:task.gap});
    if(!done)showKeypad();
  }
  if(task.mode==="est"){
    p.appendChild(el("p","instr",L().iEst));
    p.appendChild(el("p","word",task.nums.map(fmt).join(task.kind==="add"?" + ":" − ")));
    const ch=el("div","choices");
    task.opts.forEach((o,i)=>{const b=el("button","choice",o.s);b.type="button";if(task.picked!=null&&(task.picked===i||(done&&o.ok)))b.classList.add(o.ok?"ok":"bad");b.disabled=done;b.onclick=()=>pickEst(i);ch.appendChild(b)});
    p.appendChild(ch);
  }
  if(task.mode==="error"){
    p.appendChild(el("p","instr",task.phase===1?L().iErr:L().iErr2));
    if(task.phase===1){
      gridWrap({resMode:"show",carryMode:"none",shown:task.shown});
      if(!done){const ch=el("div","actions");const y=el("button","btn",L().yes);y.type="button";y.onclick=()=>judge(true);const n=el("button","btn",L().no);n.type="button";n.onclick=()=>judge(false);ch.append(y,n);p.appendChild(ch)}
    } else {
      p.appendChild(el("span","claimed",L().miaRes(task.shown)+" ✗"));
      gridWrap({resMode:"input",carryMode:"input",resSol:task.solShown,carrySol:task.solShown});
      if(!done)showKeypad();
    }
  }
  if(task.mode==="word"){
    const [text,ans]=L().words[task.wt](...task.nums);
    p.appendChild(el("p","word",text));
    if(task.phase===1){
      p.appendChild(el("p","instr",L().iWord));
      const ch=el("div","choices");
      task.opts.forEach((o,i)=>{const b=el("button","choice",o.s);b.type="button";if(task.picked===i)b.classList.add(o.ok?"ok":"bad");b.onclick=()=>pickWord(i);ch.appendChild(b)});
      p.appendChild(ch);
    } else {
      p.appendChild(el("p","instr",L().iWord2));
      gridWrap({resMode:"input",carryMode:"input",resSol:task.solShown,carrySol:task.solShown});
      if(!done)showKeypad(); else p.appendChild(el("p","msg info",`<b>${L().answer}:</b> ${ans(task.result)}`));
    }
  }
  // actions
  const act=el("div","actions");
  const needsCheck=(task.mode==="calc"||task.mode==="gap"||(task.mode==="error"&&task.phase===2)||(task.mode==="word"&&task.phase===2));
  if(!done){
    const tb=el("button","btn tip",L().tip);tb.type="button";tb.onclick=()=>{tipLevel=Math.min(tipLevel+1,2);render()};act.appendChild(tb);
    if(needsCheck){const cb=el("button","btn primary",L().check);cb.type="button";cb.onclick=check;act.appendChild(cb)}
    if(attempts>=2&&needsCheck&&task.mode!=="gap"){const sb=el("button","btn",L().show);sb.type="button";sb.onclick=showSolution;act.appendChild(sb)}
    if(attempts>=2&&task.mode==="gap"){const sb=el("button","btn",L().show);sb.type="button";sb.onclick=()=>{ent.gap=String(task.gap.val);marks={gap:"ok"};done=true;feedback={cls:"info",text:L().solShown};render()};act.appendChild(sb)}
  } else {
    const nb=el("button","btn good",L().next);nb.type="button";nb.onclick=()=>{newTask();render()};act.appendChild(nb);
  }
  p.appendChild(act);
  if(feedback)p.appendChild(el("div","msg "+feedback.cls,feedback.text));
  if(tipLevel>0&&!done)p.appendChild(el("div","tipcard",tipText()));
}
function carriesOf(t){const arr=[];t.cols.forEach(c=>{arr[c.p+1]=c.cout});return arr}

/* ---------- interaction ---------- */
function onCellClick(e){const c=e.target.closest(".cell.in");if(!c||done)return;active={role:c.dataset.role,p:Number(c.dataset.p)};render()}
function typeDigit(d){
  if(done||!active)return;
  if(active.role==="gap"){ent.gap=d;if(marks)marks.gap=null;render();return}
  ent[active.role][active.p]=d; if(marks&&active.role==="res")marks[active.p]=null;
  if(d!==""){
    if(active.role==="res"&&active.p<task.W-1)active={role:"res",p:active.p+1};
    else if(active.role==="carry")active={role:"res",p:active.p};
  }
  render();
}
document.addEventListener("keydown",e=>{
  if(tab!==0||done)return;
  if(/^[0-9]$/.test(e.key)){typeDigit(e.key);e.preventDefault()}
  else if(e.key==="Backspace"||e.key==="Delete"){typeDigit("");e.preventDefault()}
  else if(e.key==="Enter"&&!(e.target&&e.target.tagName==="BUTTON")){check();e.preventDefault()}
  else if(e.key==="ArrowLeft"&&active&&active.role==="res"&&active.p<task.W-1){active.p++;render()}
  else if(e.key==="ArrowRight"&&active&&active.role==="res"&&active.p>0){active.p--;render()}
});
function success(){
  done=true; stats.stars+=attempts===0&&tipLevel===0?2:1; stats.solved[level-1]++; save();
  feedback={cls:"ok",text:pick(L().ok)}; render();
}
function fail(){attempts++;feedback={cls:"bad",text:L().bad+(attempts>=2?" "+L().bad2:"")};render()}
function check(){
  if(done)return;
  if(task.mode==="gap"){
    if(ent.gap===""){feedback={cls:"bad",text:L().empty};render();return}
    if(Number(ent.gap)===task.gap.val){marks={gap:"ok"};success()}else{marks={gap:"bad"};fail()}
    return;
  }
  if(!(task.mode==="calc"||task.phase===2))return;
  if(ent.res.every(v=>v==="")){feedback={cls:"bad",text:L().empty};render();return}
  marks={}; let allOk=true;
  for(let p=0;p<task.W;p++){
    const exp=p<len(task.result)?String(dig(task.result,p)):null; const v=ent.res[p];
    const ok=exp===null?(v===""||v==="0"):v===exp;
    if(exp!==null||v!=="")marks[p]=ok?"ok":"bad"; if(!ok)allOk=false;
  }
  allOk?success():fail();
}
function showSolution(){task.solShown=true;done=true;marks={};feedback={cls:"info",text:L().solShown};render()}
function pickEst(i){task.picked=i;if(task.opts[i].ok){success()}else{attempts++;feedback={cls:"bad",text:L().estBad};if(attempts>=2){done=true}render()}}
function judge(saysRight){
  if(task.isRight&&saysRight){success();feedback={cls:"ok",text:L().errRightOk};render();return}
  if(task.isRight&&!saysRight){done=true;feedback={cls:"bad",text:L().errRightBad};render();return}
  if(!task.isRight&&!saysRight){task.phase=2;feedback={cls:"ok",text:L().errWrongOk};render();return}
  attempts++;feedback={cls:"bad",text:L().errWrongBad};render();
}
function pickWord(i){task.picked=i;if(task.opts[i].ok){task.phase=2;feedback=null}else{feedback={cls:"bad",text:L().wordBad}}render()}

/* ---------- tips ---------- */
function colText(t,col){
  const pl=PLACES[lang][col.p]; const pln=PLACES[lang][col.p+1]||"";
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  if(t.kind==="add"){
    const parts=[...col.ds.map(String),...(col.cin?[`${col.cin} (${L().carryWord})`]:[])].join(" + ");
    return L().colAdd(cap(pl),parts,col.tot,col.r,col.cout,pln);
  }
  const lowerParts=[...col.ds.map(String),...(col.cin?[`${col.cin} (${L().carryWord})`]:[])];
  const lower=lowerParts.length>1?lowerParts.join(" + "):"";
  return L().colSub(cap(pl),lower,col.s,col.md+0,col.r,col.cout,pln);
}
function tipText(){
  const gen=L().tipGen;
  if(task.mode==="est")return `<b>${L().tip}:</b> ${gen.est}`;
  if(task.mode==="gap"){const col=task.cols[task.gap.p];return `<b>${L().tip}:</b> ${gen.gap}`+(tipLevel>1&&col?`<br>${colText(task,col)}`:"")}
  if(task.mode==="word"&&task.phase===1)return `<b>${L().tip}:</b> ${L().wordBad.split(". ").slice(1).join(". ")}`;
  if(task.mode==="error"&&task.phase===1){const ov=overschlag(task.kind,task.nums);return `<b>${L().tip}:</b> ${L().modes.est}: ${ov.str}`}
  let s=`<b>${L().tip}:</b> ${task.kind==="add"?gen.add:gen.sub}`;
  if(tipLevel>1){
    let target=task.cols.find(c=>{const v=ent.res[c.p];return v===""||v!==String(c.r)});
    if(target)s+=`<br><br>${colText(task,target)}`;
  }
  return s;
}

/* ---------- explanation ---------- */
const ex={add:{nums:[4758,2694],step:0},sub:{nums:[8342,2576],step:0}};
function stepsFor(kind,nums){
  const {cols,result}=calc(kind,nums); const ov=overschlag(kind,nums); const steps=[];
  steps.push({text:kind==="add"?L().stepStart(ov.str):L().stepStartSub(ov.str),res:new Set(),car:new Set(),hl:null});
  const res=new Set(),car=new Set();
  cols.forEach(c=>{
    if(kind==="sub"&&c.p>=len(result)&&c.r===0)return;
    res.add(c.p); if(c.cout)car.add(c.p+1);
    steps.push({text:colText({kind},c),res:new Set(res),car:new Set(car),hl:c.p});
  });
  const probe=`${fmt(result)} + ${nums.slice(1).map(fmt).join(" + ")} = ${fmt(nums[0])}`;
  steps.push({text:kind==="add"?L().stepEnd(result,ov.str):L().stepEndSub(result,probe),res:new Set(res),car:new Set(car),hl:null});
  return {steps,result};
}
function renderExplain(){
  const p=el("section","panel"); view.appendChild(p);
  p.appendChild(el("h2","",L().explainTitle));
  const terms=el("div","terms");
  const tAdd=L().termAdd, tSub=L().termSub;
  terms.appendChild(el("div","term",`<div class="eq">325 + 143 = 468</div><div class="lbl">${tAdd[0]} + ${tAdd[1]} = ${tAdd[2]}</div>`));
  terms.appendChild(el("div","term",`<div class="eq">468 − 143 = 325</div><div class="lbl">${tSub[0]} − ${tSub[1]} = ${tSub[2]}</div>`));
  p.appendChild(terms);
  ["add","sub"].forEach(kind=>{
    const sec=el("div","section player");
    sec.appendChild(el("h3","",kind==="add"?L().addEx:L().subEx));
    const st=ex[kind]; const {steps,result}=stepsFor(kind,st.nums); const s=steps[Math.min(st.step,steps.length-1)];
    const W=Math.max(...st.nums.map(len),len(result));
    const carries=[];calc(kind,st.nums).cols.forEach(c=>{carries[c.p+1]=c.cout});
    const box=el("div","gridbox");
    box.appendChild(buildGrid({kind,nums:st.nums,W,result,carries,resMode:"partial",resShow:s.res,carryMode:"partial",carryShow:s.car,hlP:s.hl}));
    sec.appendChild(box);
    sec.appendChild(el("div","steptext",s.text));
    const nav=el("div","stepnav");
    const b1=el("button","btn",L().back);b1.type="button";b1.disabled=st.step===0;b1.onclick=()=>{st.step--;render()};
    const cnt=el("span","count",`${st.step+1} / ${steps.length}`);
    const b2=el("button","btn primary",L().fwd);b2.type="button";b2.disabled=st.step>=steps.length-1;b2.onclick=()=>{st.step++;render()};
    const b3=el("button","btn",L().newEx);b3.type="button";b3.onclick=()=>{st.nums=kind==="add"?gen(()=>[rnd(1000,8999),rnd(1000,8999)],n=>nCarries("add",n)>=2&&n[0]+n[1]<10000):gen(()=>{const a=rnd(3000,9999);return [a,rnd(1000,a-500)]},n=>nCarries("sub",n)>=2);st.step=0;render()};
    nav.append(b1,cnt,b2,b3); sec.appendChild(nav);
    p.appendChild(sec);
  });
}
function renderMerk(){
  const p=el("section","panel"); view.appendChild(p);
  p.appendChild(el("h2","",L().merkTitle));
  const m=el("div","merk");
  const a=el("div","");a.appendChild(el("h3","",L().modes.add));const ol=el("ol");L().merkAdd.forEach(x=>ol.appendChild(el("li","",x)));a.appendChild(ol);
  const b=el("div","");b.appendChild(el("h3","",L().modes.sub));const ol2=el("ol");L().merkSub.forEach(x=>ol2.appendChild(el("li","",x)));b.appendChild(ol2);
  m.append(a,b); p.appendChild(m);
  const e=el("div","section");e.style.marginTop="18px";e.appendChild(el("h3","",L().errTitle));
  const list=el("div","err");L().errs.forEach(([t,x])=>list.appendChild(el("div","erritem",`<span>${t}</span><span class="ex">${x}</span>`)));
  e.appendChild(list);p.appendChild(e);
  const g=el("div","section");g.appendChild(el("h3","",L().glossTitle));
  const tbl=el("table","gloss");L().gloss.forEach(([a,b])=>tbl.appendChild(el("tr","",`<td><b>${a}</b></td><td>${b}</td>`)));
  const tw=el("div","");tw.style.overflowX="auto";tw.appendChild(tbl);g.appendChild(tw);p.appendChild(g);
}
function renderCards(){
  const p=el("section","panel"); view.appendChild(p);
  p.appendChild(el("h2","",L().cardsTitle));
  const grid=el("div","cards");
  L().cards.forEach(([q,a],i)=>{
    const b=el("button","fcard");b.type="button";b.setAttribute("aria-pressed","false");
    b.innerHTML=`<div class="fin"><div class="face front"><span class="num">${i+1}</span><span class="q">${q}</span><span class="hint">${L().tapHint}</span></div><div class="face back">${a}</div></div>`;
    b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");
    grid.appendChild(b);
  });
  p.appendChild(grid);
}
document.getElementById("langbtn").onclick=()=>{lang=lang==="de"?"tr":"de";save();render()};
newTask(); render();
