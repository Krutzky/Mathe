<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fit für Diagramme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Karoheft-Look der ZP10-App. Die Startseite ist ein Stationsraster: Themen als Zeilen, die drei Buchfarben als Spalten. */
:root{
  --bg:#EDF1F8; --grid:rgba(35,87,201,.08); --surface:#FFFFFF; --surface-2:#F2F5FB; --ink:#10204A; --ink-soft:#4F5A78; --line:#C9D2E3;
  --head:#0F1E46; --accent:#FFC93C; --accent-ink:#2A1E00; --blue:#2357C9; --blue-soft:#DDE7FA;
  --ok:#1F8A5B; --ok-soft:#DCF2E6; --bad:#BC2F2F; --bad-soft:#FBE3E3;
  --o:#B84E06; --o-soft:#FDE7D4; --p:#B01A6C; --p-soft:#FBDEEC; --l:#5A3DB0; --l-soft:#E8E2F8;
  --gridline:#D3DCEE;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1230; --grid:rgba(140,170,255,.06); --surface:#121C42; --surface-2:#18245A; --ink:#ECF0FA; --ink-soft:#A6B0D2; --line:#2C3A78;
  --head:#060C24; --accent:#FFCF4D; --accent-ink:#231800; --blue:#7FAAF5; --blue-soft:#1C2B66;
  --ok:#4CC48A; --ok-soft:#113A2A; --bad:#F58A8A; --bad-soft:#431C24;
  --o:#F7A25F; --o-soft:#3B2614; --p:#F58CC4; --p-soft:#431B38; --l:#B89AF0; --l-soft:#2A1E52; --gridline:#26346F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1230; --grid:rgba(140,170,255,.06); --surface:#121C42; --surface-2:#18245A; --ink:#ECF0FA; --ink-soft:#A6B0D2; --line:#2C3A78;
  --head:#060C24; --accent:#FFCF4D; --accent-ink:#231800; --blue:#7FAAF5; --blue-soft:#1C2B66;
  --ok:#4CC48A; --ok-soft:#113A2A; --bad:#F58A8A; --bad-soft:#431C24;
  --o:#F7A25F; --o-soft:#3B2614; --p:#F58CC4; --p-soft:#431B38; --l:#B89AF0; --l-soft:#2A1E52; --gridline:#26346F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{background:var(--head);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;color:#fff;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
.top{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#FFD866}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2}
.brand em{font-style:normal;background:linear-gradient(transparent 58%,rgba(255,201,60,.55) 58%)}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:transparent;border:0;border-radius:10px 10px 0 0;padding:9px 14px;color:#C6D5F5;font-weight:700;white-space:nowrap}
nav button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;min-width:0}
main>section{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(15,30,70,.07);min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.stack{display:grid;gap:10px}
.muted{color:var(--ink-soft)}
.small{font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:17px;transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:15px}
/* Farbstufen */
.c-o{--c:var(--o);--cs:var(--o-soft)} .c-p{--c:var(--p);--cs:var(--p-soft)} .c-l{--c:var(--l);--cs:var(--l-soft)}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c);background:var(--cs);border-radius:999px;padding:3px 11px;font-size:14px}
.pips{display:inline-flex;gap:2px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--c);opacity:.28}
.pips i.f{opacity:1}
/* Stationsraster */
.gridhead,.st{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,92px);gap:8px;align-items:center}
.gridhead{padding-inline:2px;font-size:14px}
.gridhead span{justify-self:center}
.st{padding-block:10px;border-top:1px solid var(--line)}
.st h3{margin-bottom:2px}
.cell{border:2px solid var(--c);background:var(--cs);color:var(--c);border-radius:12px;min-height:58px;padding:6px 4px;font-weight:700;display:grid;place-items:center;line-height:1.15;font-size:14px}
.cell b{font-family:var(--f-display);font-size:18px}
.cell.done{background:var(--c);color:var(--surface)}
.cell.next{box-shadow:0 0 0 3px var(--accent)}
@media(max-width:600px){.gridhead{display:none}.st{grid-template-columns:repeat(3,minmax(0,1fr))}.st>div:first-child{grid-column:1/-1}.cell .nm{display:block}}
@media(min-width:601px){.cell .nm{display:none}}
.nextbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.total{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.total div{height:100%;background:var(--ok);transition:width .3s}
/* Aufgabe */
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qt{font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin-inline:1px}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding-inline:2px}
.tw{overflow-x:auto;max-width:100%}
table.z{border-collapse:collapse;margin-block:2px}
table.z th,table.z td{border:1.5px solid var(--c,var(--blue));padding:7px 10px;text-align:center;min-width:44px}
table.z th{background:var(--cs,var(--blue-soft));font-weight:700;font-size:15px;text-align:left;max-width:150px}
table.z input,.numin{background:var(--surface);border:2px solid var(--line);border-radius:8px;text-align:center;width:66px;padding:5px 2px}
table.ds td.op{white-space:nowrap;border:0;background:none;color:var(--c);font-weight:700;min-width:36px;padding:0 4px;font-size:15px;position:relative}
table.z td.v{padding:5px}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.fix{display:block;font-size:14px;font-weight:700;color:var(--ok)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.optk{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:14px}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin{width:130px;text-align:left;padding:10px 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .opt{padding:9px 14px}
svg.g{display:block;width:100%;max-width:420px;height:auto;touch-action:manipulation}
svg.g .gl{stroke:var(--gridline);stroke-width:1}
svg.g .ax{stroke:var(--ink);stroke-width:1.6}
svg.g text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-body)}
svg.g .lb{fill:var(--ink);font-weight:700}
svg.g .cv{stroke:var(--blue);stroke-width:2.5;fill:none}
svg.g .pt{fill:var(--blue)} svg.g .pt.ok{fill:var(--ok)} svg.g .pt.no{fill:var(--bad)} svg.g .pt.mk{fill:var(--c,var(--blue))}
svg.g .hit{fill:transparent;cursor:pointer}
.tip{background:var(--blue-soft);border-radius:12px;padding:10px 14px}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.y{background:var(--ok-soft)} .fb.n{background:var(--bad-soft)}
.fb b.h{font-family:var(--f-display)}
.fb ol{margin:0;padding-left:20px}
.pr{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pr div{height:100%;background:var(--c,var(--blue));transition:width .2s}
/* Ergebnis */
.big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;color:var(--c,var(--ink))}
.rv{border-top:1px solid var(--line);padding-block:12px;display:grid;gap:6px}
.rv .mk{font-weight:700}
.rv .y{color:var(--ok)} .rv .n{color:var(--bad)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;font-size:15px}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--ok)}
/* Merkzettel */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}
.m-p{--c:var(--blue);--cs:var(--blue-soft)}
ol.st3,ul.st3{margin:0;padding-left:20px;display:grid;gap:4px}
.f{display:grid;gap:4px;font-weight:700;font-size:15px}
.f input{font-weight:400;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
textarea{position:absolute;left:-9999px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--head);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Ergänzungen Diagramm-App */
.big2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.streak{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 9px;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{border:1.5px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:14px;color:var(--ink-soft)}
.badge.on{border:1.5px solid var(--c);background:var(--cs);color:var(--c);font-weight:700}
.fig{min-width:0}.fig p{margin-bottom:6px}
svg.dg{max-width:440px;touch-action:none;user-select:none;-webkit-user-select:none}
.fig svg.dg,.opt svg.dg,.three svg.dg,.m-p svg.dg,.rv svg.dg{touch-action:auto}
svg.dg .tt{fill:var(--ink);font-weight:700;font-size:13px;font-family:var(--f-display)}
svg.dg .cat{fill:var(--ink);font-size:11px}
svg.dg .sbar{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.4}
svg.dg .dbar{fill:var(--cs,var(--blue-soft));stroke:var(--c,var(--blue));stroke-width:2}
svg.dg .dbar.no{fill:var(--bad-soft);stroke:var(--bad)}
svg.dg .dbar.ok{fill:var(--ok-soft);stroke:var(--ok)}
svg.dg .ghost{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-dasharray:6 4}
svg.dg .hi{fill:none;stroke:var(--c,var(--blue));stroke-width:3}
svg.dg .hit{fill:transparent;cursor:ns-resize}
svg.dg .hit:focus-visible{outline:none;stroke:var(--blue);stroke-width:2}
svg.dg .tk{fill:var(--accent);stroke:var(--ink);stroke-width:1}
svg.dg .tke{fill:var(--ink)}svg.dg .tkm{fill:none;stroke:var(--ink);stroke-width:1.3}
svg.dg .tkh{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
svg.tally line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.tallybox{display:inline-flex;gap:14px;align-items:center;flex-wrap:wrap}
td.tl{text-align:left!important}
svg.mini{width:96px;height:auto;display:block}
svg.mini .ax{stroke:var(--ink);stroke-width:1.6}
svg.mini text{fill:var(--ink);font-size:11px;font-family:var(--f-body)}
.opts.wide{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.opts.rowo{grid-template-columns:repeat(3,minmax(0,1fr))}
.optb{min-width:0;flex:1}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ur{display:flex;flex-wrap:wrap;gap:6px}
.ur span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:15px}
.marktext{font-size:19px;line-height:1.95}
.mk{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;font-weight:700}
.mk[aria-pressed="true"]{border-color:var(--c);background:var(--cs);color:var(--c)}
.pick{display:grid;gap:6px}
.wait{border:2px dashed var(--line);border-radius:12px;padding:30px 16px;text-align:center;color:var(--ink-soft)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.three>div{min-width:0;display:grid;gap:6px;align-content:start}
.mk2{font-weight:700}.mk2.y{color:var(--ok)}.mk2.n{color:var(--bad)}
.fb ul.st3,.fb ol.st3{padding-left:20px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf i{position:absolute;top:-60px;width:9px;border-radius:2px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header><div class="wrap">
  <div class="top">Klasse 5 · Kapitel 1 Zahlen und Daten</div>
  <div class="brand">Fit für <em>Diagramme</em></div>
  <nav aria-label="Bereiche">
    <button type="button" data-v="home">Stationen</button>
    <button type="button" data-v="text">Textdetektive</button>
    <button type="button" data-v="exam">Experten</button>
    <button type="button" data-v="memo">Merkzettel</button>
  </nav>
</div></header>
<main>
  <section id="vHome"></section>
  <section id="vText" hidden></section>
  <section id="vExam" hidden></section>
  <section id="vMemo" hidden></section>
  <section id="vTask" hidden></section>
  <section id="vRes" hidden></section>
</main>
<div id="toast" role="status"></div>
<script>
/* ---------- Hilfen ---------- */
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const de=x=>{const r=Math.round(x*100)/100,s=String(r).split('.');return s[0].replace(/\B(?=(\d{3})+$)/g,' ')+(s[1]?','+s[1]:'');};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>String(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain=s=>String(s).replace(/\*\*/g,'').replace(/<br>/g,' ').replace(/<[^>]+>/g,'');
const sum=a=>a.reduce((x,y)=>x+y,0);
function parseNum(s){s=String(s).trim().replace(/\s/g,'');if(!s)return NaN;if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'));}
const same=(a,b)=>Math.abs(a-b)<1e-6;
const LV={o:'Orange',p:'Pink',l:'Lila'},LVS=['o','p','l'];
const TOPICS=[
 {id:'typ',name:'Diagrammtyp erkennen',sub:'Ich kann Säulen-, Balken- und Bilddiagramme unterscheiden.',page:16},
 {id:'achse',name:'Achsen verstehen',sub:'Ich weiß, was an welche Achse gehört und wie sie eingeteilt ist.',page:16},
 {id:'wert',name:'Werte ablesen',sub:'Ich kann Zahlen aus einem Diagramm ablesen.',page:16},
 {id:'bild',name:'Bilddiagramme',sub:'Ich nutze die Erklärung: Wie viel zählt ein Bild?',page:16},
 {id:'liste',name:'Strichliste und Tabelle',sub:'Ich kann Daten zählen und in eine Häufigkeitstabelle schreiben.',page:12},
 {id:'zeich',name:'Diagramm zeichnen',sub:'Ich kann Daten in Diagrammen darstellen.',page:16}
];
const TEXT=[
 {id:'tm',name:'Zahlen im Text finden',sub:'Welche Zahlen gehören ins Diagramm, welche nicht?',page:16},
 {id:'tt',name:'Vom Text in die Tabelle',sub:'Ich hole die Angaben aus dem Text heraus.',page:12},
 {id:'td',name:'Vom Text ins Diagramm',sub:'Ich zeichne ein Diagramm nur aus einem Text.',page:16},
 {id:'tc',name:'Passen Text und Diagramm?',sub:'Ich vergleiche und finde Fehler.',page:16}
];
const GEN=[];
function gen(t,l,id,make){(Array.isArray(l)?l:[l]).forEach(x=>GEN.push({t,l:x,id,make:()=>make(x)}));}
const KL=()=>pick(['5a','5b','5c','5d']);
const NM=['Emir','Lina','Aylin','Jonas','Mia','Noah','Zeynep','Ben','Lea','Yusuf','Amira','Tom','Elif','Finn'];

/* ---------- Sachsituationen (alle Daten sind ausgedacht) ---------- */
const svy=(s,f,cl,cats)=>({s,f,cl,vl:'Anzahl',u:'Kinder',cats,min:1,max:10,sv:1,sent:[(c,n)=>`${n} Kinder nennen ${c}.`,(c,n)=>`Für ${c} stimmen ${n} Kinder.`,(c,n)=>`${c}: ${n} Stimmen.`]});
const CTX=[
 svy('Lieblingssport','Was ist dein Lieblingssport?','Sportart',['Fußball','Schwimmen','Tanzen','Basketball','Turnen','Judo']),
 svy('Lieblingsobst','Welches Obst isst du am liebsten?','Obst',['Äpfel','Bananen','Erdbeeren','Trauben','Kirschen','Melonen']),
 svy('Lieblingstiere','Welches Haustier findest du am besten?','Tier',['Hunde','Katzen','Hamster','Fische','Vögel','Kaninchen']),
 svy('Schulweg','Wie kommst du zur Schule?','Verkehrsmittel',['Bus','Fahrrad','Auto','Bahn','Roller']),
 svy('Lieblingsfächer','Was ist dein Lieblingsfach?','Fach',['Mathe','Sport','Kunst','Musik','Englisch','Deutsch']),
 svy('Beliebte AGs','Welche AG möchtest du besuchen?','AG',['Theater','Robotik','Chor','Schach','Garten','Kochen']),
 svy('Ausflugsziele','Wohin soll der Ausflug gehen?','Ziel',['Zoo','Freibad','Kino','Kletterpark','Museum']),
 svy('Pausensnacks','Was isst du in der Pause am liebsten?','Snack',['Brot','Apfel','Müsliriegel','Brezel','Joghurt','Möhren']),
 {s:'Gelesene Bücher',cl:'Name',vl:'Bücher',u:'Bücher',cats:NM,names:1,min:1,max:2,intro:'Die Lese-AG zählt, wie viele Bücher jedes Kind in den Ferien gelesen hat.',sent:[(c,n)=>`${c} hat ${n} Bücher gelesen.`,(c,n)=>`Bei ${c} waren es ${n} Bücher.`]},

 let body='';
 if(q.type==='mc'){q.ord=q.fixo?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i));body=`<div class="opts ${q.wide?'wide':''} ${q.row?'rowo':''}">${q.ord.map((oi,k)=>`<button type="button" class="opt" data-i="${oi}" aria-pressed="false"><span class="optk">${'ABCD'[k]}</span><span class="optb">${fmt(q.o[oi])}</span></button>`).join('')}</div>`;}
 if(q.type==='num')body=`<div class="numrow"><input class="numin" id="num" inputmode="decimal" autocomplete="off" placeholder="Antwort" aria-label="Deine Antwort"> ${q.unit?`<span>${esc(q.unit)}</span>`:''}</div>`;
 if(q.type==='fill')body=`<div class="tw"><table class="z"><tr><th scope="row">${esc(q.d.cl||'Antwort')}</th>${q.d.cats.map(c=>`<td>${esc(c)}</td>`).join('')}</tr><tr><th scope="row">${esc(q.d.vl||'Anzahl')}</th>${q.d.cats.map((c,i)=>`<td class="v"><input id="f${i}" inputmode="numeric" autocomplete="off" aria-label="Wert für ${esc(c)}"></td>`).join('')}</tr></table></div>`;
 if(q.type==='mark')body='';
 if(q.type==='draw')body=drawHtml(q);
 const box=$('vTask');box.className=cls;
 const qtext=q.type==='mark'?`<div class="qt">${fmt(q.q)}</div><p class="marktext">${q.parts.map((p,i)=>typeof p==='string'?esc(p):`<button type="button" class="mk" data-m="${i}" aria-pressed="false">${de(p.n)}</button>`).join('')}</p>`:`<div class="qt">${fmt(q.q)}</div>`;
 box.innerHTML=`<div class="card stack">${head}${qtext}${q.fig?`<div class="fig">${q.fig}</div>`:''}${body}<div id="tipBox"></div><div id="fbBox"></div><div class="row" id="acts"></div></div>`;
 box.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{if(A.done)return;A.sel=+b.dataset.i;box.querySelectorAll('.opts .opt').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 box.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{if(A.done)return;const i=+b.dataset.m;if(A.marked.has(i))A.marked.delete(i);else A.marked.add(i);b.setAttribute('aria-pressed',A.marked.has(i));});
 if(q.type==='draw')bindDraw(q);
 box.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=$('go');if(b)b.click();}}));
}
/* --- Zeichnen --- */
const drawCfg=q=>{const d=q.d,s=q.pk.step?A.picks.step:d.step;if(!s)return null;const mx=Math.max(...d.vals),top=s*(Math.ceil(mx/s)+1);return Object.assign({},d,{step:s,top,lab:top/s>12?Math.ceil(top/s/10):1});};
const pickRow=(k,lab,opts)=>`<div class="pick"><div class="small"><b>${lab}</b></div><div class="seg" data-p="${k}">${opts.map((o,i)=>`<button type="button" class="opt" data-v="${esc(o[1])}" aria-pressed="false">${esc(o[0])}</button>`).join('')}</div></div>`;
function drawHtml(q){const d=q.d;let h='';q._t=null;
 if(q.pk.axis)h+=pickRow('axis',`Was kommt an die ${d.kind==='bar'?'senkrechte Achse':'Hochachse'}?`,shuffle([[d.vl,d.kind==='bar'?'v':'r'],[d.cl,d.kind==='bar'?'r':'v']]));
 if(q.pk.step)h+=pickRow('step','Welche Einteilung wählst du? Ein Kästchen steht für …',shuffle([q.pk.step.right].concat(q.pk.step.wrong.map(x=>x[0]))).map(v=>[String(v),v]));
 if(q.pk.title){q._t=titles(d);h+=pickRow('title','Welche Überschrift passt?',shuffle(q._t).map(t=>[t[0],t[1]?'r':'n'+t[0]]));}
 return `<div class="stack">${h}<div id="plot"></div><div class="small muted" id="drawHelp">${d.kind==='bar'?'Tippe in eine Zeile: So lang wird der Balken.':'Tippe in eine Spalte: So hoch wird die Säule.'} Du kannst auch ziehen.</div></div>`;}
function drawPlot(q){const c=drawCfg(q),el=$('plot');if(!el)return;
 if(!c){el.innerHTML=`<div class="wait">Wähle oben die Einteilung. Dann erscheint hier dein Diagramm.</div>`;$('drawHelp').hidden=true;return;}
 $('drawHelp').hidden=false;
 if(!A.bars||A.barsStep!==c.step){A.bars=c.cats.map(()=>0);A.barsStep=c.step;}
 const ax=q.pk.axis?A.picks.axis:'r',up=c.kind==='bar'?c.cl:c.vl,rt=c.kind==='bar'?c.vl:c.cl;
 const opts={input:true,draw:A.bars,hideTitle:!!q.pk.title&&A.picks.title===undefined};
 if(q.pk.axis){if(ax===undefined){opts.upL='?';opts.rightL='?';}else if(ax==='v'){opts.upL=rt;opts.rightL=up;}}
 if(q.pk.title&&A.picks.title!==undefined){c.title=A.picks.titleText;}
 else if(q.pk.title)c.title='';
 el.innerHTML=chart(c,opts);
 const svg=el.querySelector('svg'),g=geo(c),set=(i,v)=>{v=Math.max(0,Math.min(c.top,v));A.bars[i]=v;const r=svg.querySelector(`[data-b="${i}"]`);const pos=v/c.top;if(g.bar)r.setAttribute('width',pos*g.pw);else{const h=pos*g.ph;r.setAttribute('height',h);r.setAttribute('y',g.T+g.ph-h);}svg.querySelector(`.hit[data-i="${i}"]`).setAttribute('aria-valuenow',v);};
 const fromEvt=e=>{const m=svg.getScreenCTM();if(!m)return null;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(m.inverse()),n=c.cats.length;let i,frac;if(g.bar){i=Math.floor((p.y-g.T)/(g.ph/n));frac=(p.x-g.L)/g.pw;}else{i=Math.floor((p.x-g.L)/(g.pw/n));frac=(g.T+g.ph-p.y)/g.ph;}if(i<0||i>=n)return null;return {i,v:Math.round(frac*c.top/c.step)*c.step};};
 let drag=null;
 svg.addEventListener('pointerdown',e=>{if(A.done)return;const h=fromEvt(e);if(!h)return;drag=h.i;try{svg.setPointerCapture(e.pointerId);}catch(x){}set(h.i,h.v);e.preventDefault();});
 svg.addEventListener('pointermove',e=>{if(drag==null||A.done)return;const h=fromEvt(e);if(h){const m=svg.getScreenCTM().inverse(),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;set(drag,h.v);}});
 const end=()=>{drag=null;};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
 svg.querySelectorAll('.hit').forEach(r=>r.addEventListener('keydown',e=>{if(A.done)return;const i=+r.dataset.i,up_=['ArrowUp','ArrowRight'].includes(e.key),dn=['ArrowDown','ArrowLeft'].includes(e.key);if(up_||dn){e.preventDefault();set(i,A.bars[i]+(up_?c.step:-c.step));}}));
}
function bindDraw(q){const box=$('vTask');box.querySelectorAll('.seg').forEach(s=>{const k=s.dataset.p;s.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(A.done)return;s.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));if(k==='step')A.picks.step=+b.dataset.v;else{A.picks[k]=b.dataset.v;if(k==='title')A.picks.titleText=b.textContent;}drawPlot(q);});});drawPlot(q);}
function answered(q){if(q.type==='mc')return A.sel!=null;if(q.type==='num')return $('num').value.trim()!=='';if(q.type==='fill')return q.d.cats.every((_,i)=>$('f'+i).value.trim()!=='');if(q.type==='mark')return A.marked.size>0;
 if(q.type==='draw'){if(q.pk.axis&&A.picks.axis===undefined)return false;if(q.pk.step&&!A.picks.step)return false;if(q.pk.title&&A.picks.title===undefined)return false;return A.bars&&A.bars.every(v=>v>0);}return true;}
/* Bewertung: ok, Antwort, richtige Lösung, Erklärungen zum Fehler */
function grade(q){
 if(q.type==='mc'){const ok=A.sel===q.c,tx=i=>q.ot?q.ot[i]:plain(q.o[i]);return{ok,txt:A.sel==null?'keine Antwort':tx(A.sel),right:tx(q.c),msgs:!ok&&A.sel!=null&&q.why&&q.why[A.sel]?[q.why[A.sel]]:[]};}
 if(q.type==='num'){const raw=$('num').value,v=parseNum(raw),ok=same(v,q.ans),t=(q.trap||[]).find(t=>same(t[0],v));return{ok,txt:raw.trim()||'keine Antwort',right:de(q.ans)+(q.unit?(q.unit.startsWith('-')?q.unit:' '+q.unit):''),msgs:!ok&&t?[t[1]]:[]};}
 if(q.type==='fill'){const v=q.d.cats.map((_,i)=>parseNum($('f'+i).value)),bad=[];const msgs=[];v.forEach((x,i)=>{if(!same(x,q.ans[i])){bad.push(i);if((q.dist||[]).includes(x))msgs.push(`${de(x)} gehört nicht zu ${q.d.cats[i]}. Diese Zahl ist im Text nur eine Ablenkung.`);else{const j=q.ans.findIndex((a,k)=>k!==i&&same(a,x));if(j>=0)msgs.push(`${de(x)} gehört zu ${q.d.cats[j]}, nicht zu ${q.d.cats[i]}. Lies den Satz mit dem Namen noch einmal.`);else msgs.push(`Bei ${q.d.cats[i]} stimmt ${isNaN(x)?'dein Eintrag':de(x)} nicht. Richtig ist ${de(q.ans[i])}.`);}}});
  return{ok:!bad.length,bad,txt:v.map(x=>isNaN(x)?'–':de(x)).join(' · '),right:q.d.cats.map((c,i)=>c+' '+de(q.ans[i])).join(', '),msgs:msgs.slice(0,3)};}
 if(q.type==='mark'){const nb=[],ms=[];q.parts.forEach((p,i)=>{if(typeof p==='string')return;if(p.ok&&!A.marked.has(i))nb.push(p);if(!p.ok&&A.marked.has(i))ms.push(p.why);});const msgs=ms.slice();if(nb.length)msgs.push(`Dir fehlt noch: ${nb.map(p=>de(p.n)).join(', ')}.`);const right=q.parts.filter(p=>p.ok).map(p=>de(p.n)).join(', ');return{ok:!msgs.length,txt:q.parts.filter((p,i)=>A.marked.has(i)).map(p=>de(p.n)).join(', ')||'nichts markiert',right,msgs};}
 /* draw */
 const d=q.d,msgs=[];let ok=true;
 if(q.pk.axis&&A.picks.axis!=='r'){ok=false;msgs.push(d.kind==='bar'?'Achsen vertauscht: Beim Balkendiagramm gehören die Namen an die senkrechte Achse und die Zahlen nach unten.':'Achsen vertauscht: Beim Säulendiagramm gehören die Zahlen an die Hochachse und die Namen nach unten.');}
 if(q.pk.step&&A.picks.step!==d.step){ok=false;const w=q.pk.step.wrong.find(x=>x[0]===A.picks.step);msgs.push(`Einteilung ${A.picks.step}: ${w?w[1]:''} Besser sind ${d.step}er-Schritte.`);}
 if(q.pk.title&&A.picks.title!=='r'){ok=false;msgs.push(`Die Überschrift soll das Thema nennen. Hier passt „${d.title}“.`);}
 const st=A.barsStep,v=A.bars||d.cats.map(()=>0),bad=[];
 d.vals.forEach((x,i)=>{if(!same(v[i],x)){bad.push(i);ok=false;}});
 if(!q.pk.step||A.picks.step===d.step){const done={};bad.forEach(i=>{if(done[i]||msgs.length>=4)return;const u=v[i],x=d.vals[i];const j=d.vals.findIndex((a,k)=>k!==i&&same(a,u)&&same(v[k],x));
  if(j>=0){done[j]=1;msgs.push(`${d.cats[i]} und ${d.cats[j]} sind vertauscht. Prüfe, zu welchem Namen jede Zahl gehört.`);}
  else if((q.dist||[]).some(z=>same(z,u)))msgs.push(`${de(u)} ist im Text nur eine Ablenkung. Für ${d.cats[i]} gilt ${de(x)}.`);
  else if(q.raw&&same(u,q.raw[i]))msgs.push(`Bei ${d.cats[i]} hast du nicht gerundet.`);
  else if(d.step>1&&same(u,x*d.step))msgs.push(`${d.cats[i]}: Du bist ${de(x)} Kästchen hoch gegangen. Ein Kästchen steht aber für ${d.step}. Der Wert ${de(x)} ist nur ${de(x/d.step)} Kästchen hoch.`);
  else if(d.step>1&&same(u/d.step,x/d.step/d.step))msgs.push(`${d.cats[i]}: Der Wert ${de(x)} liegt bei der Zahl ${de(x)} an der Achse.`);
  else if(same(Math.abs(u-x),d.step))msgs.push(`${d.cats[i]}: Du bist eine Linie zu ${u>x?'hoch':'tief'}. Du hast ${de(u)} gezeichnet, richtig ist ${de(x)}.`);
  else msgs.push(`${d.cats[i]}: Du hast ${de(u)} gezeichnet, richtig ist ${de(x)}.`);});}
 return{ok,bad,txt:(A.bars?d.cats.map((c,i)=>c+' '+de(v[i])).join(', '):'nichts gezeichnet'),right:d.cats.map((c,i)=>c+' '+de(d.vals[i])).join(', '),msgs,sameStep:st===d.step};}
function lock(q,g){A.done=true;const box=$('vTask');box.querySelectorAll('input').forEach(i=>i.disabled=true);
 if(q.type==='mc')box.querySelectorAll('.opts .opt').forEach(b=>{const i=+b.dataset.i;if(i===q.c)b.classList.add('good');else if(i===A.sel)b.classList.add('wrong');});
 if(q.type==='num')$('num').classList.add(g.ok?'good':'wrong');
 if(q.type==='fill')q.d.cats.forEach((_,i)=>{const e=$('f'+i),o=same(parseNum(e.value),q.ans[i]);e.classList.add(o?'good':'wrong');if(!o)e.insertAdjacentHTML('afterend',`<span class="fix">${de(q.ans[i])}</span>`);});
 if(q.type==='mark')box.querySelectorAll('.mk').forEach(b=>{const i=+b.dataset.m,p=q.parts[i];if(p.ok)b.classList.add('good');else if(A.marked.has(i))b.classList.add('wrong');b.disabled=true;});
 if(q.type==='draw'){box.querySelectorAll('.seg .opt').forEach(b=>{b.disabled=true;const k=b.parentNode.dataset.p,v=b.dataset.v,r=k==='step'?String(q.d.step):'r';const sel=b.getAttribute('aria-pressed')==='true';if(v===r)b.classList.add('good');else if(sel)b.classList.add('wrong');});
  const c=drawCfg(q);if(c&&A.bars&&!g.idk&&g.sameStep){c.title=q.d.title;$('plot').innerHTML=chart(c,{draw:A.bars,bad:g.bad,ghost:g.ok?[]:q.d.vals.map((v,i)=>g.bad.includes(i)?v:null),upL:(c.kind==='bar'?c.cl:c.vl),rightL:(c.kind==='bar'?c.vl:c.cl)});$('drawHelp').textContent=g.ok?'':'Rot: deine Zeichnung. Grün gestrichelt: so ist es richtig.';$('drawHelp').hidden=g.ok;}
  else{$('plot').innerHTML=chart(q.d);$('drawHelp').textContent='So sieht das richtige Diagramm aus.';$('drawHelp').hidden=false;}}
}
const RIGHT=['Richtig!','Genau!','Stark!','Sauber abgelesen!','Das sitzt!','Super gemacht!'];
function fbHtml(q,g){const sol=(q.sol||[]).filter(Boolean);return `<div class="fb ${g.ok?'y':'n'}"><b class="h">${g.ok?pick(RIGHT):g.idk?'So geht es:':'Noch nicht ganz.'}</b>${(g.msgs||[]).length?`<ul class="st3">${g.msgs.map(m=>`<li>${fmt(m)}</li>`).join('')}</ul>`:''}${!g.ok&&g.right&&q.type!=='draw'&&q.type!=='fill'?`<div>Richtige Antwort: <b>${esc(g.right)}</b></div>`:''}${sol.length&&!g.ok?`<div><b>So geht es richtig:</b></div><ol class="st3">${sol.map(s=>`<li>${fmt(s)}</li>`).join('')}</ol>`:''}${g.ok&&sol.length?`<div class="small">${fmt(sol[sol.length-1])}</div>`:''}</div>`;}

/* ---------- Stationen ---------- */
function nextCell(list){for(const t of list||TOPICS)for(const l of LVS){if(!passed(t.id,l))return [t.id,l];}return null;}
function cells(list,nx){return list.map(t=>`<div class="st"><div><h3>${esc(t.name)}</h3><div class="small muted">${esc(t.sub)}</div></div>${LVS.map(l=>{const c=P.cells[t.id+l],d=passed(t.id,l),n=nx&&nx[0]===t.id&&nx[1]===l;return `<button type="button" class="cell c-${l} ${d?'done':''} ${n?'next':''}" data-t="${t.id}" data-l="${l}" aria-label="${esc(t.name)}, ${LV[l]}${d?', geschafft':''}"><span><span class="nm">${LV[l]}<br></span><b>${c?c.best+'/'+SIZE:'Los'}</b></span></button>`;}).join('')}</div>`).join('');}
function badges(){const all=TOPICS.concat(TEXT);return `<div class="badges">${all.map(t=>{const top=[...LVS].reverse().find(l=>passed(t.id,l));return `<span class="badge ${top?'c-'+top+' on':''}" title="${esc(t.name)}">${top?'★':'☆'} ${esc(t.name)}</span>`;}).join('')}</div>`;}
function statusCard(){const n=doneAll(),nx=RANKS.find(r=>n<r[0]);return `<div class="card hud"><div><div class="big2">${P.stars}</div><div class="small muted">Sterne</div></div><div><div class="big2">${rank(n)}</div><div class="small muted">${nx?`Noch ${nx[0]-n} Stationen bis ${nx[1]}`:'Höchster Rang erreicht'}</div></div><div><div class="big2">${P.best}</div><div class="small muted">Beste Serie</div></div></div>`;}
function home(){
 const done=TOPICS.reduce((n,t)=>n+LVS.filter(l=>passed(t.id,l)).length,0),nx=nextCell();
 $('vHome').innerHTML=`<div class="card stack"><h1>Fit für Diagramme</h1>
  <p class="muted">Jede Station hat ${SIZE} Aufgaben mit neuen Daten. Ab ${PASS} richtigen ist sie geschafft. Die Farben sind dieselben wie im Buch. Bei einem Fehler zeigt dir die App genau, was nicht gestimmt hat.</p>
  <div class="total" role="img" aria-label="${done} von 18 Stationen geschafft"><div style="width:${done/18*100}%"></div></div>
  <div class="nextbar"><span class="small muted">${done} von 18 Stationen geschafft</span>${nx?`<button type="button" class="btn pri" id="go1">Weiter: ${esc(topic(nx[0]).name)} · ${LV[nx[1]]}</button>`:`<button type="button" class="btn pri" id="go2">Weiter zu den Textaufgaben</button>`}</div></div>
  ${statusCard()}
  <div class="card"><div class="gridhead"><span></span>${LVS.map(lvTag).join('')}</div>${cells(TOPICS,nx)}</div>
  <div class="card stack"><h2>Deine Abzeichen</h2><p class="small muted">Ein Stern für jedes Thema. Er bekommt die Farbe deiner höchsten Stufe.</p>${badges()}</div>
  <div class="card stack"><h2>Stand für IServ sichern</h2><div id="saveHome"></div></div>`;
 $('vHome').querySelectorAll('.cell').forEach(b=>b.onclick=()=>startSet(b.dataset.t,b.dataset.l));
 if(nx)$('go1').onclick=()=>startSet(nx[0],nx[1]);else $('go2').onclick=textHome;
 saveBox($('saveHome'));show('vHome','home');}
const isText=t=>TEXT.some(x=>x.id===t);
function buildSet(t,l,n){const pool=GEN.filter(g=>g.t===t&&g.l===l);let out=[];while(out.length<n)out=out.concat(shuffle(pool));out=out.slice(0,n);for(let i=1;i<n;i++)if(out[i].id===out[i-1].id){const j=out.findIndex((x,k)=>k>i&&x.id!==out[i].id&&(k+1>=n||out[k+1].id!==out[i-1].id));if(j>0){[out[i],out[j]]=[out[j],out[i]];}}return out.map(g=>Object.assign(g.make(),{gid:g.id,g,tp:t}));}
function startSet(t,l){S={mode:'set',t,l,tab:isText(t)?'text':'home',list:buildSet(t,l,SIZE),i:0,ok:0,wrong:[],run:0};setStep();}
function setStep(){const q=S.list[S.i],t=topic(S.t),N=S.list.length,fx=S.mode==='fix';
 render(q,`<div class="qhead"><b>${fx?'Fehler-Training: ':''}${esc(t.name)}</b>${lvTag(S.l)}</div><div class="row small muted"><span>Aufgabe ${S.i+1} von ${N}</span><span>· ${S.ok} richtig</span>${S.run>=2?`<span class="streak">${S.run} in Folge</span>`:''}</div><div class="pr"><div style="width:${S.i/N*100}%"></div></div>`,'c-'+S.l);
 $('acts').innerHTML=`<button type="button" class="btn pri" id="go">Prüfen</button><button type="button" class="btn sec" id="tip">Tipp</button><button type="button" class="btn ghost" id="idk">Zeig mir den Weg</button>`;
 $('go').onclick=()=>{if(!answered(q)){toast(q.type==='draw'?'Zeichne zuerst alle Werte und triff alle Auswahlen.':q.type==='mark'?'Tippe zuerst Zahlen im Text an.':'Trage zuerst deine Antwort ein.');return;}finishQ(q,grade(q));};
 $('tip').onclick=()=>{$('tipBox').innerHTML=`<div class="tip"><b>Tipp:</b> ${fmt(q.hint||'Lies die Aufgabe noch einmal langsam.')}</div>`;$('tip').hidden=true;};
 $('idk').onclick=()=>finishQ(q,{ok:false,idk:true,right:null,msgs:[]});
 show('vTask',S.tab);}
function finishQ(q,g){if(q.type==='mc'&&g.idk)g.right=q.ot?q.ot[q.c]:plain(q.o[q.c]);lock(q,g);
 if(g.ok){S.ok++;S.run++;P.stars++;if(S.run>P.best)P.best=S.run;}else{S.run=0;S.wrong.push(q.g);P.err[S.t]=(P.err[S.t]||0)+1;}store();
 $('tipBox').innerHTML='';$('fbBox').innerHTML=fbHtml(q,g);
 if(g.ok&&(S.run===3||S.run===5||S.run===8))toast(`${S.run} richtige in Folge!`);
 const last=S.i===S.list.length-1;$('acts').innerHTML=`<button type="button" class="btn pri" id="nx">${last?'Zum Ergebnis':'Nächste Aufgabe'}</button>`;
 $('nx').onclick=()=>{S.i++;if(last)setEnd();else setStep();};$('nx').focus({preventScroll:true});}
function setEnd(){const fx=S.mode==='fix',t=topic(S.t),k=S.t+S.l,back=S.tab==='text'?textHome:home;
 $('vRes').className='c-'+S.l;
 if(fx){const n=S.list.length;$('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>Fehler-Training: ${esc(t.name)}</b>${lvTag(S.l)}</div><div class="big">${S.ok} von ${n}</div><p>${S.ok===n?'Alle Fehler aufgeholt. Das ist echtes Lernen!':'Gut, dass du drangeblieben bist. Jeder neue Versuch festigt dein Wissen.'}</p><div class="row"><button type="button" class="btn pri" id="r1">Neue Runde dieser Station</button><button type="button" class="btn ghost" id="r3">Zur Übersicht</button></div></div>`;if(S.ok===n)confetti();const a=S.t,b=S.l;$('r1').onclick=()=>startSet(a,b);$('r3').onclick=back;show('vRes',S.tab);return;}
 const wasDone=passed(S.t,S.l),c=P.cells[k]||{best:0,runs:0};c.best=Math.max(c.best,S.ok);c.runs++;P.cells[k]=c;store();
 const pass=S.ok>=PASS,list=S.tab==='text'?TEXT:TOPICS,nx=nextCell(list),w=S.wrong.slice(),pg=t.page,uebung={o:17,p:18,l:19}[S.l];
 $('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>${esc(t.name)}</b>${lvTag(S.l)}</div><div class="big">${S.ok} von ${SIZE}</div>
  <p>${pass?(S.ok===SIZE?'Alles richtig. Diese Station sitzt.':'Station geschafft. Stark gemacht!'):`Noch nicht geschafft. Du brauchst ${PASS} richtige. Schau dir die Regel an und versuche es nochmal.`}</p>
  ${w.length?`<div class="tip"><b>Fehler-Training:</b> Übe genau die ${w.length===1?'Aufgabenart':w.length+' Aufgabenarten'}, die noch nicht geklappt ${w.length===1?'hat':'haben'}, mit neuen Daten.</div>`:''}
  <p class="small muted">Im Buch: Regel auf Seite ${pg}, weitere Übungen in deiner Farbe auf Seite ${uebung}.</p>
  <div class="row">${w.length?`<button type="button" class="btn pri" id="r5">Fehler-Training starten</button>`:''}<button type="button" class="btn ${pass||w.length?'sec':'pri'}" id="r1">Nochmal mit neuen Daten</button>${pass&&nx?`<button type="button" class="btn ${w.length?'sec':'pri'}" id="r2">Nächste Station</button>`:''}${pass?'':`<button type="button" class="btn sec" id="r4">Zum Merkzettel</button>`}<button type="button" class="btn ghost" id="r3">Zur Übersicht</button></div></div>`;
 const a=S.t,b=S.l;$('r1').onclick=()=>startSet(a,b);$('r3').onclick=back;if($('r2'))$('r2').onclick=()=>startSet(nx[0],nx[1]);if($('r4'))$('r4').onclick=memo;
 if($('r5'))$('r5').onclick=()=>{S={mode:'fix',t:a,l:b,tab:isText(a)?'text':'home',list:w.map(g=>Object.assign(g.make(),{g})),i:0,ok:0,wrong:[],run:0};setStep();};
 if(pass&&!wasDone)confetti();show('vRes',S.tab);}

/* ---------- Textaufgaben ---------- */
function textHome(){const done=TEXT.reduce((n,t)=>n+LVS.filter(l=>passed(t.id,l)).length,0),nx=nextCell(TEXT);
 $('vText').innerHTML=`<div class="card stack"><h1>Textdetektive</h1><p class="muted">Hier holst du die Daten selbst aus dem Text. Jede Runde hat ${SIZE} Aufgaben, ab ${PASS} richtigen ist die Station geschafft.</p>
  <div class="total" role="img" aria-label="${done} von 12 Stationen geschafft"><div style="width:${done/12*100}%"></div></div>
  <div class="nextbar"><span class="small muted">${done} von 12 Stationen geschafft</span>${nx?`<button type="button" class="btn pri" id="tg">Weiter: ${esc(topic(nx[0]).name)} · ${LV[nx[1]]}</button>`:''}</div></div>
  <div class="card stack"><h2>So wird aus einem Text ein Diagramm</h2><ol class="st3"><li><b>Thema finden.</b> Worum geht es? Das wird die Überschrift.</li><li><b>Zahlen herausholen.</b> Welche Zahl gehört zu welchem Namen?</li><li><b>Ablenkung streichen.</b> Zeit, Raum und Datum gehören meist nicht dazu.</li><li><b>Achsen planen.</b> Finde den größten Wert und wähle eine gleichmäßige Einteilung.</li><li><b>Zeichnen und prüfen.</b> Vergleiche am Ende jede Säule mit dem Text.</li></ol></div>
  <div class="card"><div class="gridhead"><span></span>${LVS.map(lvTag).join('')}</div>${cells(TEXT,nx)}</div>`;
 $('vText').querySelectorAll('.cell').forEach(b=>b.onclick=()=>startSet(b.dataset.t,b.dataset.l));if(nx)$('tg').onclick=()=>startSet(nx[0],nx[1]);show('vText','text');}

/* ---------- Experten ---------- */
function buildExpert(l){const ts=['typ','achse','wert','bild','liste','zeich','td','tc'];return shuffle(ts.map(t=>{const g=pick(GEN.filter(x=>x.t===t&&x.l===l));return Object.assign(g.make(),{tp:t});}));}
function examStart(){
 $('vExam').innerHTML=`<div class="card stack"><h1>Experten-Modus</h1><p>Das ist die Probe für die nächste Klassenarbeit: 8 gemischte Aufgaben aus allen Stationen, ohne Tipps. Erst am Ende siehst du alle Lösungen. Ab 6 richtigen bist du Experte oder Expertin in dieser Farbe.</p><h2>Welche Farbe nimmst du?</h2>
  <div class="row">${LVS.map(l=>`<button type="button" class="cell c-${l}" style="min-width:104px;padding-inline:14px" data-l="${l}"><b>${LV[l]}</b></button>`).join('')}</div></div>
  ${P.kl.length?`<div class="card stack"><h2>Deine letzten Runden</h2>${P.kl.slice(-4).reverse().map(k=>`<div class="tr"><span>${esc(k.d)} · ${LV[k.l]}</span><div class="bar"><div style="width:${k.p/k.m*100}%"></div></div><span class="muted">${k.p}/${k.m}</span></div>`).join('')}</div>`:''}`;
 $('vExam').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{S={mode:'kl',l:b.dataset.l,list:buildExpert(b.dataset.l),i:0,res:[]};klStep();});show('vExam','exam');}
function klStep(){const q=S.list[S.i],n=S.list.length;
 render(q,`<div class="qhead"><b>Experten-Aufgabe ${S.i+1} von ${n}</b>${lvTag(S.l)}</div><div class="pr"><div style="width:${S.i/n*100}%"></div></div>`,'c-'+S.l);
 $('acts').innerHTML=`<button type="button" class="btn pri" id="go">${S.i===n-1?'Abgeben':'Weiter'}</button>`;
 $('go').onclick=()=>{if(!answered(q)&&!S.warn){S.warn=true;toast('Noch nicht fertig. Tippe nochmal, um ohne Antwort weiterzugehen.');return;}S.warn=false;let g;if(!answered(q)){g={ok:false,txt:'keine vollständige Antwort',right:rightOf(q),msgs:[]};}else g=grade(q);S.res.push(g);S.i++;if(S.i<n)klStep();else klEnd();};show('vTask','exam');}
function rightOf(q){if(q.type==='mc')return q.ot?q.ot[q.c]:plain(q.o[q.c]);if(q.type==='num')return de(q.ans);if(q.type==='mark')return q.parts.filter(p=>p.ok).map(p=>de(p.n)).join(', ');const d=q.d;return d.cats.map((c,i)=>c+' '+de((q.ans||d.vals)[i])).join(', ');}
function klEnd(){const ok=S.res.filter(r=>r.ok).length,n=S.list.length,d=new Date(),ds=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
 P.kl.push({d:ds,l:S.l,p:ok,m:n});P.kl=P.kl.slice(-12);S.list.forEach((q,i)=>{if(!S.res[i].ok)P.err[q.tp]=(P.err[q.tp]||0)+1;});P.stars+=ok;store();
 const pass=ok>=6,msg=pass?`Stark! Du bist Experte oder Expertin in ${LV[S.l]}.`+(S.l==='l'?'':' Traust du dich an die nächste Farbe?'):ok>=4?'Fast geschafft. Schau dir die Lösungen an und versuche es nochmal.':'Diese Runde war schwer. Übe zuerst die Stationen und komm dann wieder.';
 $('vRes').className='c-'+S.l;
 $('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>Experten-Modus</b>${lvTag(S.l)}</div><div class="big">${ok} von ${n} richtig</div><p>${msg}</p><div class="row"><button type="button" class="btn pri" id="k1">Neue Expertenrunde</button><button type="button" class="btn sec" id="k3">Zu den Stationen</button></div></div>
 <div class="card"><h2>Alle Aufgaben mit Lösung</h2>${S.list.map((q,i)=>{const r=S.res[i];return `<div class="rv"><div class="mk2 ${r.ok?'y':'n'}">Aufgabe ${i+1}: ${r.ok?'richtig':'noch nicht richtig'}</div><div>${fmt(q.q)}</div><div class="small">Deine Antwort: ${esc(plain(r.txt))}</div>${r.ok?'':`<div class="small">Richtig: <b>${esc(r.right||rightOf(q))}</b></div>${(r.msgs||[]).map(m=>`<div class="small">${fmt(m)}</div>`).join('')}${(q.sol||[]).filter(Boolean).length?`<ol class="st3 small">${q.sol.filter(Boolean).map(s=>`<li>${fmt(s)}</li>`).join('')}</ol>`:''}`}</div>`;}).join('')}</div>
 <div class="card stack"><h2>Ergebnis für IServ sichern</h2><div id="saveRes"></div></div>`;
 if(pass)confetti();$('k1').onclick=examStart;$('k3').onclick=home;saveBox($('saveRes'));show('vRes','exam');}

/* ---------- Sichern ---------- */
function report(){const d=new Date(),pad=n=>String(n).padStart(2,'0'),ds=pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
 let t='FIT FÜR DIAGRAMME – Stand\n=========================\nName:   '+P.name+'\nKlasse: '+P.kl_+'\nDatum:  '+ds+'\nSterne: '+P.stars+'\n\nStationen (beste Runde von '+SIZE+'):\n';
 TOPICS.concat(TEXT).forEach(x=>{t+='  '+x.name+': '+LVS.map(l=>LV[l]+' '+((P.cells[x.id+l]||{}).best!=null?P.cells[x.id+l].best:'–')).join(', ')+'\n';});
 t+='\nFehler je Thema:\n';TOPICS.concat(TEXT).forEach(x=>{if(P.err[x.id])t+='  '+x.name+': '+P.err[x.id]+'\n';});
 t+='\nExperten-Modus:\n';if(!P.kl.length)t+='  noch keine Runde\n';P.kl.forEach(k=>t+='  '+k.d+' '+LV[k.l]+': '+k.p+' von '+k.m+' richtig\n');
 return t+'\n#DATEN '+JSON.stringify({app:'mathe5-diagramme',v:1,name:P.name,kl:P.kl_,datum:ds,stationen:P.cells,fehler:P.err,experten:P.kl})+'\n';}
function saveBox(el){const top=window.self===window.top;
 el.innerHTML=`<div class="stack"><div class="fields"><label class="f">Dein Vorname<input id="sN" maxlength="30" value="${esc(P.name)}" autocomplete="given-name"></label><label class="f">Deine Klasse<input id="sK" maxlength="8" value="${esc(P.kl_)}" placeholder="z. B. 5c"></label></div>
 <div class="row">${top?'<button type="button" class="btn sec" id="sD">Datei speichern</button>':''}<button type="button" class="btn sec" id="sC">Ergebnis kopieren</button></div><p class="small muted">${top?'Lade die Datei in IServ hoch oder füge den kopierten Text dort ein.':'Füge den kopierten Text in IServ ein.'}</p></div>`;
 const up=()=>{P.name=$('sN').value.trim();P.kl_=$('sK').value.trim();store();return P.name&&P.kl_;};$('sN').oninput=up;$('sK').oninput=up;
 $('sC').onclick=()=>{if(!up()){toast('Trage zuerst Vorname und Klasse ein.');return;}const t=report(),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();toast(ok?'Kopiert. Füge es jetzt in IServ ein.':'Kopieren hat nicht geklappt.');};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Kopiert. Füge es jetzt in IServ ein.'),fb);else fb();};
 if(top)$('sD').onclick=()=>{if(!up()){toast('Trage zuerst Vorname und Klasse ein.');return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));a.download=('Diagramme_'+P.kl_+'_'+P.name).replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.txt';a.click();};}

/* ---------- Merkzettel ---------- */
function memo(){const ex={kind:'col',title:'Lieblingsobst in Klasse 5x',cats:['Äpfel','Trauben','Kirschen'],vals:[6,3,4],step:1,top:7,lab:1,vl:'Anzahl',cl:'Obst',u:'Kinder'},ex2={kind:'col',title:'Verkaufte Waffeln',cats:['Mo','Di','Mi','Do'],vals:[20,35,15,30],step:5,top:40,lab:2,vl:'Waffeln',cl:'Tag',u:'Waffeln'};
 $('vMemo').className='';
 $('vMemo').innerHTML=`<div class="card stack"><h1>Merkzettel</h1><p class="muted">Das Wichtigste auf einen Blick. Im Buch findest du die Regeln auf Seite 16 und die Zusammenfassung auf Seite 30. Die Strichliste steht auf Seite 12.</p></div>
 <div class="card stack"><h2>Die drei Diagrammtypen</h2><div class="three"><div><h3>Säulendiagramm</h3>${chart(ex)}<p class="small">Die Säulen stehen senkrecht.</p></div><div><h3>Balkendiagramm</h3>${chart(mixChart(ex,'bar'))}<p class="small">Die Balken liegen waagerecht.</p></div><div><h3>Bilddiagramm</h3>${pic(Object.assign({},ex,{per:1}))}<p class="small">Auch Piktogramm genannt. Die Erklärung sagt, was ein Bild zählt.</p></div></div></div>
 <div class="two"><div class="card stack m-p"><h2>Säulendiagramm zeichnen</h2><ol class="st3"><li><b>Achsen festlegen:</b> Die Anzahl steht meist an der Hochachse.</li><li><b>Größten Wert suchen</b> und eine gleichmäßige Einteilung wählen.</li><li><b>Breite planen:</b> Wie viele Säulen? Wie breit? Wie viel Platz dazwischen?</li><li><b>Säulen einzeichnen</b> und beschriften.</li><li><b>Überschrift</b> dazuschreiben.</li></ol></div>
 <div class="card stack m-p"><h2>Kästchen sind nicht immer 1</h2>${chart(ex2)}<p>Hier steht <b>ein Kästchen für 5</b>. Nur jede zweite Linie hat eine Zahl. Die Säule für Dienstag ist 7 Kästchen hoch: 7 · 5 = 35.</p></div></div>
 <div class="two"><div class="card stack m-p"><h2>Strichliste und Tabelle</h2><p>In der <b>Strichliste</b> fasst du Antworten zusammen. Jeder fünfte Strich geht schräg durch die vier anderen:</p><div class="tallybox">${tally(5)} ${tally(8)}</div><p>In der <b>Häufigkeitstabelle</b> steht die Zahl dazu: 5 und 8.</p></div>
 <div class="card stack m-p"><h2>Runden vor dem Zeichnen</h2><p>Große Zahlen rundest du zuerst.</p><ol class="st3"><li>Rundungsstelle finden.</li><li>Die Ziffer rechts daneben ansehen.</li><li><b>0 bis 4:</b> abrunden. <b>5 bis 9:</b> aufrunden.</li></ol><p>2 638 auf Hunderter: 2 638 ≈ 2 600 (Ziffer 3).</p></div></div>
 <div class="card stack"><h2>Typische Fehler</h2><ul class="st3"><li><b>Kästchen zählen.</b> Schau zuerst auf die Zahlen an der Achse: Wie viel ist ein Kästchen wert?</li><li><b>Achsen vertauscht.</b> Säulen: Zahlen links. Balken: Zahlen unten.</li><li><b>Ungleiche Einteilung.</b> Von Linie zu Linie kommt immer gleich viel dazu.</li><li><b>Falsche Zahl aus dem Text.</b> Datum, Uhrzeit und Raumnummer gehören nicht ins Diagramm.</li><li><b>Überschrift vergessen.</b> Ohne Überschrift weiß niemand, worum es geht.</li><li><b>Erklärung übersehen.</b> Beim Bilddiagramm zählt ein Bild oft mehr als 1.</li></ul></div>`;
 show('vMemo','memo');}
home();
</script>
</body></html>
