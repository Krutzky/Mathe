<script>
/* ---------- Hilfen ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const r6=x=>Math.round(x*1e6)/1e6;
function de(x,d){const r=r6(x);let s=d==null?String(r):r.toFixed(d);return s.replace('.',',');}
const eur=x=>{const r=r6(x);return (Number.isInteger(r)?String(r):r.toFixed(2).replace('.',','))+' €';};
const NAMES=['Emir','Lina','Aylin','Jonas','Mia','Noah','Zeynep','Ben','Lea','Yusuf','Amira','Tom'];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a*b/gcd(a,b);
const LV={o:'Orange',p:'Pink',l:'Lila'};
const LVS=['o','p','l'];
const TOPICS=[
 {id:'erk',name:'Zuordnungen erkennen',sub:'proportional, antiproportional oder keins von beiden'},
 {id:'prop',name:'Proportional',sub:'Tabellen, Faktor und Gerade'},
 {id:'dp',name:'Dreisatz proportional',sub:'mehr → mehr'},
 {id:'anti',name:'Antiproportional',sub:'Tabellen, Produkt und Hyperbel'},
 {id:'da',name:'Dreisatz antiproportional',sub:'mehr → weniger'},
 {id:'mix',name:'Erst entscheiden, dann rechnen',sub:'Textaufgaben gemischt, wie im Abschlusstest'}
];
const GEN=[];
function gen(t,l,id,make){GEN.push({t,l,id,make});}
const SET_MSG_P='Du hast antiproportional gerechnet. Hier gilt aber: Mehr davon kostet auch mehr. Also rechnest du links und rechts dasselbe.';
const SET_MSG_A='Du hast proportional gerechnet. Hier gilt aber: Je mehr, desto weniger Zeit. Also rechnest du rechts das Gegenteil von links.';
const KINDS=[['Proportional','p'],['Antiproportional','a'],['Keins von beiden','k']];
function kindQ(q,kind,sol,extra){return Object.assign({type:'mc',q,fix:true,o:KINDS.map(k=>k[0]),c:KINDS.findIndex(k=>k[1]===kind),sol},extra||{});}

/* ---------- Sachsituationen ---------- */
/* proportional: an=Anzahl, u=Einheit, f=Text, h=Tabellenköpfe, unit=Ergebnis-Einheit */
const CP=[
 {u:[2,3,4],h:['Anzahl Hefte','Preis (in €)'],unit:'€',f:(a,b,c)=>`${a} Hefte kosten ${eur(b)}. Wie viel kosten ${c} Hefte?`},
 {u:[8,9,10,11],h:['Anzahl Kinokarten','Preis (in €)'],unit:'€',f:(a,b,c)=>`${a} Kinokarten kosten ${eur(b)}. Wie teuer sind ${c} Karten?`},
 {u:[3,4,5,6],h:['Äpfel (in kg)','Preis (in €)'],unit:'€',f:(a,b,c)=>`${a} kg Äpfel kosten ${eur(b)}. Wie viel kosten ${c} kg?`},
 {u:[7,8,9],h:['Anzahl Pizzen','Preis (in €)'],unit:'€',f:(a,b,c)=>`${a} Pizzen kosten ${eur(b)}. Wie viel kosten ${c} Pizzen?`},
 {u:[12,15,16,18],h:['Zeit (in h)','Strecke (in km)'],unit:'km',f:(a,b,c)=>{const n=pick(NAMES);return `${n} fährt mit dem Rad gleichmäßig und schafft in ${a} Stunden ${b} km. Wie weit kommt ${n} in ${c} Stunden?`;}},
 {u:[5,6,8],h:['Anzahl Packungen','Anzahl Kekse'],unit:'Kekse',uf:(u)=>u*5,f:(a,b,c)=>`In ${a} gleichen Packungen sind ${b} Kekse. Wie viele Kekse sind in ${c} Packungen?`}
];
/* antiproportional */
const CA=[
 {h:['Anzahl Bagger','Zeit (in h)'],unit:'h',f:(a,b,c)=>`${a} Bagger brauchen ${b} Stunden für eine Baugrube. Wie lange brauchen ${c} Bagger?`},
 {h:['Anzahl Pumpen','Zeit (in h)'],unit:'h',f:(a,b,c)=>`${a} Pumpen leeren einen Teich in ${b} Stunden. Wie lange brauchen ${c} Pumpen?`},
 {h:['Anzahl Lkw','Anzahl Fahrten'],unit:'Fahrten',f:(a,b,c)=>`${a} Lkw müssen je ${b}-mal fahren, um den Sand zu liefern. Wie oft muss jeder fahren, wenn es ${c} Lkw sind?`},
 {h:['Anzahl Kinder','Zeit (in min)'],unit:'min',f:(a,b,c)=>`${a} Kinder räumen den Klassenraum in ${b} Minuten auf. Wie lange brauchen ${c} Kinder?`},
 {h:['Anzahl Maler','Zeit (in Tagen)'],unit:'Tage',f:(a,b,c)=>`${a} Maler streichen ein Haus in ${b} Tagen. Wie lange brauchen ${c} Maler?`},
 {h:['Anzahl Gewinner','Gewinn pro Person (in €)'],unit:'€',f:(a,b,c)=>`Eine Tippgemeinschaft teilt den Gewinn gerecht. Bei ${a} Personen bekommt jede ${eur(b)}. Wie viel bekommt jede bei ${c} Personen?`}
];
function propNums(c){const u=pick(c.u);let a,d;do{a=ri(2,6);d=ri(2,9);}while(a===d);const v=c.uf?u*5:u;return{a,b:a*v,c:d,ans:d*v,v};}
function antiNums(big){let a,c;do{a=ri(2,big?8:6);c=ri(2,big?10:6);}while(a===c);const k=lcm(a,c)*pick(big?[2,3,4]:[1,2,3]);return{a,b:k/a,c,ans:k/c,k};}
function solP(n,h){return [`${n.a} → ${n.b} : ${n.a} = ${de(n.b/n.a)} für **1**`,`${n.c} → ${de(n.b/n.a)} · ${n.c} = **${de(n.ans)}**`];}
function solA(n){return [`Für **1**: ${n.b} · ${n.a} = ${n.k}`,`Für ${n.c}: ${n.k} : ${n.c} = **${de(n.ans)}**`];}
function dsTable(n,anti,showOps,h){return {head:h,rows:[[n.a,n.b],[1,{a:anti?n.k:n.b/n.a}],[n.c,{a:n.ans}]],l:showOps?[':'+n.a,'·'+n.c]:null,r:showOps?(anti?['·'+n.a,':'+n.c]:[':'+n.a,'·'+n.c]):null};}

/* ---------- Situationen zum Einordnen: Text, Art, Begründung ---------- */
const SIT={
 o:[['Anzahl der Brötchen → Preis','p','Doppelt so viele Brötchen kosten doppelt so viel.'],
    ['Anzahl der Helfer → Zeit zum Aufräumen','a','Doppelt so viele Helfer brauchen nur die halbe Zeit.'],
    ['Alter eines Kindes → Körpergröße','k','Mit doppeltem Alter ist man nicht doppelt so groß.'],
    ['Liter Benzin → Preis an der Tankstelle','p','Doppelt so viele Liter kosten doppelt so viel.'],
    ['Anzahl der Pumpen → Zeit, bis das Becken leer ist','a','Doppelt so viele Pumpen brauchen die halbe Zeit.'],
    ['Anzahl der Kugeln Eis → Preis','p','Jede Kugel kostet gleich viel, also doppelte Anzahl, doppelter Preis.'],
    ['Schuhgröße → Note in der Mathearbeit','k','Die beiden Größen haben nichts miteinander zu tun.']],
 p:[['Wassermenge → Gewicht des Wassers','p','Doppelt so viel Wasser wiegt doppelt so viel.'],
    ['Geschwindigkeit → Fahrzeit für dieselbe Strecke','a','Bei doppelter Geschwindigkeit braucht man die halbe Zeit.'],
    ['Anzahl der Personen → Gewinn pro Person bei gleichem Lottogewinn','a','Doppelt so viele Personen bekommen je die Hälfte.'],
    ['Fahrzeit → Strecke bei gleichbleibendem Tempo','p','In doppelter Zeit schafft man die doppelte Strecke.'],
    ['Tageszeit → Temperatur draußen','k','Die Temperatur folgt keiner festen Regel zur Uhrzeit.'],
    ['Anzahl der Tiere → Tage, die das Futter reicht','a','Doppelt so viele Tiere fressen den Vorrat in der halben Zeit.'],
    ['Handy-Alter in Jahren → Akkulaufzeit','k','Der Akku wird schwächer, aber nicht nach einer festen Regel.']],
 l:[['Seitenlänge eines Quadrats → Umfang','p','Der Umfang ist 4 · Seitenlänge. Doppelte Seite, doppelter Umfang.'],
    ['Seitenlänge eines Quadrats → Flächeninhalt','k','Bei doppelter Seite wird die Fläche viermal so groß, nicht doppelt.'],
    ['Anzahl gleich großer Kreisteile → Winkelgröße eines Teils','a','Doppelt so viele Teile sind nur halb so breit, denn alle zusammen ergeben 360°.'],
    ['Taxifahrt mit Grundgebühr: gefahrene Kilometer → Preis','k','Wegen der Grundgebühr kostet die doppelte Strecke nicht das Doppelte.'],
    ['Rechteck mit 20 cm² Fläche: Seite a → Seite b','a','a · b bleibt immer 20. Das Produkt ist gleich.'],
    ['Höhe eines Baumes → Anzahl seiner Blätter','k','Ein doppelt so hoher Baum hat nicht genau doppelt so viele Blätter.'],
    ['Streaming-Abo mit festem Monatspreis: Monate → Kosten','p','Jeder Monat kostet gleich viel, und ohne Monat zahlt man nichts.'],
    ['Handytarif mit Grundpreis plus Preis pro GB: GB → Rechnung','k','Der Grundpreis bleibt gleich. Darum verdoppelt sich die Rechnung nicht.']]
};
function sitQ(l){const s=pick(SIT[l]);return kindQ(`Wie hängen diese beiden Größen zusammen?<br>**${s[0]}**`,s[1],[s[2]],{hint:'Stell dir vor, die erste Größe verdoppelt sich. Was passiert dann mit der zweiten?'});}

function tabKind(xs,kind){
 if(kind==='p'){const k=ri(2,9);return{ys:xs.map(x=>x*k),k};}
 if(kind==='a'){const m=xs.reduce(lcm,1);const k=m*pick(m>=12?[1,2,3]:[2,3,4,5]);return{ys:xs.map(x=>k/x),k};}

function graph(c,o){o=o||{};const W=330,H=270,L=38,R=12,T=24,B=40,pw=W-L-R,ph=H-T-B;
 const X=x=>L+x/c.xmax*pw,Y=y=>T+ph-y/c.ymax*ph;let s=`<svg class="g" viewBox="0 0 ${W} ${H}" role="img" aria-label="Koordinatensystem: ${esc(c.xl||'x')} nach rechts, ${esc(c.yl||'y')} nach oben">`;
 for(let x=c.xs;x<=c.xmax+1e-9;x+=c.xs)s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${T+ph}"/><text x="${X(x)}" y="${T+ph+15}" text-anchor="middle">${de(x)}</text>`;
 for(let y=c.ys;y<=c.ymax+1e-9;y+=c.ys)s+=`<line class="gl" x1="${L}" x2="${L+pw}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end">${de(y)}</text>`;
 s+=`<line class="ax" x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}"/><line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}"/><text x="${L-6}" y="${T+ph+15}" text-anchor="end">0</text>`;
 s+=`<text class="lb" x="${L}" y="13">${esc(c.yl||'y')}</text><text class="lb" x="${L+pw}" y="${H-6}" text-anchor="end">${esc(c.xl||'x')}</text>`;
 if(c.lin){const[m,b]=c.lin,xe=Math.min(c.xmax,(c.ymax-b)/m);s+=`<line class="cv" x1="${X(0)}" y1="${Y(b)}" x2="${X(xe)}" y2="${Y(m*xe+b)}"/>`;}
 if(c.hyp){const a=Math.max(c.hyp/c.ymax,c.xmax/200);let d='';for(let i=0;i<=80;i++){const x=a+(c.xmax-a)*i/80;d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(c.hyp/x).toFixed(1);}s+=`<path class="cv" d="${d}"/>`;}
 (c.mark||[]).forEach(p=>s+=`<circle class="pt mk" cx="${X(p[0])}" cy="${Y(p[1])}" r="5"/>`);

 const x=Math.round((p.x-L)/pw*c.xmax/c.xs)*c.xs,y=Math.round((T+ph-p.y)/ph*c.ymax/c.ys)*c.ys;
 return x>0&&y>0&&x<=c.xmax&&y<=c.ymax?[x,y]:null;}

function grade(q){
 if(q.type==='mc'){const ok=A.sel===q.c;return{ok,p:ok?1:0,m:1,txt:A.sel==null?'keine Antwort':q.o[A.sel],right:q.o[q.c]};}
 if(q.type==='num'){const raw=$('num').value,v=parseNum(raw),ok=same(v,q.ans);const t=(q.trap||[]).find(t=>same(t[0],v));return{ok,p:ok?1:0,m:1,txt:raw.trim()||'keine Antwort',right:de(q.ans)+(q.unit?' '+q.unit:''),trap:!ok&&t?t[1]:null};}
 if(q.type==='decide'){const v=parseNum($('num').value),k=A.kind===q.kind,n=same(v,q.ans);return{ok:k&&n,p:(k?1:0)+(n?1:0),m:2,txt:(A.kind?(A.kind==='p'?'proportional':'antiproportional'):'keine Entscheidung')+', '+($('num').value.trim()||'keine Zahl'),right:(q.kind==='p'?'proportional':'antiproportional')+', '+de(q.ans)+(q.unit?' '+q.unit:''),trap:k?null:'Prüfe erst die Art der Zuordnung: Was passiert, wenn du die erste Größe verdoppelst?'};}
 if(q.type==='table'){const b=blanks(q);let p=0;b.forEach(x=>{if(same(parseNum($(x.id).value),x.a))p++;});return{ok:p===b.length,p,m:b.length,txt:b.map(x=>$(x.id).value.trim()||'–').join(' · '),right:b.map(x=>de(x.a)).join(' · ')};}
 const hit=q.pts.filter(p=>A.pts.some(a=>same(a[0],p[0])&&same(a[1],p[1]))).length,extra=A.pts.length-hit,p=Math.max(0,hit-extra);return{ok:hit===q.pts.length&&!extra,p,m:q.pts.length,txt:A.pts.map(a=>`(${de(a[0])}|${de(a[1])})`).join(' · ')||'keine Punkte',right:q.pts.map(a=>`(${de(a[0])}|${de(a[1])})`).join(' · ')};}
function lock(q,g){A.done=true;const box=$('vTask');
 box.querySelectorAll('input').forEach(i=>i.disabled=true);
 if(q.type==='mc')box.querySelectorAll('.opts .opt').forEach(b=>{const i=+b.dataset.i;if(i===q.c)b.classList.add('good');else if(i===A.sel)b.classList.add('wrong');});
 if(q.type==='num'||q.type==='decide')$('num').classList.add(same(parseNum($('num').value),q.ans)?'good':'wrong');
 if(q.type==='decide')box.querySelectorAll('#seg .opt').forEach(b=>{if(b.dataset.k===q.kind)b.classList.add('good');else if(b.dataset.k===A.kind)b.classList.add('wrong');});
 if(q.type==='table')blanks(q).forEach(b=>{const i=$(b.id),o=same(parseNum(i.value),b.a);i.classList.add(o?'good':'wrong');if(!o)i.insertAdjacentHTML('afterend',`<span class="fix">${de(b.a)}</span>`);});
 if(q.type==='plot'){const pts=A.pts.map(a=>[a[0],a[1],q.pts.some(p=>same(a[0],p[0])&&same(a[1],p[1]))?'ok':'no']);q.pts.forEach(p=>{if(!A.pts.some(a=>same(a[0],p[0])&&same(a[1],p[1])))pts.push([p[0],p[1],'ok']);});$('plot').innerHTML=graph(q.grid,{pts});}
}

/* ---------- Stationen ---------- */
function nextCell(){for(const t of TOPICS)for(const l of LVS){const c=P.cells[t.id+l];if(!c||c.best<PASS)return [t.id,l];}return null;}
function home(){
 const done=TOPICS.reduce((n,t)=>n+LVS.filter(l=>(P.cells[t.id+l]||{}).best>=PASS).length,0),nx=nextCell();
 $('vHome').innerHTML=`<div class="card stack">
   <h1>Fit für die Klassenarbeit</h1>
   <p class="muted">Jede Station hat ${SIZE} Aufgaben mit neuen Zahlen. Ab ${PASS} richtigen ist sie geschafft. Die Farben sind dieselben wie im Buch.</p>
   <div class="total" role="img" aria-label="${done} von 18 Stationen geschafft"><div style="width:${done/18*100}%"></div></div>
   <div class="nextbar"><span class="small muted">${done} von 18 Stationen geschafft</span>${nx?`<button type="button" class="btn pri" id="go1">Weiter: ${esc(topic(nx[0]).name)} · ${LV[nx[1]]}</button>`:`<button type="button" class="btn pri" id="go2">Alles geschafft. Jetzt die Probeklausur!</button>`}</div>
  </div>
  <div class="card">
   <div class="gridhead"><span></span>${LVS.map(lvTag).join('')}</div>
   ${TOPICS.map(t=>`<div class="st"><div><h3>${esc(t.name)}</h3><div class="small muted">${esc(t.sub)}</div></div>${LVS.map(l=>{const c=P.cells[t.id+l],d=c&&c.best>=PASS,n=nx&&nx[0]===t.id&&nx[1]===l;return `<button type="button" class="cell c-${l} ${d?'done':''} ${n?'next':''}" data-t="${t.id}" data-l="${l}" aria-label="${esc(t.name)}, ${LV[l]}${c?', beste Runde '+c.best+' von '+SIZE:''}"><span><span class="nm">${LV[l]}</span><br class="nm"><b>${c?c.best+'/'+SIZE:'Start'}</b></span></button>`;}).join('')}</div>`).join('')}
  </div>
  <div class="card stack"><h2>Stand für IServ sichern</h2><div id="saveHome"></div></div>`;
 $('vHome').querySelectorAll('.cell').forEach(b=>b.onclick=()=>startSet(b.dataset.t,b.dataset.l));
 if(nx)$('go1').onclick=()=>startSet(nx[0],nx[1]);else $('go2').onclick=examStart;
 saveBox($('saveHome'));show('vHome','home');}
function startSet(t,l){S={mode:'set',t,l,list:buildSet(t,l,SIZE),i:0,ok:0,wrong:[]};setStep();}
function setStep(){const q=S.list[S.i],t=topic(S.t);
 render(q,`<div class="qhead"><b>${esc(t.name)}</b>${lvTag(S.l)}</div><div class="row small muted"><span>Aufgabe ${S.i+1} von ${SIZE}</span><span>· ${S.ok} richtig</span></div><div class="pr"><div style="width:${S.i/SIZE*100}%"></div></div>`,'c-'+S.l);
 $('acts').innerHTML=`<button type="button" class="btn pri" id="go">Prüfen</button><button type="button" class="btn sec" id="tip">Tipp</button><button type="button" class="btn ghost" id="idk">Zeig mir den Weg</button>`;
 $('go').onclick=()=>{if(!answered(q)){toast(q.type==='plot'?'Setze zuerst deine Punkte.':'Trage zuerst deine Antwort ein.');return;}finishQ(q,grade(q));};
 $('tip').onclick=()=>{$('tipBox').innerHTML=`<div class="tip"><b>Tipp:</b> ${fmt(q.hint||'Rechne zuerst den Wert für 1 aus.')}</div>`;$('tip').hidden=true;};
 $('idk').onclick=()=>finishQ(q,{ok:false,idk:true});
 show('vTask','home');}
function finishQ(q,g){lock(q,g);if(g.ok)S.ok++;
 $('tipBox').innerHTML='';
 $('fbBox').innerHTML=`<div class="fb ${g.ok?'y':'n'}"><b class="h">${g.ok?'Richtig!':g.idk?'So geht es:':'Noch nicht ganz.'}</b>${g.trap?`<div>${esc(g.trap)}</div>`:''}${!g.ok&&g.right&&q.type!=='table'&&q.type!=='plot'?`<div>Richtige Antwort: <b>${fmt(g.right)}</b></div>`:''}${q.type==='num'||q.type==='decide'||q.type==='mc'||!g.ok||q.ds?`<ol>${q.sol.map(s=>`<li>${fmt(s)}</li>`).join('')}</ol>`:''}</div>`;
 const last=S.i===SIZE-1;$('acts').innerHTML=`<button type="button" class="btn pri" id="nx">${last?'Zum Ergebnis':'Nächste Aufgabe'}</button>`;
 $('nx').onclick=()=>{S.i++;if(last)setEnd();else setStep();};$('nx').focus({preventScroll:true});}
function setEnd(){const k=S.t+S.l,c=P.cells[k]||{best:0,runs:0};c.best=Math.max(c.best,S.ok);c.runs++;P.cells[k]=c;store();
 const pass=S.ok>=PASS,t=topic(S.t),nx=nextCell();
 $('vRes').className='c-'+S.l;
 $('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>${esc(t.name)}</b>${lvTag(S.l)}</div>
  <div class="big">${S.ok} von ${SIZE}</div>
  <p>${pass?(S.ok===SIZE?'Alles richtig. Diese Station sitzt.':'Station geschafft. Stark gemacht!'):'Noch nicht geschafft. Du brauchst '+PASS+' richtige. Schau dir den Merkzettel an und versuche es mit neuen Zahlen.'}</p>
  <div class="row"><button type="button" class="btn ${pass?'sec':'pri'}" id="r1">Nochmal mit neuen Zahlen</button>${pass&&nx?`<button type="button" class="btn pri" id="r2">Nächste Station</button>`:''}${pass?'':`<button type="button" class="btn sec" id="r4">Zum Merkzettel</button>`}<button type="button" class="btn ghost" id="r3">Zur Übersicht</button></div></div>`;
 $('r1').onclick=()=>startSet(S.t,S.l);$('r3').onclick=home;if($('r2'))$('r2').onclick=()=>startSet(nx[0],nx[1]);if($('r4'))$('r4').onclick=memo;show('vRes','home');}

/* ---------- Probeklausur ---------- */
function examStart(){
 $('vExam').className='';
 $('vExam').innerHTML=`<div class="card stack"><h1>Probeklausur</h1><p>Hier übst du wie in der echten Arbeit: 8 Aufgaben aus allen Themen, ohne Tipps und ohne Rückmeldung. Erst am Ende siehst du alle Lösungen und was du noch üben solltest.</p>
  <p class="muted">Nimm dir Heft und Stift. Plane etwa 30 Minuten ein.</p><h2>Welche Farbe nimmst du?</h2>
  <div class="row">${LVS.map(l=>`<button type="button" class="cell c-${l}" style="min-width:104px;padding-inline:14px" data-l="${l}"><b>${LV[l]}</b></button>`).join('')}</div></div>
  ${P.kl.length?`<div class="card stack"><h2>Deine letzten Versuche</h2>${P.kl.slice(-4).reverse().map(k=>`<div class="tr"><span>${esc(k.d)} · ${LV[k.l]}</span><div class="bar"><div style="width:${k.p/k.m*100}%"></div></div><span class="muted">${k.p}/${k.m}</span></div>`).join('')}</div>`:''}`;
 $('vExam').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{S={mode:'kl',l:b.dataset.l,list:buildKl(b.dataset.l),i:0,res:[],t0:Date.now()};klStep();});
 show('vExam','exam');}
function klStep(){const q=S.list[S.i],n=S.list.length;
 render(q,`<div class="qhead"><b>Aufgabe ${S.i+1} von ${n}</b>${lvTag(S.l)}</div><div class="pr"><div style="width:${S.i/n*100}%"></div></div>`,'c-'+S.l);
 $('acts').innerHTML=`<button type="button" class="btn pri" id="go">${S.i===n-1?'Abgeben':'Weiter'}</button>`;
 $('go').onclick=()=>{if(!answered(q)&&!S.warn){S.warn=true;toast('Noch nicht fertig. Tippe nochmal, um ohne Antwort weiterzugehen.');return;}S.warn=false;S.res.push(grade(q));S.i++;if(S.i<n)klStep();else klEnd();};
 show('vTask','exam');}
function klEnd(){const p=S.res.reduce((a,r)=>a+r.p,0),m=S.res.reduce((a,r)=>a+r.m,0),pc=p/m*100,min=Math.max(1,Math.round((Date.now()-S.t0)/60000));
 const d=new Date(),ds=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
 P.kl.push({d:ds,l:S.l,p,m});P.kl=P.kl.slice(-12);store();
 const by={};S.list.forEach((q,i)=>{const b=by[q.t]=by[q.t]||{p:0,m:0};b.p+=S.res[i].p;b.m+=S.res[i].m;});
 const weak=Object.keys(by).filter(k=>by[k].p/by[k].m<.7);
 const msg=pc>=85?'Sehr stark. Das sieht nach einer guten Klassenarbeit aus. Probiere auch die nächste Farbe.':pc>=65?'Gut. Du kannst schon viel. Übe jetzt gezielt die Themen unten.':pc>=45?'Ein Anfang. Mit den Stationen unten holst du schnell auf.':'Fang mit den Orange-Stationen und dem Merkzettel an. Dann versuche es noch einmal.';
 $('vRes').className='c-'+S.l;
 $('vRes').innerHTML=`<div class="card stack"><div class="qhead"><b>Probeklausur</b>${lvTag(S.l)}</div><div class="big">${p} von ${m} Punkten</div><p>${msg}</p><p class="small muted">Das ist eine Übung und keine Note. Gebraucht: ${min} min.</p></div>
 <div class="card stack"><h2>Deine Themen</h2>${Object.keys(by).map(k=>`<div class="tr"><span>${esc(topic(k).name)}</span><div class="bar"><div style="width:${by[k].p/by[k].m*100}%"></div></div><span class="muted">${by[k].p}/${by[k].m}</span></div>`).join('')}
 ${weak.length?`<h3 style="margin-top:8px">Das solltest du noch üben</h3><div class="row">${weak.map(k=>`<button type="button" class="btn sec sm" data-t="${k}">${esc(topic(k).name)}</button>`).join('')}</div>`:''}</div>
 <div class="card"><h2>Alle Aufgaben mit Lösung</h2>${S.list.map((q,i)=>{const r=S.res[i];return `<div class="rv"><div class="mk ${r.ok?'y':'n'}">Aufgabe ${i+1}: ${r.p} von ${r.m} ${r.m===1?'Punkt':'Punkten'}</div><div>${fmt(q.q)}</div>${q.show?tabHtml(q.show):''}${q.fig?graph(q.fig):''}<div class="small">Deine Antwort: ${esc(plain(r.txt))}</div>${r.ok?'':`<div class="small"><b>Richtig: ${fmt(r.right)}</b></div>`}<ol class="st3 small">${q.sol.map(s=>`<li>${fmt(s)}</li>`).join('')}</ol></div>`;}).join('')}</div>
 <div class="card stack"><h2>Ergebnis für IServ sichern</h2><div id="saveRes"></div><div class="row"><button type="button" class="btn pri" id="k1">Neue Probeklausur</button><button type="button" class="btn ghost" id="k2">Zu den Stationen</button></div></div>`;
 const box=$('vRes');box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;startSet(k,S.l);});
 $('k1').onclick=examStart;$('k2').onclick=home;saveBox($('saveRes'));show('vRes','exam');}

/* ---------- Sichern ---------- */
function report(){const d=new Date(),pad=n=>String(n).padStart(2,'0'),ds=pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
 let t='MATHE-WISSENSJAGD ZUORDNUNGEN – Stand\n====================================\nName:   '+P.name+'\nKlasse: '+P.kl_+'\nDatum:  '+ds+'\n\nStationen (beste Runde von '+SIZE+'):\n';
 TOPICS.forEach(x=>{t+='  '+x.name+': '+LVS.map(l=>LV[l]+' '+((P.cells[x.id+l]||{}).best!=null?P.cells[x.id+l].best:'–')).join(', ')+'\n';});
 t+='\nProbeklausuren:\n';if(!P.kl.length)t+='  noch keine\n';P.kl.forEach(k=>t+='  '+k.d+' '+LV[k.l]+': '+k.p+' von '+k.m+' Punkten\n');
 const js=JSON.stringify({app:'mathe7-zuordnungen',v:1,name:P.name,kl:P.kl_,datum:ds,stationen:P.cells,klausuren:P.kl});
 return t+'\n#DATEN '+js+'\n';}
function saveBox(el){const top=window.self===window.top;
 el.innerHTML=`<div class="stack"><div class="fields"><label class="f">Dein Vorname<input id="sN" maxlength="30" value="${esc(P.name)}" autocomplete="given-name"></label><label class="f">Deine Klasse<input id="sK" maxlength="8" value="${esc(P.kl_)}" placeholder="z. B. 7c"></label></div>
 <div class="row">${top?'<button type="button" class="btn sec" id="sD">Datei speichern</button>':''}<button type="button" class="btn sec" id="sC">Ergebnis kopieren</button></div><p class="small muted">${top?'Lade die Datei in IServ hoch oder füge den kopierten Text dort ein.':'Füge den kopierten Text in IServ ein.'}</p></div>`;
 const up=()=>{P.name=$('sN').value.trim();P.kl_=$('sK').value.trim();store();return P.name&&P.kl_;};
 $('sN').oninput=up;$('sK').oninput=up;
 $('sC').onclick=()=>{if(!up()){toast('Trage zuerst Vorname und Klasse ein.');return;}const t=report();const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();toast(ok?'Kopiert.':'Kopieren ging nicht. Mach bitte einen Screenshot.');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Kopiert. Füge es jetzt in IServ ein.'),fb);else fb();};
 if(top)$('sD').onclick=()=>{if(!up()){toast('Trage zuerst Vorname und Klasse ein.');return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));a.download=('Zuordnungen_'+P.kl_+'_'+P.name).replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Gespeichert. Lade die Datei in IServ hoch.');};}

/* ---------- Merkzettel ---------- */
function memo(){
 const ct=(h,x,y)=>`<div class="tw"><table class="z"><tr><th scope="row">${h[0]}</th>${x.map(v=>`<td>${v}</td>`).join('')}</tr><tr><th scope="row">${h[1]}</th>${y.map(v=>`<td>${v}</td>`).join('')}</tr></table></div>`;
 const dst=(h,r,l,rr)=>dsHtml({head:h,rows:r,l,r:rr});
 $('vMemo').className='';
 $('vMemo').innerHTML=`<div class="card stack"><h1>Merkzettel</h1><p class="muted">Das Wichtigste aus dem Kapitel auf einen Blick. Die Zusammenfassung im Buch steht auf Seite 58.</p></div>
 <div class="card stack"><h2>So gehst du jede Aufgabe an</h2><ol class="st3"><li>Welche beiden Größen gehören zusammen?</li><li>Verdopple im Kopf die erste Größe: Wird die zweite <b>doppelt so groß</b>, <b>halb so groß</b> oder passiert etwas anderes?</li><li>Bei proportional und antiproportional: Tabelle anlegen und zur 1 rechnen.</li><li>Bei „etwas anderes“: Die Aufgabe geht nicht mit dem Dreisatz.</li></ol></div>
 <div class="two">
  <div class="card stack m-p"><h2>Proportional</h2><p><b>mehr → mehr</b><br>Zum Doppelten gehört das Doppelte, zum Dreifachen das Dreifache.</p>${ct(['Anzahl','Preis (in €)'],[1,2,3,4],[4,8,12,16])}<p><b>Quotientengleich:</b> 4 : 1 = 8 : 2 = 12 : 3 = 4. Das ist der Proportionalitätsfaktor.</p>${graph({xmax:4,ymax:16,xs:1,ys:4,lin:[4,0],xl:'Anzahl',yl:'Preis (in €)',mark:[[1,4],[2,8],[3,12],[4,16]]})}<p class="small muted">Alle Punkte liegen auf einer Geraden durch (0|0).</p></div>
  <div class="card stack m-p"><h2>Antiproportional</h2><p><b>mehr → weniger</b><br>Zum Doppelten gehört die Hälfte, zum Dreifachen ein Drittel.</p>${ct(['Bagger','Zeit (in h)'],[1,2,3,4],[12,6,4,3])}<p><b>Produktgleich:</b> 1 · 12 = 2 · 6 = 3 · 4 = 12. Das ist die gesamte Arbeit.</p>${graph({xmax:4,ymax:12,xs:1,ys:2,hyp:12,xl:'Bagger',yl:'Zeit (in h)',mark:[[1,12],[2,6],[3,4],[4,3]]})}<p class="small muted">Alle Punkte liegen auf einer fallenden Kurve, der Hyperbel.</p></div>
 </div>
 <div class="two">
  <div class="card stack m-p"><h2>Dreisatz proportional</h2><p>2 DVDs kosten 18 €. Wie teuer sind 3 DVDs?</p>${dst(['DVDs','Preis (in €)'],[[2,18],[1,9],[3,27]],[':2','·3'],[':2','·3'])}<p>Links und rechts rechnest du <b>dasselbe</b>.</p></div>
  <div class="card stack m-p"><h2>Dreisatz antiproportional</h2><p>2 Bagger brauchen 12 h. Wie lange brauchen 3 Bagger?</p>${dst(['Bagger','Zeit (in h)'],[[2,12],[1,24],[3,8]],[':2','·3'],['·2',':3'])}<p>Rechts rechnest du das <b>Gegenteil</b> von links.</p></div>
 </div>
 <div class="card stack"><h2>Typische Fehler</h2><ul class="st3"><li><b>„Es wird größer, also proportional.“</b> Das reicht nicht. Mit Grundgebühr wächst der Preis auch, ist aber nicht proportional.</li><li><b>Falscher Dreisatz.</b> Prüfe am Ende: Soll das Ergebnis größer oder kleiner werden?</li><li><b>Einheiten vergessen.</b> 1 kg = 1000 g und 1 h = 60 min. Rechne vor dem Dreisatz um.</li><li><b>Falsch gerundet.</b> Bei Packungen oder Personen musst du oft aufrunden.</li></ul></div>`;
 show('vMemo','memo');}
home();

</script>
</body></html>
