<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antiproportionale Zuordnungen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: eine Spalte; oben die vier Stationen als Weg, darunter immer genau eine Aufgabe mit direkter Rückmeldung */
:root{
  --bg:#f3f7f1; --card:#ffffff; --ink:#1d2b22; --muted:#5d6e62; --line:#d5e2d6; --cell:#f6f9f5;
  --forest:#2f7a45; --forest-ink:#ffffff; --sun:#f2b632; --sun-soft:#fff3d1;
  --ok:#2f8f4e; --ok-soft:#e1f4e6; --bad:#c2452d; --bad-soft:#fbe6e1; --sol:#1f5fbf;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a15; --card:#1b261f; --ink:#e7efe8; --muted:#9db0a2; --line:#2e3e33; --cell:#16201a;
  --forest:#4fae6c; --forest-ink:#0d1a11; --sun:#f5c452; --sun-soft:#3a3118;
  --ok:#5ec27c; --ok-soft:#173523; --bad:#ec7a62; --bad-soft:#3d1d17; --sol:#7fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --card:#1b261f; --ink:#e7efe8; --muted:#9db0a2; --line:#2e3e33; --cell:#16201a;
  --forest:#4fae6c; --forest-ink:#0d1a11; --sun:#f5c452; --sun-soft:#3a3118;
  --ok:#5ec27c; --ok-soft:#173523; --bad:#ec7a62; --bad-soft:#3d1d17; --sol:#7fb0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.4rem;font-weight:800} h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.leaf{width:40px;height:40px;flex:none}
.stars{font-family:var(--display);font-weight:800;background:var(--sun-soft);border:2px solid var(--sun);border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.waldi{display:flex;gap:12px;align-items:flex-start}
.bubble{background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 16px;min-width:0}
.route{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.76rem;color:var(--muted);min-width:0;line-height:1.2}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;border:3px solid var(--line);background:var(--card);color:var(--muted)}
.stop.done .dot{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.stop.now .dot{border-color:var(--sun);color:var(--ink);box-shadow:0 0 0 4px var(--sun-soft)}
.stop.now{color:var(--ink);font-weight:700}
.meta{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
label{font-weight:700;display:block;margin-bottom:4px}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--cell);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--ok-soft)} input.bad{border-color:var(--bad);background:var(--bad-soft)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.unit{font-weight:700;color:var(--muted);min-width:2.5em}
button{font:inherit;font-family:var(--display);font-weight:800;font-size:1.1rem;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--forest);color:var(--forest-ink)}
button.ghost{background:transparent;color:var(--forest);border:2px solid var(--forest)}
.opts{display:grid;gap:10px}
.opts button{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-family:var(--body);font-weight:700;font-size:1.02rem}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opts button:disabled{cursor:default}
.situ{font-size:1.2rem;font-weight:700;border-left:5px solid var(--sun);padding-left:12px}
.story{font-size:1.12rem}
.fb{border-radius:12px;padding:10px 14px}
.fb b{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.tip{background:var(--sun-soft);border-radius:12px;padding:10px 14px}
.heft{font-size:.92rem;color:var(--muted);border-left:4px solid var(--sun);padding-left:10px}
.scroll{overflow-x:auto}
table.wt{border-collapse:collapse;min-width:100%}
.wt th,.wt td{border:1.5px solid var(--line);padding:6px;text-align:center;height:48px;min-width:64px;font-variant-numeric:tabular-nums}
.wt th{background:var(--ok-soft);font-family:var(--display);font-weight:600;text-align:left;white-space:nowrap}
.wt td input{text-align:center;padding:6px;min-width:56px}
.prod{font-size:.9rem;color:var(--sol);font-weight:700}
.res{text-align:center;align-items:center}
.big{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;text-align:left;width:100%}
.lvl div:nth-child(even){font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.teacher{border:3px solid var(--sun);background:var(--sun-soft);text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:800;border-radius:16px;padding:14px}
.verdict{font-family:var(--display);font-weight:800;font-size:1.3rem}
.foot{text-align:center}
.foot button{background:none;color:var(--muted);font-family:var(--body);font-weight:600;font-size:.85rem;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.97)}to{transform:none}}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const KEY="waldi-antiprop-b1";
const app=document.getElementById("app");
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuffle=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=v=>v.toLocaleString("de-DE",{maximumFractionDigits:2});
const num=v=>{const c=String(v??"").replace(/\s/g,"").replace(/[^0-9,.\-]/g,"").replace(",",".");return c===""?NaN:parseFloat(c)};
const eq=(v,x)=>Math.abs(num(v)-x)<0.006;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const leaf=`<svg class="leaf" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--forest)"/><path d="M20 8c7 4 9 13 0 24-9-11-7-20 0-24z" fill="var(--sun)"/><path d="M20 12v18" stroke="var(--forest)" stroke-width="2"/></svg>`;

/* ---------- Station 1: Welche Zuordnung? ---------- */
const SITU=[
 ["Anzahl der Brötchen → Preis","p","Doppelt so viele Brötchen kosten doppelt so viel. Je mehr, desto mehr."],
 ["Anzahl der Kinokarten → Gesamtpreis","p","Jede Karte kostet gleich viel. Doppelte Anzahl, doppelter Preis."],
 ["Fahrzeit → Strecke (bei gleichem Tempo)","p","In doppelt so viel Zeit fährt man doppelt so weit."],
 ["Anzahl der Arbeiter → Zeit für dieselbe Arbeit","a","Doppelt so viele Arbeiter brauchen nur die Hälfte der Zeit. Je mehr, desto weniger."],
 ["Anzahl der Personen → Kosten pro Person für einen Reisebus","a","Der Bus kostet immer gleich viel. Bei doppelt so vielen Personen zahlt jeder nur die Hälfte."],
 ["Geschwindigkeit → Fahrzeit für eine feste Strecke","a","Doppelt so schnell heißt halb so lange unterwegs."],
 ["Anzahl der Kinder → Pizzastücke pro Kind (eine Pizza mit 12 Stücken)","a","12 Stücke werden geteilt. Doppelt so viele Kinder bekommen je halb so viele Stücke."],
 ["Größe der Flaschen → Anzahl der Flaschen für 120 Liter Saft","a","Doppelt so große Flaschen: Man braucht nur halb so viele."],
 ["Alter eines Kindes → Körpergröße","n","Kinder wachsen nicht gleichmäßig. Mit doppeltem Alter ist man nicht doppelt so groß."],
 ["Anzahl der Spieler → Dauer eines Fußballspiels","n","Das Spiel dauert immer 90 Minuten, egal wie viele mitspielen."],
 ["Brenndauer einer Kerze → Höhe der Kerze","n","Die Kerze wird kürzer, aber nicht auf die Hälfte, wenn die Zeit sich verdoppelt. Die Wertepaare sind nicht produktgleich."],
 ["Anzahl der Hühner → Zeit, bis ein Futtersack leer ist","a","Doppelt so viele Hühner fressen den Sack in der halben Zeit leer."]
];
const LAB={p:"proportional",a:"antiproportional",n:"weder noch"};

/* ---------- Station 2: Produktgleich? ---------- */
function genTable(r,anti){
  const k=pick(r,[24,36,48,60,72,120]);
  const divs=[1,2,3,4,5,6,8,10,12].filter(d=>k%d===0);
  const xs=shuffle(r,divs).slice(0,4).sort((a,b)=>a-b);
  if(anti) return {xs,ys:xs.map(x=>k/x),anti:true,k};
  const kind=pick(r,["prop","minus"]);
  if(kind==="prop"){const m=pick(r,[2,3,5]);return {xs,ys:xs.map(x=>x*m),anti:false}}
  const d=pick(r,[2,3]),s=xs[xs.length-1]*d+pick(r,[4,6,10]);return {xs,ys:xs.map(x=>s-d*x),anti:false};
}

/* ---------- Station 3: Tabelle ergänzen ---------- */
function genFill(r){
  const k=pick(r,[24,36,48,60,72,120]);
  const divs=[1,2,3,4,5,6,8,10,12].filter(d=>k%d===0);
  const xs=shuffle(r,divs).slice(0,5).sort((a,b)=>a-b);
  const gi=Math.floor(r()*xs.length);
  return {k,xs,ys:xs.map(x=>k/x),gi};
}

/* ---------- Station 4: Textaufgaben ---------- */
function pickPair(r,k,list){const ok=list.filter(d=>k%d===0);const s=shuffle(r,ok);return [s[0],s[1]]}
const TXT=[
 r=>{const k=pick(r,[24,36,48,60]);const [a,b]=pickPair(r,k,[2,3,4,6,8,12]);
   return{story:`${a} Maler streichen eine Turnhalle in ${k/a} Stunden. Wie lange brauchen ${b} Maler?`,s1:"Ein Maler allein bräuchte",u1:"Stunden",v1:k,s2:`${b} Maler brauchen`,u2:"Stunden",v2:k/b,prop:k/a*b/a,more:b>a?"Mehr Maler, also weniger Zeit!":"Weniger Maler, also mehr Zeit!"}},
 r=>{const k=pick(r,[600,720,900,1200]);const [a,b]=pickPair(r,k,[20,24,30,36,40,45,48,50,60]);
   return{story:`Ein Reisebus kostet ${k} €. Fahren ${a} Personen mit, zahlt jede ${fmt(k/a)} €. Wie viel zahlt jede Person, wenn ${b} Personen mitfahren?`,s1:"Gesamtpreis für den Bus",u1:"€",v1:k,s2:"Jede Person zahlt",u2:"€",v2:k/b,prop:k/a*b/a,more:b>a?"Mehr Personen teilen sich den Preis, also zahlt jeder weniger!":"Weniger Personen teilen sich den Preis, also zahlt jeder mehr!"}},
 r=>{const L=pick(r,[60,120,180]);const sizes=[0.5,0.75,1,1.5,2].filter(s=>Math.abs(L/s-Math.round(L/s))<1e-9);const [s1,s2]=shuffle(r,sizes);
   return{story:`Ein Bio-Hof füllt ${L} Liter Apfelsaft ab. Mit ${fmt(s1)}-Liter-Flaschen braucht er ${fmt(L/s1)} Flaschen. Wie viele Flaschen braucht er mit ${fmt(s2)}-Liter-Flaschen?`,s1:"Liter Saft insgesamt",u1:"Liter",v1:L,s2:"Anzahl der Flaschen",u2:"Flaschen",v2:L/s2,prop:L/s1*s2/s1,more:s2>s1?"Größere Flaschen, also braucht man weniger!":"Kleinere Flaschen, also braucht man mehr!"}},
 r=>{const k=pick(r,[24,36,48,60]);const [a,b]=pickPair(r,k,[2,3,4,6,8,12]);
   return{story:`Ein Sack Futter reicht für ${a} Hasen genau ${k/a} Tage. Wie lange reicht er für ${b} Hasen?`,s1:"Für 1 Hasen würde er reichen",u1:"Tage",v1:k,s2:`Für ${b} Hasen reicht er`,u2:"Tage",v2:k/b,prop:k/a*b/a,more:b>a?"Mehr Hasen fressen das Futter schneller auf!":"Weniger Hasen, also reicht das Futter länger!"}},
 r=>{const k=pick(r,[120,240,360]);const [a,b]=pickPair(r,k,[40,60,80,90,120]);
   return{story:`Mit ${a} km/h dauert eine Fahrt ${fmt(k/a)} Stunden. Wie lange dauert sie mit ${b} km/h?`,s1:"Länge der Strecke",u1:"km",v1:k,s2:`Fahrzeit mit ${b} km/h`,u2:"Stunden",v2:k/b,prop:k/a*b/a,more:b>a?"Schneller fahren heißt kürzer unterwegs!":"Langsamer fahren heißt länger unterwegs!"}}
];

const STATIONS=[
 {name:"Welche Zuordnung?",n:6},
 {name:"Produkt-Check",n:4},
 {name:"Tabellen",n:3},
 {name:"Textaufgaben",n:5}
];
const MAXS=STATIONS.map(s=>s.n*3);

let S=load()||{view:"start"};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const total=()=>Object.values(S.stars||{}).reduce((a,b)=>a+b,0);
const stStars=l=>Object.entries(S.stars||{}).filter(([k])=>k.startsWith(l+"-")).reduce((a,[,v])=>a+v,0);
const starsFor=w=>w===0?3:w===1?2:1;

function item(l,i){
  const r=rng(S.seed+l*1013+i*71);
  if(l===0){const order=shuffle(rng(S.seed+5),SITU.map((_,j)=>j));return SITU[order[i]]}
  if(l===1){const pat=shuffle(rng(S.seed+9),[true,true,false,false]);return genTable(r,pat[i])}
  if(l===2)return genFill(r);
  const order=shuffle(rng(S.seed+13),[0,1,2,3,4]);return TXT[order[i]](r);
}

function header(){return `<div class="top"><div class="brand">${leaf}<div><div class="meta">Mathe 7.2 B1</div><h3>Waldis Je-mehr-desto-weniger</h3></div></div>${S.name?`<div class="stars">★ ${total()}</div>`:""}</div>`}
function route(cur){return `<div class="card"><div class="route">${STATIONS.map((s,i)=>`<div class="stop ${i<cur?"done":i===cur?"now":""}"><div class="dot">${i<cur?"✓":i+1}</div>${s.name}</div>`).join("")}<div class="stop ${cur>=4?"done":""}"><div class="dot">★</div>Ergebnis</div></div></div>`}

function render(){
  let h=header();
  if(S.view==="start")h+=startView();
  else if(S.view==="play")h+=route(S.l)+playView();
  else if(S.view==="end")h+=route(4)+endView();
  app.innerHTML=h+`<div class="foot"><button id="restart">Neu starten</button></div>`;
  bind();
}

function startView(){return `<div class="card pop"><div class="waldi">${leaf}<div class="bubble"><p><b>Je mehr, desto weniger!</b> Je mehr Freunde mit dir eine Pizza teilen, desto weniger bekommst du ab. Das ist eine antiproportionale Zuordnung. Zeig mir in 4 Stationen, dass du sie erkennst und damit rechnen kannst!</p></div></div>
<p>Du bekommst nach jeder Antwort eine Rückmeldung. Wenn etwas nicht stimmt, gebe ich dir einen Tipp. Rechne, wenn nötig, im Heft.</p>
<div><label for="nm">Dein Vorname und Nachname</label><input type="text" id="nm" autocomplete="off" placeholder="z. B. Mia Schneider"></div>
<p id="nmmsg" class="heft" hidden>Bitte trag deinen Namen ein.</p>
<button id="go">Los geht’s</button></div>`}

function playView(){
  const l=S.l,i=S.i,c=S.cur||{},st=STATIONS[l];
  let h=`<div class="card pop"><div class="meta">Station ${l+1}: ${st.name} · Aufgabe ${i+1} von ${st.n}</div>`;
  if(l===0){const it=item(0,i);
    h+=`<p>Ist diese Zuordnung proportional, antiproportional oder weder noch?</p><p class="situ">${it[0]}</p>
    <div class="opts">${["p","a","n"].map(k=>`<button class="opt ${c.done&&k===it[1]?"right":""} ${(c.tried||[]).includes(k)&&k!==it[1]?"wrong":""}" data-v="${k}" ${c.done||(c.tried||[]).includes(k)?"disabled":""}>${LAB[k]}</button>`).join("")}</div>`;
    if(c.done)h+=`<div class="fb ok" role="status"><b>Richtig! ${"★".repeat(starsFor(c.w))}</b>${it[2]}</div>`;
    else if(c.w)h+=`<div class="fb bad" role="status"><b>Noch nicht.</b>Frag dich: Was passiert mit der zweiten Größe, wenn die erste sich verdoppelt? Doppelt, halb oder keins von beiden?</div>`;
  }
  if(l===1){const t=item(1,i);
    h+=`<p>Ist diese Zuordnung antiproportional? Prüfe, ob alle Wertepaare <b>produktgleich</b> sind.</p>
    <div class="scroll"><table class="wt"><tr><th>x</th>${t.xs.map(x=>`<td>${fmt(x)}</td>`).join("")}</tr><tr><th>y</th>${t.ys.map(y=>`<td>${fmt(y)}</td>`).join("")}</tr>
    ${c.done?`<tr><th>x · y</th>${t.xs.map((x,j)=>`<td class="prod">${fmt(x*t.ys[j])}</td>`).join("")}</tr>`:""}</table></div>
    <p class="heft">Rechne im Heft für jedes Paar x · y.</p>
    <div class="opts">${[["yes","Ja, antiproportional"],["no","Nein, nicht antiproportional"]].map(([k,lab])=>{const right=(k==="yes")===t.anti;return `<button class="opt ${c.done&&right?"right":""} ${(c.tried||[]).includes(k)&&!right?"wrong":""}" data-v="${k}" ${c.done||(c.tried||[]).includes(k)?"disabled":""}>${lab}</button>`}).join("")}</div>`;
    if(c.done)h+=`<div class="fb ok" role="status"><b>Richtig! ${"★".repeat(starsFor(c.w))}</b>${t.anti?`Alle Produkte sind ${t.k}. Die Wertepaare sind produktgleich.`:"Die Produkte sind nicht alle gleich. Also ist die Zuordnung nicht antiproportional."}</div>`;
    else if(c.w)h+=`<div class="fb bad" role="status"><b>Schau noch mal genau hin.</b>Multipliziere jedes Paar: x · y. Kommt jedes Mal dasselbe heraus?</div>`;
  }
  if(l===2){const t=item(2,i),v=c.v||{},m=c.mark||{};
    h+=`<p>Eine Tüte Gummibärchen wird gerecht aufgeteilt. Die Zuordnung ist antiproportional. Fülle die Tabelle aus.</p>
    <div class="scroll"><table class="wt"><tr><th>Anzahl Kinder</th>${t.xs.map(x=>`<td>${x}</td>`).join("")}</tr><tr><th>Gummibärchen pro Kind</th>${t.ys.map((y,j)=>j===t.gi?`<td><b>${fmt(y)}</b></td>`:`<td><input type="text" inputmode="decimal" id="f${j}" data-j="${j}" value="${esc(v[j]||"")}" class="${m[j]||""}" ${c.done?"disabled":""} aria-label="Gummibärchen für ${t.xs[j]} Kinder"></td>`).join("")}</tr></table></div>
    <p class="heft">Tipp zum Start: Rechne zuerst ${t.xs[t.gi]} · ${fmt(t.ys[t.gi])}. Das ist die Anzahl aller Gummibärchen.</p>`;
    if(c.done)h+=`<div class="fb ok" role="status"><b>Alles richtig! ${"★".repeat(starsFor(c.w))}</b>Insgesamt sind es ${t.k} Gummibärchen. Jedes Mal gilt: Anzahl Kinder · Gummibärchen pro Kind = ${t.k}.</div>`;
    else if(c.w)h+=`<div class="fb bad" role="status"><b>Die roten Felder stimmen noch nicht.</b>${c.w>=2?`Teile die Gesamtzahl der Gummibärchen durch die Anzahl der Kinder.`:"Kontrolle: Anzahl Kinder · Gummibärchen pro Kind muss immer dasselbe ergeben."}</div>`;
    if(!c.done)h+=`<button id="chk">Prüfen</button>`;
  }
  if(l===3){const t=item(3,i);
    h+=`<p class="story">${t.story}</p><p class="heft">Rechne im Heft. Bei antiproportionalen Zuordnungen hilft das Produkt: Erst das Ganze ausrechnen, dann teilen.</p>
    <div><label for="a1">${t.s1}</label><div class="field"><input type="text" inputmode="decimal" id="a1" value="${esc(c.a1||"")}" class="${c.ok1?"ok":c.bad1?"bad":""}" ${c.ok1?"disabled":""}><span class="unit">${t.u1}</span></div></div>
    <div><label for="a2">${t.s2}</label><div class="field"><input type="text" inputmode="decimal" id="a2" value="${esc(c.a2||"")}" class="${c.done?"ok":c.bad2?"bad":""}" ${c.done?"disabled":""}><span class="unit">${t.u2}</span></div></div>`;
    if(c.msg)h+=`<div class="fb ${c.done||c.msgOk?"ok":"bad"}" role="status">${c.msg}</div>`;
    if(!c.done)h+=`<button id="chk">Prüfen</button>`;
  }
  if(c.done)h+=`<button id="next">${i+1<st.n?"Nächste Aufgabe":l<3?"Zur nächsten Station":"Zum Ergebnis"}</button>`;
  return h+`</div>`;
}

function endView(){
  const t=total(),max=MAXS.reduce((a,b)=>a+b,0),pct=t/max;
  const v=pct>=0.8?["Super gemacht!","Du hast antiproportionale Zuordnungen richtig gut verstanden."]:pct>=0.6?["Gut gemacht!","Schau dir die Stationen mit wenigen Sternen noch einmal an."]:["Da geht noch was!","Lies den grünen Kasten auf S. 42 noch einmal und frag deine Lehrkraft."];
  return `<div class="card res pop"><div class="meta">Ergebnis von ${esc(S.name)}</div><div class="big">★ ${t} von ${max}</div><div class="verdict">${v[0]}</div><p>${v[1]}</p>
  <div class="lvl">${STATIONS.map((s,l)=>`<div>Station ${l+1}: ${s.name}</div><div>${stStars(l)} / ${MAXS[l]}</div>`).join("")}</div></div>
  <div class="teacher">Zeig dieses Ergebnis jetzt deiner Lehrkraft!</div>
  <div class="card"><div class="waldi">${leaf}<div class="bubble"><p>Merke dir: Bei einer <b>antiproportionalen</b> Zuordnung gehört zum Doppelten die Hälfte. Alle Wertepaare sind <b>produktgleich</b>, und der Graph ist eine fallende Kurve, die <b>Hyperbel</b>.</p></div></div></div>`;
}

function check(){
  const l=S.l,i=S.i,c=S.cur=S.cur||{w:0};c.w=c.w||0;
  if(l===2){const t=item(2,i);c.v=c.v||{};c.mark={};let all=true;
    t.xs.forEach((x,j)=>{if(j===t.gi)return;const el=document.getElementById("f"+j);c.v[j]=el.value;const ok=eq(el.value,t.ys[j]);c.mark[j]=ok?"ok":"bad";if(!ok)all=false});
    if(all){c.done=1;S.stars[l+"-"+i]=starsFor(c.w)}else c.w++;
  }
  if(l===3){const t=item(3,i);c.a1=document.getElementById("a1").value;c.a2=document.getElementById("a2").value;c.bad1=c.bad2=0;
    if(!c.ok1){
      if(eq(c.a1,t.v1)){c.ok1=1;c.msg="Das Ganze stimmt! Jetzt teilen.";c.msgOk=1}
      else{c.w++;c.bad1=1;c.msg="Das Ganze stimmt noch nicht. Multipliziere die beiden Werte, die du kennst.";c.msgOk=0;save();render();return}
    }
    if(String(c.a2).trim()==="")return save(),render();
    if(eq(c.a2,t.v2)){c.done=1;S.stars[l+"-"+i]=starsFor(c.w);c.msg=`<b>Richtig! ${"★".repeat(starsFor(c.w))}</b>${t.more}`;c.msgOk=1}
    else if(eq(c.a2,t.prop)){c.w++;c.bad2=1;c.msg=`<b>Achtung, Falle!</b>Du hast proportional gerechnet. Hier gilt aber: Je mehr, desto weniger. Teile das Ganze durch die neue Anzahl.`;c.msgOk=0}
    else{c.w++;c.bad2=1;c.msg=`<b>Noch nicht.</b>${c.w>=2?"Teile das Ganze durch die neue Anzahl.":"Was passiert mit dem Ergebnis, wenn die Anzahl größer wird: mehr oder weniger?"}`;c.msgOk=0}
  }
  save();render();
}

function bind(){
  const $=id=>document.getElementById(id);
  $("restart").onclick=()=>{if(S.view==="start")return;if(S.confirmReset){try{localStorage.removeItem(KEY)}catch(e){}S={view:"start"};render();return}S.confirmReset=1;$("restart").textContent="Wirklich neu starten? Alle Sterne gehen verloren. Nochmal tippen.";setTimeout(()=>{S.confirmReset=0},4000)};
  if($("go"))$("go").onclick=()=>{const n=$("nm").value.trim();if(n.length<3){$("nmmsg").hidden=false;$("nm").focus();return}
    S={view:"play",name:n,seed:Math.floor(Math.random()*1e9),l:0,i:0,stars:{},cur:{w:0}};save();render()};
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const l=S.l,i=S.i,c=S.cur=S.cur||{w:0};c.tried=c.tried||[];
    const right=l===0?item(0,i)[1]===b.dataset.v:((b.dataset.v==="yes")===item(1,i).anti);
    if(right){c.done=1;S.stars[l+"-"+i]=starsFor(c.w||0)}else{c.w=(c.w||0)+1;c.tried.push(b.dataset.v)}
    save();render()});
  if($("chk"))$("chk").onclick=check;
  document.querySelectorAll("input[type=text]").forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter"&&$("chk"))check()}));
  if($("next"))$("next").onclick=()=>{S.cur={w:0};if(S.i+1<STATIONS[S.l].n)S.i++;else if(S.l<3){S.l++;S.i=0}else S.view="end";save();render();window.scrollTo(0,0)};
}
render();
})();
</script>

</html>
