<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Waldis Wissens-Check A2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: eine Spalte wie das Testblatt, oben eine klebende Zeitleiste; nach der Abgabe wird dieselbe Spalte zum Ergebnisblatt */
:root{
  --bg:#f3f7f1; --card:#ffffff; --ink:#1d2b22; --muted:#5d6e62; --line:#d5e2d6; --cell:#f6f9f5;
  --forest:#2f7a45; --forest-ink:#ffffff; --sun:#f2b632; --sun-soft:#fff3d1;
  --ok:#2f8f4e; --ok-soft:#e1f4e6; --bad:#c2452d; --bad-soft:#fbe6e1; --sol:#1f5fbf;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a15; --card:#1b261f; --ink:#e7efe8; --muted:#9db0a2; --line:#2e3e33; --cell:#16201a;
  --forest:#4fae6c; --forest-ink:#0d1a11; --sun:#f5c452; --sun-soft:#3a3118;
  --ok:#5ec27c; --ok-soft:#173523; --bad:#ec7a62; --bad-soft:#3d1d17; --sol:#7fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --card:#1b261f; --ink:#e7efe8; --muted:#9db0a2; --line:#2e3e33; --cell:#16201a;
  --forest:#4fae6c; --forest-ink:#0d1a11; --sun:#f5c452; --sun-soft:#3a3118;
  --ok:#5ec27c; --ok-soft:#173523; --bad:#ec7a62; --bad-soft:#3d1d17; --sol:#7fb0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.35rem;font-weight:800} h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.leaf{width:38px;height:38px;flex:none}
.timer{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:999px;border:2px solid var(--forest);color:var(--ink);background:var(--card)}
.timer.extra{border-color:var(--sun);background:var(--sun-soft)}
.timer.low{border-color:var(--bad);background:var(--bad-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--forest);color:var(--forest-ink);font-family:var(--display);font-weight:800;flex:none}
.head{display:flex;gap:10px;align-items:center}
.waldi{display:flex;gap:12px;align-items:flex-start}
.bubble{background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 16px;min-width:0}
label{font-weight:700;display:block;margin-bottom:4px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:1.05rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--cell);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input:disabled,textarea:disabled{opacity:.85}
button{font:inherit;font-family:var(--display);font-weight:800;font-size:1.1rem;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--forest);color:var(--forest-ink)}
button.ghost{background:transparent;color:var(--forest);border:2px solid var(--forest)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{font-size:1rem;padding:8px 16px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.choice button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.dst{table-layout:fixed;min-width:460px}
.dst th,.dst td{border:1.5px solid var(--line);padding:4px 6px;text-align:center;height:52px}
.dst th{background:var(--ok-soft);font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dst td.opc{border:0;background:transparent;width:118px;padding:0;position:relative}
.op{position:absolute;top:-26px;height:52px;display:flex;align-items:center;gap:4px;font-weight:800;font-size:1.1rem;color:var(--ink)}
.op.l{right:2px}.op.r{left:2px}
.op input{width:56px;padding:6px 4px;text-align:center}
.op .curve{width:16px;height:48px;flex:none}
.dst td input{text-align:center;padding:6px;background:var(--cell)}
.given{font-weight:700}
.hint{font-size:.9rem;color:var(--muted)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.notice{background:var(--sun-soft);border:2px solid var(--sun);border-radius:14px;padding:12px 16px;font-weight:700}
.res-head{text-align:center;align-items:center}
.big{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:800;font-size:.9rem}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.cmp .meta{margin-bottom:4px}
.sol{color:var(--sol);font-weight:700}
.meta{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.teacher{border:3px solid var(--sun);background:var(--sun-soft);text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:800;border-radius:16px;padding:14px}
.foot{text-align:center}
.foot button{background:none;color:var(--muted);font-family:var(--body);font-weight:600;font-size:.85rem;text-decoration:underline;padding:4px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}
 .dst{min-width:0;font-size:.95rem}
 .dst th{white-space:normal;font-size:.9rem;line-height:1.2}
 .dst td.opc{width:74px}
 .op{gap:2px;font-size:1rem}
 .op input{width:38px;padding:6px 2px}
 .op .curve{width:12px}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const PIN="3815", KEY="waldi-wwc-a2-v3", T1=10*60, T2=15*60;
const app=document.getElementById("app");
let S=load()||{view:"start",a:{}};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const c=String(v??"").replace(/\s/g,"").replace(/[^0-9,.\-]/g,"").replace(",",".");return c===""?NaN:parseFloat(c)};
const eq=(v,x)=>Math.abs(num(v)-x)<0.006;
const nums=s=>(String(s||"").match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(",",".")));
/* Antwortsatz fair: mindestens 3 Wörter und das richtige Ergebnis kommt darin vor. Rechtschreibung zählt nicht. */
function sentenceOk(s,x){const w=String(s||"").trim().split(/\s+/).filter(Boolean);return w.length>=3&&nums(s).some(n=>Math.abs(n-x)<0.006)}
const leaf=`<svg class="leaf" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--forest)"/><path d="M20 8c7 4 9 13 0 24-9-11-7-20 0-24z" fill="var(--sun)"/><path d="M20 12v18" stroke="var(--forest)" stroke-width="2"/></svg>`;
const curve=`<svg class="curve" viewBox="0 0 16 44" aria-hidden="true"><path d="M14 3Q1 22 14 41" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 41l-7-1m7 1l-1-7" stroke="currentColor" stroke-width="2" fill="none"/></svg>`;
const curveR=`<svg class="curve" viewBox="0 0 16 44" aria-hidden="true"><path d="M2 3Q15 22 2 41" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 41l7-1m-7 1l1-7" stroke="currentColor" stroke-width="2" fill="none"/></svg>`;

function inp(id,ph,w){const v=S.a[id]??"";const dis=S.view==="result"?"disabled":"";return `<input type="text" inputmode="decimal" id="${id}" data-k="${id}" value="${esc(v)}" placeholder="${ph||""}" ${dis} ${w?`style="width:${w}"`:""} autocomplete="off">`}
function txt(id,ph){const dis=S.view==="result"?"disabled":"";return `<textarea id="${id}" data-k="${id}" placeholder="${ph||""}" ${dis}>${esc(S.a[id]??"")}</textarea>`}
function choice(id){const v=S.a[id];const dis=S.view==="result"?"disabled":"";return `<div class="choice" role="group"><button type="button" class="ch" data-k="${id}" data-v="ja" aria-pressed="${v==="ja"}" ${dis}>Ja, Dreisatz passt</button><button type="button" class="ch" data-k="${id}" data-v="nein" aria-pressed="${v==="nein"}" ${dis}>Nein, passt nicht</button></div>`}
/* Dreisatz-Tabelle: cells = Zeilen mit [links, rechts], jeweils fester Wert oder {id}; ops = Rechenzeichen-Eingaben */
function dsTable(h,rows,ops){
  const cell=c=>typeof c==="string"?`<td class="given">${c}</td>`:`<td>${inp(c.id,"?")}</td>`;
  const opL=o=>o?`<td class="opc"><div class="op l"><span>${o.sym}</span>${inp(o.id+"l","")}${curve}</div></td>`:`<td class="opc"></td>`;
  const opR=o=>o?`<td class="opc"><div class="op r">${curveR}<span>${o.sym}</span>${inp(o.id+"r","")}</div></td>`:`<td class="opc"></td>`;
  return `<div class="scroll"><table class="dst"><tr><td class="opc"></td><th>${h[0]}</th><th>${h[1]}</th><td class="opc"></td></tr>${rows.map((r,i)=>`<tr>${opL(i>0?ops[i-1]:null)}${cell(r[0])}${cell(r[1])}${opR(i>0?ops[i-1]:null)}</tr>`).join("")}</table></div>`;
}
/* ---------- Aufgaben ---------- */
const TASKS=[
 {n:1,title:"Muffins",
  body:()=>`<p>4 Muffins kosten 12 €. Wie viel kosten 7 Muffins? Ergänze die Tabelle und schreibe einen Antwortsatz.</p>
   ${dsTable(["Anzahl Muffins","Preis (in €)"],[["4","12"],["1",{id:"1p1"}],["7",{id:"1p7"}]],[{sym:":",id:"1o1"},{sym:"·",id:"1o2"}])}
   <div><label for="1s">Antwortsatz</label>${txt("1s","")}</div>`,
  grade:a=>({ok:eq(a["1p1"],3)&&eq(a["1p7"],21),sent:sentenceOk(a["1s"],21)}),
  result:a=>[["Preis für 1 Muffin",a["1p1"]||"–","3 €"],["Preis für 7 Muffins",a["1p7"]||"–","21 €"],["Rechenzeichen",`: ${a["1o1l"]||"_"} und · ${a["1o2l"]||"_"}`,": 4 und · 7"],["Antwortsatz",a["1s"]||"–","7 Muffins kosten 21 €."]],
  explain:"Erst auf 1 zurückrechnen: 12 € : 4 = 3 €. Dann hochrechnen: 3 € · 7 = 21 €. Links und rechts wird immer dasselbe gerechnet."},
 {n:2,title:"Fahrrad",
  body:()=>`<p>Emir fährt mit dem Fahrrad immer gleich schnell. In 3 Stunden schafft er 45 km. Wie weit kommt er in 5 Stunden? Ergänze die Tabelle und schreibe einen Antwortsatz.</p>
   ${dsTable(["Zeit (in h)","Strecke (in km)"],[["3","45"],["1",{id:"2k1"}],["5",{id:"2k5"}]],[{sym:":",id:"2o1"},{sym:"·",id:"2o2"}])}
   <div><label for="2s">Antwortsatz</label>${txt("2s","")}</div>`,
  grade:a=>({ok:eq(a["2k1"],15)&&eq(a["2k5"],75),sent:sentenceOk(a["2s"],75)}),
  result:a=>[["Strecke in 1 Stunde",a["2k1"]||"–","15 km"],["Strecke in 5 Stunden",a["2k5"]||"–","75 km"],["Rechenzeichen",`: ${a["2o1l"]||"_"} und · ${a["2o2l"]||"_"}`,": 3 und · 5"],["Antwortsatz",a["2s"]||"–","In 5 Stunden kommt Emir 75 km weit."]],
  explain:"Erst auf 1 Stunde zurückrechnen: 45 km : 3 = 15 km. Dann hochrechnen: 15 km · 5 = 75 km."},
 {n:3,title:"Saft",
  body:()=>`<p>5 Flaschen Saft kosten 7,50 €. Wie viel kosten 8 Flaschen Saft?</p>
   ${dsTable(["Anzahl Flaschen","Preis (in €)"],[[{id:"3a0"},{id:"3b0"}],[{id:"3a1"},{id:"3b1"}],[{id:"3a2"},{id:"3b2"}]],[null,null])}
   <div><label for="3s">Antwortsatz</label>${txt("3s","")}</div>`,
  grade:a=>({ok:eq(a["3a2"],8)&&eq(a["3b2"],12),sent:sentenceOk(a["3s"],12)}),
  result:a=>[["1. Zeile",`${a["3a0"]||"_"} Flaschen → ${a["3b0"]||"_"} €`,"5 Flaschen → 7,50 €"],["2. Zeile",`${a["3a1"]||"_"} Flasche → ${a["3b1"]||"_"} €`,"1 Flasche → 1,50 €"],["3. Zeile",`${a["3a2"]||"_"} Flaschen → ${a["3b2"]||"_"} €`,"8 Flaschen → 12 €"],["Antwortsatz",a["3s"]||"–","8 Flaschen Saft kosten 12 €."]],
  explain:"Erst auf 1 Flasche zurückrechnen: 7,50 € : 5 = 1,50 €. Dann hochrechnen: 1,50 € · 8 = 12 €."},
 {n:4,title:"Dreisatz – ja oder nein?",
  body:()=>`<p><b>a)</b> 3 Hefte kosten 4,50 €. Wie viel kosten 10 Hefte? Darf man hier den Dreisatz benutzen? Begründe und rechne, falls ja.</p>
   ${choice("4a")}
   <div><label for="4aw">Begründung</label>${txt("4aw","Weil …")}</div>
   <div><label for="4ap">10 Hefte kosten (in €)</label>${inp("4ap","Ergebnis",'160px')}</div>
   <p><b>b)</b> Tom ist mit 10 Jahren 1,40 m groß. Ist er mit 20 Jahren 2,80 m groß? Begründe.</p>
   ${choice("4b")}
   <div><label for="4bw">Begründung</label>${txt("4bw","Weil …")}</div>`,
  grade:a=>({ok:a["4a"]==="ja"&&eq(a["4ap"],15)&&a["4b"]==="nein"}),
  result:a=>[
   ["a) Dreisatz?",a["4a"]?(a["4a"]==="ja"?"Ja":"Nein"):"–","Ja"],
   ["a) 10 Hefte kosten",a["4ap"]?a["4ap"]+" €":"–","15,00 €"],
   ["a) Deine Begründung",a["4aw"]||"–","Jedes Heft kostet gleich viel. Doppelt so viele Hefte kosten doppelt so viel. Die Zuordnung ist proportional."],
   ["b) Dreisatz?",a["4b"]?(a["4b"]==="ja"?"Ja":"Nein"):"–","Nein"],
   ["b) Deine Begründung",a["4bw"]||"–","Ein Mensch wächst nicht jedes Jahr gleich viel. 2,80 m ist nicht realistisch. Alter → Körpergröße ist nicht proportional."]],
  explain:"Rechnung zu a): 3 Hefte = 4,50 €. Geteilt durch 3: 1 Heft = 1,50 €. Mal 10: 10 Hefte = 15,00 €."},
 {n:5,title:"Kartoffeln",
  body:()=>`<p>4 kg Kartoffeln kosten 3,60 €. Tim hat 6,30 €. Wie viel kg Kartoffeln kann er kaufen? Rechne mit dem Dreisatz in deinem Heft.</p>
   <div><label for="5k">Tim kann so viele kg kaufen</label>${inp("5k","Ergebnis",'160px')}</div>
   <div><label for="5s">Antwortsatz</label>${txt("5s","")}</div>`,
  grade:a=>({ok:eq(a["5k"],7),sent:sentenceOk(a["5s"],7)}),
  result:a=>[["So viele kg",a["5k"]||"–","7 kg"],["Antwortsatz",a["5s"]||"–","Tim kann 7 kg Kartoffeln kaufen."]],
  explain:"Preis für 1 kg: 3,60 € : 4 = 0,90 €. Dann fragen: Wie oft passt 0,90 € in 6,30 €? 6,30 € : 0,90 € = 7. Also 7 kg."}
];

/* ---------- Zeit ---------- */
let tick=null;
const elapsed=()=>Math.floor((Date.now()-S.start)/1000);
function limit(){return elapsed()>=T1?T2:T1}
function fmtT(s){s=Math.max(0,s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function updTimer(){
  const el=document.getElementById("timer"); if(!el||S.view!=="test")return;
  const e=elapsed(), left=limit()-e;
  if(e>=T1&&!S.extended){S.extended=1;save();render();return}
  if(left<=0){submit(true);return}
  el.textContent=fmtT(left); el.className="timer"+(S.extended?" extra":"")+(left<=60?" low":"");
}

/* ---------- Ansichten ---------- */
function render(){
  clearInterval(tick);
  let h="";
  if(S.view==="start") h=startView();
  else if(S.view==="test") h=testView();
  else if(S.view==="result") h=resultView();
  else if(S.view==="teacher") h=teacherView();
  app.innerHTML=h+`<div class="foot"><button id="tbtn">Bereich für die Lehrkraft</button></div>`;
  bind();
  if(S.view==="test"){updTimer();tick=setInterval(updTimer,1000)}
}
function bar(right){return `<div class="bar"><div class="brand">${leaf}<div><div class="meta">Mathe 7.2 A2</div><h3>Waldis Wissens-Check</h3></div></div>${right||""}</div>`}

function startView(){return bar()+`<div class="card"><div class="waldi">${leaf}<div class="bubble"><p><b>Jetzt zeigst du, was du kannst!</b> Der Wissens-Check hat 5 Aufgaben. Du hast <b>10 Minuten</b> Zeit. Wenn du mehr brauchst, bekommst du automatisch 5 Minuten extra.</p></div></div>
<ul style="margin:0;padding-left:1.2em;display:grid;gap:4px">
<li>Du hast bestanden, wenn <b>4 von 5 Aufgaben</b> richtig sind.</li>
<li>Bei Antwortsätzen zählt der Inhalt: Das richtige Ergebnis muss im Satz stehen. Rechtschreibung ist egal.</li>
<li>Die Lösungen siehst du erst nach der Abgabe.</li>
<li>Du darfst im Heft nebenbei rechnen.</li></ul>
<div><label for="nm">Dein Vorname und Nachname</label><input type="text" id="nm" autocomplete="off" placeholder="z. B. Mia Schneider"></div>
<p id="nmmsg" class="hint" hidden>Bitte trag deinen Namen ein.</p>
<button id="go">Test starten</button></div>`}

function testView(){return bar(`<div class="timer" id="timer" aria-live="off">10:00</div>`)+
 (S.extended?`<div class="notice" role="status">Die 10 Minuten sind um. Du bekommst 5 Minuten extra. Danach wird automatisch abgegeben.</div>`:"")+
 TASKS.map(t=>`<div class="card"><div class="head"><span class="num">${t.n}</span><h2>${t.title}</h2></div>${t.body()}</div>`).join("")+
 `<div class="card"><p>Fertig? Prüfe noch einmal alle Felder und deine Antwortsätze.</p>
 ${S.confirm?`<div class="notice">Es sind noch ${S.confirm} Felder leer. Willst du trotzdem abgeben?</div><div class="row"><button id="sure">Ja, abgeben</button><button class="ghost" id="nosure">Weiter bearbeiten</button></div>`:`<button id="submit">Test abgeben</button>`}</div>`}

function resultView(){
  const R=S.res, right=R.filter(r=>r.ok).length, pass=right>=4;
  const used=S.used, mins=Math.floor(used/60), secs=used%60;
  return bar()+`<div class="card res-head"><div class="meta">Ergebnis von ${esc(S.name)}</div>
   <div class="big ${pass?"pass":"fail"}">${right} von 5</div>
   <h1 class="${pass?"pass":"fail"}">${pass?"Bestanden. Bravo!":"Noch nicht bestanden"}</h1>
   <p>${pass?"Super gemacht! Du kannst mit dem nächsten Teil weitermachen.":"Falls es diesmal nicht geklappt hat, übe noch ein bisschen und versuche es dann wieder."}</p>
   <p class="hint">Bearbeitungszeit: ${mins} min ${secs} s${S.extended?" (mit Verlängerung)":""}${S.auto?" · automatisch abgegeben":""}</p></div>
   <div class="teacher">Zeig dieses Ergebnis jetzt deiner Lehrkraft!</div>`+
  TASKS.map((t,i)=>{const r=R[i];const sent=r.sent===undefined?"":`<p>${r.sent?'<span class="tag ok">Antwortsatz in Ordnung</span>':'<span class="tag bad">Antwortsatz: richtiges Ergebnis fehlt</span>'}</p>`;
   return `<div class="card"><div class="head"><span class="num">${t.n}</span><h2>${t.title}</h2><span class="tag ${r.ok?"ok":"bad"}" style="margin-left:auto">${r.ok?"richtig":"falsch"}</span></div>
   ${t.result(S.a).map(([lab,yours,sol])=>`<div><div class="meta">${lab}</div><div class="cmp"><div><div class="meta">Deine Antwort</div>${esc(yours)}</div><div><div class="meta">Richtig wäre</div><span class="sol">${sol}</span></div></div></div>`).join("")}
   ${sent}<p><b>So geht’s:</b> ${t.explain}</p></div>`}).join("");
}

function teacherView(){return bar()+`<div class="card"><h2>Bereich für die Lehrkraft</h2>
<p>Hier wird der Test auf diesem Gerät zurückgesetzt, zum Beispiel für das nächste Kind oder einen neuen Versuch.</p>
<div><label for="tp">PIN</label><input type="password" id="tp" inputmode="numeric" autocomplete="off"></div>
${S.pinMsg?`<div class="fb bad" role="status">${S.pinMsg}</div>`:""}
<div class="row"><button id="reset">Test zurücksetzen</button><button class="ghost" id="back">Zurück</button></div></div>`}

/* ---------- Abgabe ---------- */
function emptyCount(){const ids=[...document.querySelectorAll("[data-k]")].filter(e=>!e.classList.contains("ch")&&!/o\d?[lr]?$/.test(e.dataset.k)).map(e=>e.dataset.k);
  const u=[...new Set(ids)];let n=u.filter(k=>!String(S.a[k]??"").trim()).length; if(!S.a["4a"])n++; if(!S.a["4b"])n++; return n}
function submit(auto){
  S.res=TASKS.map(t=>t.grade(S.a)); S.used=Math.min(elapsed(),T2); S.auto=!!auto; S.view="result"; S.confirm=0; save(); render(); window.scrollTo(0,0);
}

function bind(){
  const $=id=>document.getElementById(id);
  $("tbtn").onclick=()=>{S.back=S.view;S.view="teacher";S.pinMsg="";save();render()};
  if($("go"))$("go").onclick=()=>{const n=$("nm").value.trim();if(n.length<3){$("nmmsg").hidden=false;$("nm").focus();return}
    S={view:"test",name:n,a:{},start:Date.now()};save();render()};
  document.querySelectorAll("input[data-k],textarea[data-k]").forEach(el=>el.addEventListener("input",()=>{S.a[el.dataset.k]=el.value;save()}));
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{S.a[b.dataset.k]=b.dataset.v;save();
    b.parentElement.querySelectorAll(".ch").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  if($("submit"))$("submit").onclick=()=>{const n=emptyCount();if(n>0){S.confirm=n;save();render();$("sure").scrollIntoView({block:"center"})}else submit(false)};
  if($("sure"))$("sure").onclick=()=>submit(false);
  if($("nosure"))$("nosure").onclick=()=>{S.confirm=0;save();render()};
  if($("reset"))$("reset").onclick=()=>{if($("tp").value.trim()!==PIN){S.pinMsg="Die PIN stimmt nicht.";render();return}
    try{localStorage.removeItem(KEY)}catch(e){} S={view:"start",a:{}};render()};
  if($("back"))$("back").onclick=()=>{S.view=S.back||"start";S.pinMsg="";save();render()};
}
render();
})();
</script>


</body></html>
