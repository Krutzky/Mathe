<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waldis Dreisatz-Klassenfahrt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Fahrtenbuch – Etappenkarte oben, darunter immer genau eine Aufgabe */
:root{
  --bg:#f3f7f1; --card:#ffffff; --ink:#1d2b22; --muted:#5d6e62; --line:#d5e2d6;
  --forest:#2f7a45; --forest-ink:#ffffff; --sun:#f2b632; --sun-soft:#fff3d1;
  --ok:#2f8f4e; --ok-soft:#e1f4e6; --bad:#c2452d; --bad-soft:#fbe6e1;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a15; --card:#1b261f; --ink:#e7efe8; --muted:#9db0a2; --line:#2e3e33;
  --forest:#4fae6c; --forest-ink:#0d1a11; --sun:#f5c452; --sun-soft:#3a3118;
  --ok:#5ec27c; --ok-soft:#173523; --bad:#ec7a62; --bad-soft:#3d1d17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --card:#1b261f; --ink:#e7efe8; --muted:#9db0a2; --line:#2e3e33;
  --forest:#4fae6c; --forest-ink:#0d1a11; --sun:#f5c452; --sun-soft:#3a3118;
  --ok:#5ec27c; --ok-soft:#173523; --bad:#ec7a62; --bad-soft:#3d1d17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.5rem;font-weight:800} h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.leaf{width:40px;height:40px;flex:none}
.stars{font-family:var(--display);font-weight:800;color:var(--ink);background:var(--sun-soft);border:2px solid var(--sun);border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.waldi{display:flex;gap:12px;align-items:flex-start}
.bubble{background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 16px;min-width:0}
.route{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.78rem;color:var(--muted);min-width:0}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;border:3px solid var(--line);background:var(--card);color:var(--muted)}
.stop.done .dot{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.stop.now .dot{border-color:var(--sun);color:var(--ink);box-shadow:0 0 0 4px var(--sun-soft)}
.stop.now{color:var(--ink);font-weight:700}
label{font-weight:700;display:block;margin-bottom:4px}
input[type=text],input[type=password],select{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.field{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.unit{font-weight:700;color:var(--muted);min-width:2.5em}
button{font:inherit;font-family:var(--display);font-weight:800;font-size:1.1rem;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--forest);color:var(--forest-ink)}
button.ghost{background:transparent;color:var(--forest);border:2px solid var(--forest)}
button.small{font-size:.95rem;padding:8px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.story{font-size:1.15rem}
.heft{font-size:.92rem;color:var(--muted);border-left:4px solid var(--sun);padding-left:10px}
.fb{border-radius:12px;padding:10px 14px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.tip{background:var(--sun-soft);border-radius:12px;padding:10px 14px}
.meta{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.yn{display:flex;flex-direction:column;gap:10px}
.yn .item{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.yn .item.ok{border-color:var(--ok);background:var(--ok-soft)}
.diplom{text-align:center;border:3px double var(--forest)}
.code{font-family:var(--display);font-size:1.8rem;letter-spacing:.12em;font-weight:800}
.foot{text-align:center}
.foot button{background:none;color:var(--muted);font-family:var(--body);font-weight:600;font-size:.85rem;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96)}to{transform:none}}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const PIN_HASH = h("3815"); // Lehrkraft-PIN
function h(s){let x=5381;for(const c of String(s))x=((x<<5)+x+c.charCodeAt(0))|0;return (x>>>0).toString(36)}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r2=v=>Math.round(v*100)/100;
const fmt=(v,money)=>money?v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}):v.toLocaleString("de-DE",{maximumFractionDigits:2});
const pick=(r,a)=>a[Math.floor(r()*a.length)];

/* Aufgaben-Vorlagen: Zahlen werden pro Kind zufällig gewählt, Lösungen werden nie angezeigt */
const T={
 kekse:r=>{const u=pick(r,[.8,1.2,1.5,2,2.5]),a=pick(r,[3,4,5,6]),b=pick(r,[7,8,9,12]);
  return{story:`Für die Busfahrt kauft ihr Kekse. ${a} Packungen kosten ${fmt(r2(a*u),1)} €. Wie viel kosten ${b} Packungen?`,
  s1:"Preis für 1 Packung",u1:"€",v1:u,s2:`Preis für ${b} Packungen`,u2:"€",v2:r2(u*b),money:1,t1:`Teile beide Seiten durch ${a}.`,t2:`Rechne den Preis für 1 Packung mal ${b}.`}},
 wasser:r=>{const u=pick(r,[.4,.5,.6,.7]),a=pick(r,[4,5,6]),b=pick(r,[15,18,24]);
  return{story:`${a} Flaschen Wasser kosten ${fmt(r2(a*u),1)} €. Ihr braucht für die Wanderung ${b} Flaschen. Wie viel müsst ihr bezahlen?`,
  s1:"Preis für 1 Flasche",u1:"€",v1:u,s2:`Preis für ${b} Flaschen`,u2:"€",v2:r2(u*b),money:1,t1:`Teile beide Seiten durch ${a}.`,t2:`Rechne mal ${b}.`}},
 fotos:r=>{const u=pick(r,[12,15,18,20]),a=pick(r,[2,3,4]),b=pick(r,[5,7,9]);
  return{story:`Der Fotodrucker in der Jugendherberge druckt in ${a} Minuten ${a*u} Fotos. Wie viele Fotos schafft er in ${b} Minuten?`,
  s1:"Fotos in 1 Minute",u1:"Fotos",v1:u,s2:`Fotos in ${b} Minuten`,u2:"Fotos",v2:u*b,t1:`Teile beide Seiten durch ${a}.`,t2:`Rechne mal ${b}.`}},
 diesel:r=>{const u=pick(r,[.25,.3,.35]),a=pick(r,[100,200]),b=pick(r,[150,250,350]);
  return{story:`Der Reisebus verbraucht auf ${a} km genau ${fmt(r2(a*u))} Liter Diesel. Wie viel Diesel braucht er für die ${b} km bis zur Jugendherberge?`,
  s1:"Liter für 1 km",u1:"Liter",v1:u,s2:`Liter für ${b} km`,u2:"Liter",v2:r2(u*b),t1:`Teile beide Seiten durch ${a}. Das Ergebnis ist kleiner als 1.`,t2:`Rechne mal ${b}.`}},
 klettern:r=>{const u=pick(r,[8.5,9,12.5,14]),a=pick(r,[3,4,5]),b=pick(r,[24,26,28]);
  return{story:`Im Kletterpark zahlen ${a} Kinder zusammen ${fmt(r2(a*u),1)} € Eintritt. Eure Klasse hat ${b} Kinder. Wie viel kostet der Eintritt für alle?`,
  s1:"Eintritt für 1 Kind",u1:"€",v1:u,s2:`Eintritt für ${b} Kinder`,u2:"€",v2:r2(u*b),money:1,t1:`Teile beide Seiten durch ${a}.`,t2:`Rechne mal ${b}.`}},
 nudeln:r=>{const u=pick(r,[120,125,150]),a=pick(r,[4,5,8]),b=pick(r,[27,30,32]);
  return{story:`Die Küche der Jugendherberge braucht für ${a} Portionen Spaghetti ${a*u} g Nudeln. Wie viel Gramm Nudeln braucht sie für ${b} Portionen?`,
  s1:"Gramm für 1 Portion",u1:"g",v1:u,s2:`Gramm für ${b} Portionen`,u2:"g",v2:u*b,t1:`Teile beide Seiten durch ${a}.`,t2:`Rechne mal ${b}.`}},
 aepfel:r=>{const u=pick(r,[1.8,2.2,2.4]),a=pick(r,[2,4,5]),b=pick(r,[1.5,2.5,3.5]);
  return{story:`Auf dem Markt kosten ${a} kg Äpfel ${fmt(r2(a*u),1)} €. Wie viel kosten ${fmt(b)} kg?`,
  s1:"Preis für 1 kg",u1:"€",v1:u,s2:`Preis für ${fmt(b)} kg`,u2:"€",v2:r2(u*b),money:1,t1:`Teile beide Seiten durch ${a}.`,t2:`Rechne mal ${fmt(b)}. Kommazahlen sind erlaubt!`}},
 kaese:r=>{const u=pick(r,[1.2,1.5,1.8,2.1]),a=pick(r,[200,300,400]);
  return{story:`Für das Abendbrot: ${a} g Käse kosten ${fmt(r2(a/100*u),1)} €. Wie viel kostet 1 kg Käse? Tipp: Du musst nicht auf 1 g zurückrechnen.`,
  s1:"Preis für 100 g",u1:"€",v1:u,s2:"Preis für 1 kg",u2:"€",v2:r2(u*10),money:1,t1:`Wie oft passen 100 g in ${a} g? Teile durch diese Zahl.`,t2:"Wie oft passen 100 g in 1 kg = 1000 g?"}},
 schorle:r=>{const u=pick(r,[1.2,1.5,2,2.5]),a=pick(r,[2,3,4]),L=pick(r,[6,8,10,12]);
  return{story:`${a} Liter Apfelschorle kosten ${fmt(r2(a*u),1)} €. In der Klassenkasse sind ${fmt(r2(L*u),1)} € für Getränke. Wie viele Liter könnt ihr kaufen?`,
  s1:"Preis für 1 Liter",u1:"€",v1:u,s2:"So viele Liter",u2:"Liter",v2:L,t1:`Teile den Preis durch ${a}.`,t2:"Wie oft passt der Preis für 1 Liter in das Geld der Klassenkasse?"}}
};
const YN=[
 ["Jede Kinokarte kostet gleich viel. 6 Karten kosten also doppelt so viel wie 3 Karten.",1],
 ["Ein Kind ist mit 10 Jahren 1,40 m groß. Mit 20 Jahren ist es also 2,80 m groß.",0],
 ["Ein Maler streicht ein Zimmer in 6 Stunden. Zwei Maler brauchen also 12 Stunden.",0],
 ["Ein Liter Benzin kostet an der Tankstelle immer gleich viel. 20 Liter kosten doppelt so viel wie 10 Liter.",1],
 ["Beim Chips-Angebot bekommt man 3 Tüten zum Preis von 2. 6 Tüten kosten also doppelt so viel wie 3 Tüten im Einzelkauf.",0],
 ["Ein Drucker druckt jede Minute gleich viele Seiten. In 4 Minuten schafft er doppelt so viel wie in 2 Minuten.",1],
 ["Eine Kerze brennt jede Stunde 1 cm herunter. Nach 3 Stunden ist sie 3 cm kürzer.",1],
 ["Lina sprintet 100 m in 15 Sekunden. 10 km schafft sie also in 25 Minuten.",0]
];
const LEVELS=[
 {name:"Einkauf",title:"Etappe 1: Der große Einkauf",tasks:["kekse","wasser","fotos"]},
 {name:"Unterwegs",title:"Etappe 2: Unterwegs",tasks:["diesel","klettern","nudeln"]},
 {name:"Profi",title:"Etappe 3: Profi-Etappe",tasks:["aepfel","kaese","schorle"],bonusG:true},
 {name:"Ja oder nein",title:"Etappe 4: Dreisatz – ja oder nein?",yn:true}
];

const KEY="waldi-dreisatz-a2";
let S=load()||{view:"start"};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function task(l,i){const r=rng(S.seed+l*97+i*13);return T[LEVELS[l].tasks[i]](r)}
function ynSet(){const r=rng(S.seed+777);const idx=[...YN.keys()].sort(()=>r()-.5).slice(0,5);return idx.map(i=>YN[i])}
function num(v){const c=String(v).replace(/[^0-9,.\-]/g,"").replace(",",".");return c===""?NaN:parseFloat(c)}
const totalStars=()=>Object.values(S.stars||{}).reduce((a,b)=>a+b,0);

const leaf=`<svg class="leaf" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--forest)"/><path d="M20 8c7 4 9 13 0 24-9-11-7-20 0-24z" fill="var(--sun)"/><path d="M20 12v18" stroke="var(--forest)" stroke-width="2"/></svg>`;
function header(){return `<div class="top"><div class="brand">${leaf}<div><div class="meta">Mathe 7.2 A2</div><h3>Waldis Dreisatz-Klassenfahrt</h3></div></div>${S.name?`<div class="stars" aria-label="Sterne">★ ${totalStars()}</div>`:""}</div>`}
function route(cur){return `<div class="card"><div class="route">${LEVELS.map((L,i)=>`<div class="stop ${i<cur?"done":i===cur?"now":""}"><div class="dot">${i<cur?"✓":i+1}</div>${L.name}</div>`).join("")}<div class="stop ${cur>=4?"done":""}"><div class="dot">★</div>Diplom</div></div></div>`}
function foot(){return `<div class="foot"><button id="teacher">Bereich für die Lehrkraft</button></div>`}

function render(){
  let html=header();
  if(S.view==="start") html+=startView();
  else if(S.view==="task") html+=route(S.l)+taskView();
  else if(S.view==="yn") html+=route(S.l)+ynView();
  else if(S.view==="gate") html+=route(S.l)+gateView();
  else if(S.view==="diplom") html+=route(4)+diplomView();
  else if(S.view==="teacher") html+=teacherView();
  html+=foot();
  app.innerHTML=html; bind();
}

function startView(){return `<div class="card pop"><div class="waldi">${leaf}<div class="bubble"><p><b>Hey, ich bin Waldi!</b> Eure Klasse fährt auf Klassenfahrt, und ich brauche dich als Rechen-Chef. Bei jeder Etappe gibt es Textaufgaben, die du mit dem Dreisatz löst.</p></div></div>
<p>So geht’s: Du rechnest jede Aufgabe <b>in deinem Heft</b> mit Tabelle und Antwortsatz. In die App trägst du nur deine Ergebnisse ein. Die App sagt dir, ob sie stimmen, verrät aber keine Lösung. Nach jeder Etappe zeigst du dein Heft der Lehrkraft. Erst dann geht es weiter.</p>
<div><label for="nm">Dein Vorname und Nachname</label><input type="text" id="nm" autocomplete="off" value="Muster Kind"></div>
<div><label for="ks">Dein Kurs</label><select id="ks"><option value="G">G-Kurs</option><option value="E">E-Kurs</option></select></div>
<button id="go">Los geht die Fahrt</button></div>`}

function taskView(){const t=task(S.l,S.i),st=S.cur||{};const L=LEVELS[S.l];
return `<div class="card pop"><div class="meta">${L.title} · Aufgabe ${S.i+1} von ${L.tasks.length}</div>
<p class="story">${t.story}</p>
<p class="heft">Im Heft: Dreisatz-Tabelle (1. Satz, 2. Satz, 3. Satz) und Antwortsatz.</p>
<div><label for="a1">${t.s1}</label><div class="field"><input type="text" inputmode="decimal" id="a1" value="${esc(st.a1||"")}" ${st.ok1?"disabled":""}><span class="unit">${t.u1}</span></div></div>
<div><label for="a2">${t.s2}</label><div class="field"><input type="text" inputmode="decimal" id="a2" value="${esc(st.a2||"")}" ${st.done?"disabled":""}><span class="unit">${t.u2}</span></div></div>
${st.msg?`<div class="fb ${st.msgOk?"ok":"bad"}" role="status">${st.msg}</div>`:""}
${st.tip&&!st.done?`<div class="tip"><b>Waldis Tipp:</b> ${st.ok1?t.t2:t.t1}</div>`:""}
${st.done?`<button id="next">Weiter</button>`:`<button id="check">Prüfen</button>`}
${L.bonusG&&S.kurs==="G"&&!st.done?`<button class="ghost small" id="skip">Profi-Etappe überspringen (G-Kurs)</button>`:""}
</div>`}

function ynView(){const set=ynSet(),st=S.yn||{};
return `<div class="card pop"><div class="meta">${LEVELS[3].title}</div>
<p>Darf man hier mit dem Dreisatz rechnen? Entscheide. Schreib zu <b>jeder</b> Aussage eine kurze Begründung in dein Heft.</p>
<div class="yn">${set.map((s,i)=>`<div class="item ${st[i]==="ok"?"ok":""}"><p>${s[0]}</p>${st[i]==="ok"?`<b style="color:var(--ok)">Richtig entschieden!</b>`:`<div class="row"><button class="small yn-b" data-i="${i}" data-v="1">Ja, Dreisatz passt</button><button class="small ghost yn-b" data-i="${i}" data-v="0">Nein, passt nicht</button></div>${st[i]==="bad"?`<span style="color:var(--bad);font-weight:700">Überleg noch mal: Wird aus doppelt so viel wirklich doppelt so viel?</span>`:""}`}</div>`).join("")}</div>
${set.every((s,i)=>st[i]==="ok")?`<div class="tip"><b>Letzter Auftrag:</b> Erfinde eine eigene Dreisatz-Textaufgabe zur Klassenfahrt. Schreib sie mit Lösung in dein Heft und lass sie von einem Mitschüler oder einer Mitschülerin lösen.</div><button id="togate">Fertig – zur Lehrkraft</button>`:""}</div>`}

function gateView(){const last=S.l===3;return `<div class="card pop"><div class="waldi">${leaf}<div class="bubble"><p><b>Etappe geschafft!</b> Zeig jetzt dein Heft der Lehrkraft. Sie schaut sich deine Tabellen${last?", Begründungen und deine eigene Aufgabe":" und Antwortsätze"} an und schaltet die nächste Etappe frei.</p></div></div>
<div><label for="pin">PIN der Lehrkraft</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"></div>
${S.pinMsg?`<div class="fb bad" role="status">${S.pinMsg}</div>`:""}
<button id="unlock">Freischalten</button></div>`}

function diplomView(){const code="DS-"+h(S.name.toLowerCase()+"|"+totalStars()).slice(0,5).toUpperCase();
return `<div class="card diplom pop"><div class="meta">Urkunde</div><h1>Dreisatz-Diplom</h1>
<p>Hiermit wird bestätigt, dass</p><h2>${esc(S.name)}</h2><p>alle Etappen der Dreisatz-Klassenfahrt gemeistert hat.</p>
<div class="stars" style="align-self:center;font-size:1.4rem">★ ${totalStars()} Sterne</div>
<p class="meta">Prüfcode für die Lehrkraft</p><div class="code">${code}</div>
<p>Jetzt bist du bereit für <b>Waldis Wissens-Check A2</b>!</p></div>`}

function teacherView(){return `<div class="card pop"><h2>Bereich für die Lehrkraft</h2>
<p>Hier kann der Fortschritt auf diesem Gerät zurückgesetzt werden, zum Beispiel für das nächste Kind.</p>
<div><label for="tpin">PIN</label><input type="password" id="tpin" inputmode="numeric" autocomplete="off"></div>
${S.pinMsg?`<div class="fb bad" role="status">${S.pinMsg}</div>`:""}
<div class="row"><button id="reset">Fortschritt löschen</button><button class="ghost" id="back">Zurück</button></div></div>`}

function bind(){
  const $=id=>document.getElementById(id);
  $("teacher").onclick=()=>{S.back=S.view;S.view="teacher";S.pinMsg="";render()};
  if($("go"))$("go").onclick=()=>{const n=$("nm").value.trim();if(n.length<3||n==="Muster Kind"){$("nm").focus();$("nm").select();return}
    S={view:"task",name:n,kurs:$("ks").value,seed:Math.floor(Math.random()*1e9),l:0,i:0,stars:{},cur:{}};save();render()};
  if($("check"))$("check").onclick=check;
  ["a1","a2"].forEach(id=>{if($(id))$(id).addEventListener("keydown",e=>{if(e.key==="Enter")check()})});
  if($("next"))$("next").onclick=()=>{const L=LEVELS[S.l];S.cur={};if(S.i+1<L.tasks.length){S.i++}else{S.view="gate";S.pinMsg=""}save();render()};
  if($("skip"))$("skip").onclick=()=>{S.l=3;S.i=0;S.view="yn";S.yn={};S.cur={};save();render()};
  document.querySelectorAll(".yn-b").forEach(b=>b.onclick=()=>{const set=ynSet(),i=+b.dataset.i;S.yn=S.yn||{};
    const right=String(set[i][1])===b.dataset.v;if(right&&S.yn[i]!=="bad")S.stars["yn"+i]=1;S.yn[i]=right?"ok":"bad";save();render()});
  if($("togate"))$("togate").onclick=()=>{S.view="gate";S.pinMsg="";save();render()};
  if($("unlock"))$("unlock").onclick=()=>{if(h($("pin").value.trim())!==PIN_HASH){S.pinMsg="Die PIN stimmt nicht. Nur die Lehrkraft darf freischalten.";render();return}
    S.pinMsg="";if(S.l>=3){S.view="diplom"}else{S.l++;S.i=0;S.cur={};S.view=S.l===3?"yn":"task";if(S.l===3)S.yn={}}save();render()};
  if($("reset"))$("reset").onclick=()=>{if(h($("tpin").value.trim())!==PIN_HASH){S.pinMsg="Die PIN stimmt nicht.";render();return}
    try{localStorage.removeItem(KEY)}catch(e){}S={view:"start"};render()};
  if($("back"))$("back").onclick=()=>{S.view=S.back||"start";S.pinMsg="";render()};
}

function check(){
  const t=task(S.l,S.i),c=S.cur=S.cur||{};
  const v1=num(document.getElementById("a1").value),v2=num(document.getElementById("a2").value);
  c.a1=document.getElementById("a1").value;c.a2=document.getElementById("a2").value;c.wrong=c.wrong||0;
  if(!c.ok1){
    if(isNaN(v1)){c.msg=`Trag zuerst „${t.s1}“ ein.`;c.msgOk=0}
    else if(Math.abs(v1-t.v1)<.006){c.ok1=1;c.tip=0;c.msg=`Der 2. Satz stimmt! Jetzt der 3. Satz.`;c.msgOk=1;
      if(!isNaN(v2))return check();}
    else{c.wrong++;c.msg="Der Wert für den 2. Satz stimmt noch nicht. Prüfe deine Rechnung im Heft.";c.msgOk=0;if(c.wrong>=2)c.tip=1}
  } else {
    if(isNaN(v2)){c.msg=`Trag noch „${t.s2}“ ein.`;c.msgOk=0}
    else if(Math.abs(v2-t.v2)<.006){c.done=1;c.tip=0;const s=c.wrong===0?3:c.wrong<=2?2:1;S.stars[S.l+"-"+S.i]=s;
      c.msg=`Stimmt! ${"★".repeat(s)} Hast du den Antwortsatz im Heft?`;c.msgOk=1}
    else{c.wrong++;c.msg="Das Ergebnis stimmt noch nicht. Schau dir deinen 3. Satz noch einmal an.";c.msgOk=0;if(c.wrong>=2)c.tip=1}
  }
  save();render();
}
render();
})();
</script>
