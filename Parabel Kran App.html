<title>Parabel-Kran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: Kopfleiste mit Stationen-Weg · links Koordinatensystem (fest) · rechts Kran-Steuerpult + Stationsaufgabe; auf schmalen Geräten untereinander.
   Gleiche Bildsprache wie der Parabel-Fahrstuhl (Stunde 3), Akzent jetzt Baustellen-Gelb/Orange für den Kran. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --norm:#8C96B4; --curve:#E8892B; --target:#C8423D; --pt:#1C66C0; --curve2:#1C66C0;
  --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --norm:#8792C2; --curve:#F3A04F; --target:#F07A73; --pt:#6FA8F0; --curve2:#6FA8F0;
  --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --norm:#8792C2; --curve:#F3A04F; --target:#F07A73; --pt:#6FA8F0; --curve2:#6FA8F0;
  --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-inline:16px}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px 10px 6px}
@media (max-width:860px){.plot{position:static}}
.term{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,36px);text-align:center;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.term .d{color:var(--accent)}
.term .e{color:var(--blue)}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Kran-Steuerpult */
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:34px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:8px;align-items:center}
.key{width:64px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}

/* Tabellen & Eingaben */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 5px;text-align:center}
thead th{background:var(--blue);color:var(--on-blue);font-weight:700}
thead th:first-child{background:var(--navy);color:var(--navy-ink)}
tbody th{background:var(--blue-soft);font-weight:700;white-space:nowrap}
.num{width:3.4em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface)}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.spt{white-space:nowrap}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);border:1.5px solid var(--line)}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:420px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.gap li{margin-bottom:10px}
.gap ol{padding-left:1.2em;margin:0}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}
.big{font-size:21px;font-weight:700}
.tf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.tf .why{grid-column:1/-1;font-size:15px}
@media (max-width:520px){.tf{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="hwrap">
    <div class="brand"><b>Parabel-Kran</b><span>Wie verschiebt d die Parabel y = (x − d)²?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>

<main>
  <section class="card plot" aria-label="Koordinatensystem">
    <div class="term" id="term">y = x²</div>
    <canvas id="cv" aria-label="Koordinatensystem mit Parabeln"></canvas>
  </section>

  <aside class="side">
    <section class="card" id="liftCard">
      <p class="eyebrow">Kran-Steuerung</p>
      <div id="liftOn">
        <div class="lift">
          <div class="disp"><small>POSITION d</small><span id="dispVal">0</span></div>
          <div class="keys">
            <button class="key" id="left" type="button" aria-label="d um 0,5 verringern">◀</button>
            <button class="key" id="right" type="button" aria-label="d um 0,5 erhöhen">▶</button>
          </div>
        </div>
        <input type="range" id="d" min="-5" max="5" step="0.5" value="0" aria-label="Regler für d">
        <div class="scale"><span>−5 (links)</span><span>0</span><span>+5 (rechts)</span></div>
        <label class="chk" style="margin-top:6px"><input type="checkbox" id="tNorm" checked> Normalparabel y = x² zum Vergleich zeigen</label>
        <label class="chk"><input type="checkbox" id="tAxis"> Symmetrieachse zeigen</label>
      </div>
      <p class="locked" id="liftOff" hidden></p>
    </section>

    <section class="card stack" id="task"></section>
  </aside>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var STATIONS=[
  {key:'s1',name:'Beobachten'},
  {key:'s2',name:'Vorhersagen'},
  {key:'s3',name:'Begründen'},
  {key:'s4',name:'Regel finden'},
  {key:'s5',name:'Training'},
  {key:'s6',name:'Profi-Zusatz',pro:true}
];
var GUESSES=[
  {k:'A',t:'y = x² + 3'},
  {k:'B',t:'y = (x + 3)²'},
  {k:'C',t:'y = (x − 3)²'},
  {k:'D',t:'y = x² − 3'}
];
var S1_ROWS=[0,2,-1,4,-3];            /* d-Werte; gezeigt werden die Terme */
var S1_T=[7,-10,2.5];
var S3_SETS=[{d:3,xs:[0,1,2,3,4,5,6]},{d:-2,xs:[-5,-4,-3,-2,-1,0,1]}];

var st={station:0,done:[false,false,false,false,false,false],d:0,norm:true,axis:false,guess:null,
  s1:{vals:{},mc:null,mcOk:false,t:{},tOk:false,tip:0},
  s2:{d:null,dir:null,hits:0,phase:'ask',last:null,anim:null},
  s3:{set:0,vals:{},solved:[false,false],zeroOk:[false,false],tip:0},
  s4:{ok:false,text:'',saved:false,reflect:''},
  s5:{mode:'graph',target:null,hits:0,solved:false},
  s6:{mode:'doppel',i:0,solved:{},combo:null,shown:null}};

/* ---------- Speicher (nur Bequemlichkeit) ---------- */
var KEY='parabel-kran-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s3:st.s3,s4:st.s4,s2hits:st.s2.hits,s5hits:st.s5.hits,s6solved:st.s6.solved}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  st.station=x.station||0;st.done=x.done||st.done;while(st.done.length<6)st.done.push(false);st.guess=x.guess||null;
  st.s1=x.s1||st.s1;st.s3=x.s3||st.s3;st.s4=x.s4||st.s4;st.s2.hits=x.s2hits||0;st.s5.hits=x.s5hits||0;st.s6.solved=x.s6solved||{};}catch(e){}}

/* ---------- Zahlen & Terme ---------- */
function fmt(v){var r=Math.round(v*100)/100;if(Object.is(r,-0))r=0;var s=Math.abs(r).toString().replace('.',',');return (r<0?'−':'')+s;}
function parse(str){if(str==null)return NaN;var s=String(str).trim().replace(/[−–—]/g,'-').replace(',','.').replace(/\s+/g,'');if(s===''||s==='-'||s==='+')return NaN;return Number(s);}
function br(d,cls){if(d===0)return 'x';return '(x '+(d>0?'−':'+')+' '+(cls?'<span class="'+cls+'">'+fmt(Math.abs(d))+'</span>':fmt(Math.abs(d)))+')';}
function termHTML(d,e){var b=d===0?'x²':br(d,'d')+'²';var t='y = '+b;if(e)t+=' '+(e>0?'+':'−')+' <span class="e">'+fmt(Math.abs(e))+'</span>';return t;}
function termTxt(d,e){var b=d===0?'x²':br(d)+'²';var t='y = '+b;if(e)t+=' '+(e>0?'+ ':'− ')+fmt(Math.abs(e));return t;}
function f(x,d,e){return (x-d)*(x-d)+(e||0);}

/* ---------- Zeichnen ---------- */
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0,PAD=30;
var X0=-7,X1=7,Y0=-3,Y1=10;
function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}
function resize(){
  var w=cv.getBoundingClientRect().width||600;
  var h=Math.max(280,Math.min(w*0.8,window.innerHeight-170));
  var dpr=window.devicePixelRatio||1;
  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;draw();
}
function sx(x){return PAD+(x-X0)/(X1-X0)*(W-2*PAD);}
function sy(y){return H-PAD-(y-Y0)/(Y1-Y0)*(H-2*PAD);}
function arrowTo(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();var a=Math.atan2(y2-y1,x2-x1),L=10;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-L*Math.cos(a-.4),y2-L*Math.sin(a-.4));ctx.lineTo(x2-L*Math.cos(a+.4),y2-L*Math.sin(a+.4));ctx.closePath();ctx.fill();}
function font(px,b,it){return (it?'italic ':'')+(b?'bold ':'')+px+'px '+getComputedStyle(document.body).fontFamily;}
function grid(){
  ctx.fillStyle=col('surface');ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=col('grid');ctx.lineWidth=1;
  var x,y;
  for(x=X0;x<=X1;x++){ctx.beginPath();ctx.moveTo(sx(x),sy(Y0));ctx.lineTo(sx(x),sy(Y1));ctx.stroke();}
  for(y=Y0;y<=Y1;y++){ctx.beginPath();ctx.moveTo(sx(X0),sy(y));ctx.lineTo(sx(X1),sy(y));ctx.stroke();}
  var ax=col('axis');ctx.strokeStyle=ax;ctx.fillStyle=ax;ctx.lineWidth=1.8;
  arrowTo(sx(X0),sy(0),sx(X1)+12,sy(0));arrowTo(sx(0),sy(Y0),sx(0),sy(Y1)-12);
  ctx.font=font(W<480?12:14);ctx.textAlign='center';ctx.textBaseline='top';
  for(x=X0;x<=X1;x++){if(x===0)continue;ctx.fillText(fmt(x),sx(x),sy(0)+5);}
  ctx.textAlign='right';ctx.textBaseline='middle';
  for(y=Y0;y<=Y1;y++){if(y===0)continue;ctx.fillText(fmt(y),sx(0)-6,sy(y));}
  ctx.font=font(16,false,true);ctx.textAlign='left';
  ctx.fillText('x',sx(X1)+2,sy(0)-14);ctx.fillText('y',sx(0)+9,sy(Y1)-6);
}
function parabola(d,e,color,width,dash){
  ctx.save();ctx.beginPath();ctx.rect(PAD,PAD-4,W-2*PAD,H-2*PAD+8);ctx.clip();
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();
  for(var i=0;i<=400;i++){var x=X0+(X1-X0)*i/400,y=f(x,d,e);if(i===0)ctx.moveTo(sx(x),sy(y));else ctx.lineTo(sx(x),sy(y));}
  ctx.stroke();ctx.restore();
}
function vline(x,color,txt){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(sx(x),sy(Y0));ctx.lineTo(sx(x),sy(Y1));ctx.stroke();ctx.restore();if(txt)label(txt,x,Y1-.6,color,x>4);}
function dot(x,y,color,r){ctx.beginPath();ctx.arc(sx(x),sy(y),r||7,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col('surface');ctx.stroke();}
function label(t,x,y,color,right){ctx.font=font(15,true);ctx.textBaseline='middle';ctx.textAlign=right?'right':'left';var w=ctx.measureText(t).width,px=sx(x)+(right?-12:12),py=sy(y);ctx.fillStyle=col('surface');ctx.globalAlpha=.9;ctx.fillRect(right?px-w-4:px-4,py-11,w+8,22);ctx.globalAlpha=1;ctx.fillStyle=color;ctx.fillText(t,px,py);}
/* kleiner Kranhaken über dem Scheitelpunkt */
function hook(d,e){var x=sx(d),y=sy(e||0);ctx.save();ctx.strokeStyle=col('axis');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,PAD-2);ctx.lineTo(x,y-16);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y-11,5,Math.PI*1.5,Math.PI*0.9,false);ctx.stroke();ctx.restore();}

function draw(){
  if(!W)return;grid();
  var k=STATIONS[st.station].key,norm=col('norm'),cur=col('curve');
  if(k==='s1'||k==='s4'){
    if(st.norm&&st.d!==0)parabola(0,0,norm,2.5,[9,7]);
    if(st.axis)vline(st.d,col('blue'),'x = '+fmt(st.d));
    hook(st.d,0);parabola(st.d,0,cur,5);dot(st.d,0,cur,6);
  } else if(k==='s2'){
    parabola(0,0,norm,2.5,[9,7]);
    if(st.s2.anim!==null){hook(st.s2.anim,0);parabola(st.s2.anim,0,cur,5);}
  } else if(k==='s3'){
    var set=S3_SETS[st.s3.set];
    parabola(0,0,norm,2.5,[9,7]);
    if(st.s3.solved[st.s3.set])parabola(set.d,0,cur,4);
    set.xs.forEach(function(x){var v=parse(st.s3.vals[set.d+'_'+x]);if(!isNaN(v)&&v>=Y0&&v<=Y1){dot(x,v,v===f(x,set.d)?col('ok'):col('bad'),7);}});
    if(st.s3.zeroOk[st.s3.set])vline(set.d,col('blue'),'x '+(set.d>0?'−':'+')+' '+fmt(Math.abs(set.d))+' = 0');
  } else if(k==='s5'){
    parabola(0,0,norm,2.5,[9,7]);
    if(st.s5.target!==null){var T=st.s5.target;
      if(st.s5.mode==='graph')parabola(T,0,col('target'),3,[4,8]);
      else if(st.s5.mode==='scheitel'){dot(T,0,col('target'),9);label('S('+fmt(T)+' | 0)',T,.9,col('target'),T>3);}
    }

   mc.map(function(m,i){return '<button type="button" class="opt'+(st.s1.mc===i?(i===0?' ok':' bad'):'')+'" data-i="'+i+'">'+m+'</button>';}).join('')+'</div><p class="fb" id="fbmc"></p></div>'+

/* ---------- Station 2: Vorhersagen ---------- */
function newRound2(){var d;do{d=Math.floor(Math.random()*9)-4;}while(d===0||d===st.s2.last);st.s2.d=d;st.s2.last=d;st.s2.dir=null;st.s2.phase='ask';st.s2.anim=null;}

function animate(from,to,set,done){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||from===to){set(to);done();return;}
  var t0=null,dur=900+Math.abs(to-from)*150;
  function step(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur),q=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;set(from+(to-from)*q);if(p<1)requestAnimationFrame(step);else{set(to);done();}}
  requestAnimationFrame(step);
}
function run2(){
  var d=st.s2.d,n=parse($('s2n').value),vx=parse($('s2x').value),vy=parse($('s2y').value),fb=$('fb2');
  if(!st.s2.dir||isNaN(n)||isNaN(vx)||isNaN(vy)){fb.className='fb bad';fb.textContent='Fülle zuerst alles aus: Richtung, Einheiten und Scheitelpunkt.';return;}
  st.s2.phase='show';$('go2').disabled=true;
  var dirOk=(d>0&&st.s2.dir==='rechts')||(d<0&&st.s2.dir==='links'),nOk=n===Math.abs(d),sOk=vx===d&&vy===0;
  animate(0,d,function(v){st.s2.anim=v;draw();},function(){
    var cls,txt;
    if(dirOk&&nOk&&sOk){st.s2.hits=Math.min(3,st.s2.hits+1);cls='fb ok';txt='Richtig vorhergesagt! '+termTxt(d)+' fährt '+fmt(Math.abs(d))+' nach '+(d>0?'rechts':'links')+', S('+fmt(d)+' | 0).';if(st.s2.hits>=3)finish(1);}
    else{var t=[];if(!dirOk)t.push(d>0?'Minus in der Klammer → nach rechts':'Plus in der Klammer → nach links');if(!nOk)t.push('Einheiten: '+fmt(Math.abs(d)));if(!sOk)t.push('Scheitelpunkt: S('+fmt(d)+' | 0)');cls='fb bad';txt='Schau genau hin: '+t.join(' · ')+'.';}
    save();r2();$('fb2').className=cls;$('fb2').textContent=txt;$('s2n').value=n;$('s2x').value=vx;$('s2y').value=vy;
  });
}

/* ---------- Station 4: Regel finden + Vermutung prüfen ---------- */
var GAPS=[

    if(!sg||isNaN(n)||isNaN(bx)||isNaN(by)){fb.className='fb bad';fb.textContent='Fülle den Term und den Scheitelpunkt aus.';return;}
    var v=sg==='-'?n:-n,ok=v===B.d;$('nn6').className='num '+(n===Math.abs(B.d)?'ok':'bad');$('sg6').className='sel '+((B.d>0)===(sg==='-')?'ok':'bad');
    $('bx').className='num '+(bx===B.d?'ok':'bad');$('by').className='num '+(by===0?'ok':'bad');
    if(ok&&bx===B.d&&by===0){s.shown=B.d;s.solved['b'+s.i]=1;save();draw();fb.className='fb ok';fb.textContent='Richtig! '+B.t+' = '+br(B.d)+'², also S('+fmt(B.d)+' | 0).';}
    else{fb.className='fb bad';fb.textContent=ok?'Der Term stimmt. Prüfe den Scheitelpunkt.':'Multipliziere deine Klammer zur Probe aus. Kommt '+B.t+' heraus?';}
  }
}

/* ---------- Gesamt ---------- */
function render(){renderRoute();[r1,r2,r3,r4,r5,r6][st.station]();updateTerm();draw();}

$('d').addEventListener('input',function(){setD(parseFloat(this.value));});
$('left').addEventListener('click',function(){setD(st.d-.5);});
$('right').addEventListener('click',function(){setD(st.d+.5);});
$('tNorm').addEventListener('change',function(){st.norm=this.checked;draw();});
$('tAxis').addEventListener('change',function(){st.axis=this.checked;draw();});
var armed=false;
$('reset').addEventListener('click',function(){
  if(!armed){armed=true;this.textContent='Wirklich alles löschen?';var b=this;setTimeout(function(){armed=false;b.textContent='Neu starten';},3500);return;}
  try{localStorage.removeItem(KEY);}catch(e){}location.reload();
});
cv.addEventListener('contextmenu',function(ev){ev.preventDefault();});
window.addEventListener('resize',resize);
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',draw);}
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);

load();if(!unlocked(st.station))st.station=0;
render();resize();setD(0);
})();
</script>
