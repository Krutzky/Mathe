<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Apps</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7486;
    --accent: #2f6fde;
    --accent-soft: #e6eefc;
    --border: #e1e5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2029;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --accent: #6c9cf0;
      --accent-soft: #23314b;
      --border: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 10px;
  }
  .app {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
  }
  a.app:active { transform: scale(0.99); }
  .nr {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    display: grid; place-items: center;
  }
  .titel { font-weight: 600; }
  .info { color: var(--muted); font-size: 0.9rem; }
  .pfeil { margin-left: auto; color: var(--accent); font-size: 1.3rem; }
  .gesperrt { opacity: 0.5; }
  .zurueck {
    display: inline-block;
    margin: 0 0 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .hinweis {
    margin-top: 32px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>Mathe-Apps</h1>
  <p class="sub">Wähle deinen Jahrgang.</p>

  <div id="liste"></div>

  <div class="hinweis">
    <strong>Abgeben:</strong> Tippe in der App oben auf <strong>„Ergebnisse abgeben“</strong> und lade die Datei herunter.
    Lade sie dann in <strong>IServ → Aufgaben</strong> bei der Aufgabe mit dem Namen der App hoch.
  </div>
</main>

<script>
  /* =========================================================
     HIER BEARBEITEN: Für jede neue App eine Zeile ergänzen.
     - jahrgang: z. B. "Jahrgang 7" (muss in JAHRGAENGE stehen).
              Weglassen = Thema steht direkt auf der Startseite.
     - thema: Überschrift (z. B. die Unterrichtseinheit)
     - nr:    Nummer auf der Kachel
     - titel: Name der App
     - info:  kurze Zeile unter dem Namen (optional)
     - datei: Dateiname der App im selben Repository.
              Leer lassen ("") = wird als „folgt bald“ angezeigt.
     - frei:  false = App ist hochgeladen, aber noch gesperrt („folgt bald“).
              Weglassen oder true = App ist anklickbar.
     - ab:    (optional) Datum, ab dem die App automatisch frei ist,
              z. B. ab: "2026-11-03". Davor steht sie auf „folgt bald“.
     ========================================================= */
  const JAHRGAENGE = ["Jahrgang 5", "Jahrgang 6", "Jahrgang 7", "Jahrgang 8", "Jahrgang 9", "Jahrgang 10"];

  const apps = [
    { jahrgang: "Jahrgang 5", thema: "Modul 5.1", nr: 1, titel: "Fit für Diagramme", info: "Diagramme lesen, zeichnen und prüfen", datei: "Jahrgang%2005/Modul%205.1/Fit%20f%C3%BCr%20Diagramme.html" },
    { jahrgang: "Jahrgang 5", thema: "Modul 5.2", nr: 1, titel: "Vertauschungsgesetz und Verbindungsgesetz", info: "Geschickt rechnen: Input, 4 Forscheraufträge und Kurz-Check", datei: "Jahrgang%2005/Modul%205.2/Vertauschungsgesetz%20und%20Verbindungsgesetz/Vertauschungsgesetz%20und%20Verbindungsgesetz.html" },
    { jahrgang: "Jahrgang 5", thema: "Modul 5.2", ordner: "Türkisch", nr: 1, titel: "Türkisch", info: "", datei: "" },
    { jahrgang: "Jahrgang 5", thema: "Modul 5.3", nr: 1, titel: "Modul 5.3", info: "", datei: "" },
    { jahrgang: "Jahrgang 5", thema: "Modul 5.4", nr: 1, titel: "Modul 5.4", info: "", datei: "" },
    { jahrgang: "Jahrgang 5", thema: "Modul 5.5", nr: 1, titel: "Modul 5.5", info: "", datei: "" },
    { jahrgang: "Jahrgang 6", thema: "Modul 6.1", nr: 1, titel: "Modul 6.1", info: "", datei: "" },
    { jahrgang: "Jahrgang 6", thema: "Modul 6.2", nr: 1, titel: "Modul 6.2", info: "", datei: "" },
    { jahrgang: "Jahrgang 6", thema: "Modul 6.3", nr: 1, titel: "Modul 6.3", info: "", datei: "" },
    { jahrgang: "Jahrgang 6", thema: "Modul 6.4", nr: 1, titel: "Modul 6.4", info: "", datei: "" },
    { jahrgang: "Jahrgang 6", thema: "Modul 6.5", nr: 1, titel: "Modul 6.5", info: "", datei: "" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.1", nr: 1, titel: "Modul 7.1", info: "", datei: "" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.2", nr: 1, titel: "7.2 Proportionale und antiproportionale Zuordnung", info: "Fit für die Klassenarbeit: Stationen, Textaufgaben, Experten und Merkzettel", datei: "Jahrgang%2007/Modul%207.2/7.2%20Proportionale%20und%20antiproportionale%20Zuordnung.html" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.2", nr: 2, titel: "Dreisatz bei proportionalen Zuordnungen", info: "Waldis Klassenfahrt: Textaufgaben in vier Etappen", datei: "Jahrgang%2007/Modul%207.2/Dreisatz%20bei%20proportionalen%20Zuordnungen/Dreisatz%20bei%20proportionalen%20Zuordnungen.html" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.2", nr: 3, titel: "Antiproportionale Zuordnungen", info: "Waldis Je-mehr-desto-weniger: erkennen, prüfen und rechnen in vier Stationen", datei: "Jahrgang%2007/Modul%207.2/Antiproportionale%20Zuordnungen/Antiproportionale%20Zuordnungen.html" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.2", ordner: "Wissens-Check 7.2", nr: 1, titel: "Waldis Wissens-Check 7.2 A2", info: "Dreisatz-Test: 5 Aufgaben in 10 Minuten, bestanden ab 4 richtigen", datei: "Jahrgang%2007/Modul%207.2/Wissens-Check%207.2/Waldis%20Wissens-Check%207.2%20A2.html" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.3", nr: 1, titel: "Modul 7.3", info: "", datei: "" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.4", nr: 1, titel: "Modul 7.4", info: "", datei: "" },
    { jahrgang: "Jahrgang 7", thema: "Modul 7.5", nr: 1, titel: "Modul 7.5", info: "", datei: "" },
    { jahrgang: "Jahrgang 8", thema: "Modul 8.1", nr: 1, titel: "Modul 8.1", info: "", datei: "" },
    { jahrgang: "Jahrgang 8", thema: "Modul 8.2", nr: 1, titel: "Modul 8.2", info: "", datei: "" },
    { jahrgang: "Jahrgang 8", thema: "Modul 8.3", nr: 1, titel: "Modul 8.3", info: "", datei: "" },
    { jahrgang: "Jahrgang 8", thema: "Modul 8.4", nr: 1, titel: "Modul 8.4", info: "", datei: "" },
    { jahrgang: "Jahrgang 8", thema: "Modul 8.5", nr: 1, titel: "Modul 8.5", info: "", datei: "" },
    { jahrgang: "Jahrgang 9", thema: "Modul 9.1", nr: 1, titel: "Modul 9.1", info: "", datei: "" },
    { jahrgang: "Jahrgang 9", thema: "Modul 9.2", nr: 1, titel: "Modul 9.2", info: "", datei: "" },
    { jahrgang: "Jahrgang 9", thema: "Modul 9.3", nr: 1, titel: "Modul 9.3", info: "", datei: "" },
    { jahrgang: "Jahrgang 9", thema: "Modul 9.4", nr: 1, titel: "Modul 9.4", info: "", datei: "" },
    { jahrgang: "Jahrgang 9", thema: "Modul 9.5", nr: 1, titel: "Modul 9.5", info: "", datei: "" },
    { jahrgang: "Jahrgang 10", thema: "Quadratische Funktionen – Parabeln", nr: 1, titel: "Parabel-Fahrstuhl", info: "Wie verändert e die Parabel y = x² + e?", datei: "Jahrgang%2010/Modul%2010.1/parabel/parabel-fahrstuhl.html" },
    { jahrgang: "Jahrgang 10", thema: "Quadratische Funktionen – Parabeln", nr: 2, titel: "Parabel-Kran", info: "Wie verschiebt d die Parabel y = (x − d)²?", datei: "Jahrgang%2010/Modul%2010.1/parabel/parabel-kran.html" },
    { jahrgang: "Jahrgang 10", thema: "Quadratische Funktionen – Parabeln", nr: 3, titel: "Skatepark-Baustelle", info: "Kran-Check (d) und der neue Form-Regler a", datei: "Jahrgang%2010/Modul%2010.1/parabel/skatepark-baustelle.html" },
    { jahrgang: "Jahrgang 10", thema: "Quadratische Funktionen – Parabeln", nr: 4, titel: "Skatepark-Bauleitung", info: "Baupläne lesen: y = a(x − d)² + e", datei: "Jahrgang%2010/Modul%2010.1/parabel/skatepark-bauleitung.html" },
    { jahrgang: "Jahrgang 10", thema: "ZP-10 Vorbereitung", nr: 1, titel: "Kahoot! ZP 10", info: "Fit für die Zentrale Prüfung: Teil 1 und Teil 2", datei: "Jahrgang%2010/zp10-vorbereitung.html" },
    { jahrgang: "Jahrgang 10", thema: "Kopfrechnen Kahoot!", nr: 1, titel: "Kopfrechnen Kahoot!", info: "Fit für Teil 1: Kopfrechnen ohne Taschenrechner", datei: "Jahrgang%2010/Kopfrechnen%20Kahoot!.html" },
    { jahrgang: "Jahrgang 10", thema: "Modul 10.1", nr: 1, titel: "Modul 10.1", info: "", datei: "" },
    { jahrgang: "Jahrgang 10", thema: "Modul 10.2", nr: 1, titel: "Modul 10.2", info: "", datei: "" },
    { jahrgang: "Jahrgang 10", thema: "Modul 10.3", nr: 1, titel: "Modul 10.3", info: "", datei: "" },
    { jahrgang: "Jahrgang 10", thema: "Modul 10.4", nr: 1, titel: "Modul 10.4", info: "", datei: "" },
    { jahrgang: "Jahrgang 10", thema: "Modul 10.5", nr: 1, titel: "Modul 10.5", info: "", datei: "" },
  ];

  const liste = document.getElementById("liste");
  const sub = document.querySelector(".sub");
  const subStart = sub.textContent;

  function istOffen(app) {
    return !!app.datei && app.frei !== false &&
      (!app.ab || new Date() >= new Date(app.ab + "T00:00:00"));
  }
  function themenVon(liste) {
    const t = [];
    liste.forEach(a => { if (!t.includes(a.thema)) t.push(a.thema); });
    return t;
  }
  const ohneJahrgang = apps.filter(a => !a.jahrgang);

  function kachel(nr, titel, info, href, offen) {
    const el = document.createElement(offen ? "a" : "div");
    el.className = "app" + (offen ? "" : " gesperrt");
    if (offen) el.href = href;
    el.innerHTML =
      '<div class="nr"></div>' +
      '<div><div class="titel"></div><div class="info"></div></div>' +
      (offen ? '<div class="pfeil">›</div>' : '');
    el.querySelector(".nr").textContent = nr;
    el.querySelector(".titel").textContent = titel;
    el.querySelector(".info").textContent = info;
    return el;
  }
  function ueberschrift(t) {
    const h = document.createElement("h2"); h.textContent = t; liste.appendChild(h);
  }
  function zurueckLink(text, href) {
    const a = document.createElement("a");
    a.href = href; a.className = "zurueck"; a.textContent = "‹ " + text;
    liste.appendChild(a);
  }
  function anzahl(n, eins, viele) { return n + " " + (n === 1 ? eins : viele); }
  function hashFuer(o) {
    return "#" + Object.keys(o).map(k => k + "=" + encodeURIComponent(o[k])).join("&");
  }

  // Ebene 1: Startseite
  function zeigeUebersicht() {
    liste.innerHTML = "";
    sub.textContent = subStart;
    ueberschrift("Übersicht");
    let nr = 1;
    themenVon(ohneJahrgang).forEach(thema => {
      const offen = ohneJahrgang.filter(a => a.thema === thema && istOffen(a)).length;
      liste.appendChild(kachel(nr++, thema, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ t: thema }), offen > 0));
    });
    JAHRGAENGE.forEach(jg => {
      const jgApps = apps.filter(a => a.jahrgang === jg);
      const offen = jgApps.filter(istOffen).length;
      const nt = themenVon(jgApps.filter(istOffen)).length;
      liste.appendChild(kachel(nr++, jg, offen ? anzahl(nt, "Thema", "Themen") : "folgt bald",
        hashFuer({ j: jg }), offen > 0));
    });
  }

  // Ebene 2: Themen eines Jahrgangs
  function zeigeJahrgang(jg) {
    liste.innerHTML = "";
    sub.textContent = "Wähle dein Thema.";
    zurueckLink("Übersicht", "#");
    ueberschrift(jg);
    const jgApps = apps.filter(a => a.jahrgang === jg);
    themenVon(jgApps).forEach((thema, i) => {
      const offen = jgApps.filter(a => a.thema === thema && istOffen(a)).length;
      liste.appendChild(kachel(i + 1, thema, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ j: jg, t: thema }), offen > 0));
    });
  }

  // Ebene 3: Apps eines Themas
  function zeigeThema(jg, thema) {
    liste.innerHTML = "";
    sub.textContent = "Wähle eine App.";
    if (jg) zurueckLink(jg, hashFuer({ j: jg }));
    else zurueckLink("Übersicht", "#");
    ueberschrift(thema);
    const themaApps = apps.filter(a => (a.jahrgang || null) === (jg || null) && a.thema === thema);
    themaApps.filter(a => !a.ordner).forEach(app => {
      const offen = istOffen(app);
      liste.appendChild(kachel(app.nr, app.titel, offen ? (app.info || "") : "folgt bald", app.datei, offen));
    });
    // Ordner (Eintrag mit "ordner") stehen hinter den einzelnen Apps
    let nr = themaApps.filter(a => !a.ordner).length + 1;
    [...new Set(themaApps.filter(a => a.ordner).map(a => a.ordner))].forEach(ordner => {
      const offen = themaApps.filter(a => a.ordner === ordner && istOffen(a)).length;
      const ziel = jg ? { j: jg, t: thema, o: ordner } : { t: thema, o: ordner };
      liste.appendChild(kachel(nr++, ordner, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer(ziel), offen > 0));
    });
  }

  // Ebene 4: Apps in einem Ordner innerhalb eines Themas
  function zeigeOrdner(jg, thema, ordner) {
    liste.innerHTML = "";
    sub.textContent = "Wähle eine App.";
    zurueckLink(thema, hashFuer(jg ? { j: jg, t: thema } : { t: thema }));
    ueberschrift(ordner);
    apps.filter(a => (a.jahrgang || null) === (jg || null) && a.thema === thema && a.ordner === ordner).forEach(app => {
      const offen = istOffen(app);
      liste.appendChild(kachel(app.nr, app.titel, offen ? (app.info || "") : "folgt bald", app.datei, offen));
    });
  }

  function anzeigen() {
    const p = {};
    location.hash.replace(/^#/, "").split("&").forEach(x => {
      const k = x.indexOf("=");
      if (k > 0) p[x.slice(0, k)] = decodeURIComponent(x.slice(k + 1));
    });
    const jg = JAHRGAENGE.includes(p.j) ? p.j : null;
    if (p.t && p.o && apps.some(a => (a.jahrgang || null) === jg && a.thema === p.t && a.ordner === p.o)) zeigeOrdner(jg, p.t, p.o);
    else if (p.t && apps.some(a => (a.jahrgang || null) === jg && a.thema === p.t)) zeigeThema(jg, p.t);
    else if (jg) zeigeJahrgang(jg);
    else zeigeUebersicht();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", anzeigen);
  anzeigen();
</script>
</body>
</html>
